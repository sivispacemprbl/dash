  if(DB){clearTimeout(_rzs);_rzs=setTimeout(()=>{const c=Object.assign({},RZ.cfg);delete c.mapa;DB.doc('config/rodizio').set({cfg:JSON.parse(JSON.stringify(c)),em:RZ.cfg.atualizadoEm}).catch(()=>{})},600)}
  if(msg)toast(msg);rzRerender()}
function rzRerender(){const y=scrollY;render();scrollTo(0,y)}

/* ---------- escala ---------- */
function rzAlvoMin(){let d=rzHoje(),k=0;while(k<15){d=RM.proximoDiaUtil(RM.addDias(d,1),rzFer());k++}return d}
function rzEscalaAte(d){const m=rzAlvoMin(),ate=d>m?d:m;if(RZ.cache&&RZ.cache.ate>=ate)return RZ.cache.dias;const dias=RM.simular(RZ.cfg,ate);RZ.cache={ate,dias};return dias}
const rzDia=d=>rzEscalaAte(d).find(x=>x.data===d);
const rzMeta=u=>{const m=RZ.cfg.metas||{moto:25,carro:10};return u&&u.tipo==='carro'?m.carro:m.moto};
function rzFeitos(d){RZ.cfg.feitos=RZ.cfg.feitos||{};return RZ.cfg.feitos[d]||{}}
function rzFora(d){return rzAtivos().filter(u=>!RM.disponiveis([u],d,RZ.cfg.ausencias).length).map(u=>({u,a:(RZ.cfg.ausencias||[]).find(x=>x.id===u.id&&x.de<=d&&d<=x.ate)}))}
function rzAusencia(id,de,ate,motivo){RZ.cfg.ausencias=RZ.cfg.ausencias||[];let d=de,g=0;const fim=ate||de;
  while(d<=fim&&g++<400){if(Object.keys(rzFeitos(d)).length){const dia=rzDia(d);if(dia){RZ.cfg.ajustes=RZ.cfg.ajustes||{};RZ.cfg.ajustes[d]=dia.itens.filter(i=>i.unidade!==id)}}d=RM.addDias(d,1)}
  RZ.cfg.ausencias.push({id,de,ate:fim,motivo:motivo||'Falta'});RZ.cache=null}
function rzTroca(d,id,novo){const dia=rzDia(d);if(!dia)throw new Error('Sem escala nesse dia');const it=dia.itens.map(x=>({unidade:x.unidade,setor:x.setor}));
  const meu=it.find(x=>x.unidade===id);if(!meu)throw new Error(rzNome(id)+' não está escalado nesse dia');const outro=it.find(x=>+x.setor===+novo&&x.unidade!==id);
  if(outro)outro.setor=meu.setor;meu.setor=+novo;RZ.cfg.ajustes=RZ.cfg.ajustes||{};RZ.cfg.ajustes[d]=it;return outro?rzNome(outro.unidade):null}
function rzWhats(d){const dia=rzDia(d);if(!dia)return '';let t='*Escala '+rzFmt(d,true)+'* – Corte e Cobrança São Mateus\n\n';
  dia.itens.forEach(it=>{const s=rzSetor(it.setor)||{};t+='• '+rzNome(it.unidade)+' → Setor '+it.setor+' ('+(s.bairros||'')+')\n'});
  const f=rzFora(d);if(f.length)t+='\nFora: '+f.map(x=>rzNome(x.u.id)+(x.a?' ('+x.a.motivo+')':'')).join(', ');return t}

/* ---------- ligação com o GeoCall ---------- */
function rzEqDe(u){if(!u)return null;const base=rzNorm(String(u.nome).split('+')[0]);const ks=Object.keys(REG);const b=base.split(' ');
  return ks.find(k=>rzNorm(k)===base)||ks.find(k=>{const a=rzNorm(k).split(' ');return a[0]===b[0]&&a[1]===b[1]})||ks.find(k=>rzNorm(k).split(' ')[0]===b[0]&&b.length<3)||null}
function rzUniDeEq(eq){return RZ.cfg.unidades.find(u=>rzEqDe(u)===eq)||null}
/* estatísticas de produção por setor (SF) e por colaborador × setor, no período filtrado */
function rzStats(rows){
  const bySf=groupBy(rows.filter(r=>r.sf),r=>String(r.sf));const A=agg(rows);
  const setores=[...bySf].map(([sf,rs])=>{const a=agg(rs);const fech=rs.filter(r=>/IM[OÓ]VEL FECHADO/.test(r.res||'')).length;
    const bands=BANDS.map(([l,h0,h1])=>{const b=rs.filter(r=>isBaixa(r)&&hourOf(r)>=h0&&hourOf(r)<h1);const x=agg(b);return {l,n:b.length,pr:x.den?x.prod/x.den*100:null}});
    return {sf,rs,a,fech,fechP:a.den?fech/a.den*100:0,fimP:a.rec?a.FIMDIA/a.rec*100:0,dias:new Set(rs.map(r=>r.day)).size,cols:new Set(rs.map(r=>r.eq)).size,bands,bai:[...new Set(rs.map(r=>r.bai))]}});
  const cross={};rows.forEach(r=>{if(!r.sf)return;const k=r.eq+'|'+r.sf;(cross[k]=cross[k]||[]).push(r)});
  const cx={};Object.entries(cross).forEach(([k,rs])=>cx[k]=agg(rs));
  const tf=setores.reduce((q,x)=>q+x.fech,0),td=setores.reduce((q,x)=>q+x.a.den,0),tfim=setores.reduce((q,x)=>q+x.a.FIMDIA,0),trec=setores.reduce((q,x)=>q+x.a.rec,0);
  const fechAvg=td?tf/td*100:0,fimAvg=trec?tfim/trec*100:0;
  return {A,setores,cx,avg:A.den?A.prod/A.den*100:0,fechAvg,fimAvg,fechLim:Math.max(40,fechAvg+8),fimLim:Math.max(15,fimAvg+7)}}
function rzFreq(janela){const v={};janela.forEach(x=>x.itens.forEach(i=>v[i.setor]=(v[i.setor]||0)+1));return v}
function rzJanela(){const d=RZ.dia;let fim=d,k=0;while(k<9){fim=RM.proximoDiaUtil(RM.addDias(fim,1),rzFer());k++}return rzEscalaAte(fim).filter(x=>x.data<=fim).slice(-20)}
function rzJustica(jan){const p={};jan.forEach(z=>z.itens.forEach(i=>{const s=rzSetor(i.setor)||{peso:0,potencial:''};const r=p[i.unidade]||(p[i.unidade]={dias:0,pts:0,alto:0});r.dias++;r.pts+=+s.peso||0;if(rzTK(s.potencial)==='ALTO')r.alto++}));return p}

/* pontos de melhoria: cruza potencial do setor, frequência no rodízio e o resultado real das OS */
function rzInsights(ST){
  const out=[];const avg=ST.avg;const noRod=RZ.cfg.setores.filter(s=>s.peso>0);const jan=rzJanela();const fq=rzFreq(jan);
  const bySf=Object.fromEntries(ST.setores.map(s=>[s.sf,s]));const f1=x=>x.toFixed(0);
  ST.setores.filter(s=>s.a.den>=20).forEach(s=>{const cfg=rzSetor(s.sf);const pr=s.a.prod/s.a.den*100;
    if(cfg&&(rzTK(cfg.potencial)==='ALTO'||cfg.peso>=4)&&pr<avg-5)out.push({lv:'alto',sf:s.sf,imp:(avg-pr)*s.a.den,t:`Setor ${s.sf} é potencial ${cfg.potencial}, mas rende ${f1(pr)}% (média da equipe ${f1(avg)}%)`,d:`${fmt(s.a.den)} OS trabalhadas. Revisar a qualidade das ordens programadas ou reduzir o peso para liberar a equipe para setores que rendem mais.`,a:'Ver OS do setor'});
    if(cfg&&cfg.peso<=2&&cfg.peso>0&&pr>avg+5)out.push({lv:'op',sf:s.sf,imp:(pr-avg)*s.a.den,t:`Setor ${s.sf} rende ${f1(pr)}%, acima da média, mas tem peso ${cfg.peso}`,d:`Subir o peso faz a equipe voltar lá com mais frequência (hoje aparece ${fq[s.sf]||0} vez(es) em ${jan.length} dias úteis).`,a:'Ajustar peso',peso:true});
    if(s.fechP>=ST.fechLim)out.push({lv:'med',sf:s.sf,imp:s.fech,t:`Muito imóvel fechado no setor ${s.sf}: ${f1(s.fechP)}% das OS trabalhadas (média ${f1(ST.fechAvg)}%)`,d:(()=>{const b=s.bands.filter(x=>x.n>=10&&x.pr!=null).sort((x,y)=>y.pr-x.pr);return b.length>1?`Melhor faixa: ${b[0].l} (${f1(b[0].pr)}%) · pior: ${b[b.length-1].l} (${f1(b[b.length-1].pr)}%). Programar esse setor para começar na melhor faixa.`:'Tentar outro horário de visita ou reprogramar em lote.'})(),a:'Ver OS do setor'});
  });
  noRod.forEach(s=>{if(!bySf[String(s.codigo)]&&(fq[s.codigo]||0)>0)out.push({lv:'info',sf:String(s.codigo),imp:1,t:`Setor ${s.codigo} está no rodízio, mas não tem OS no período filtrado`,d:'Confirmar no GeoCall se há ordens para esse setor. Se não houver, baixe o peso para não mandar ninguém à toa.',a:'Ajustar peso',peso:true})});
  ST.setores.forEach(s=>{const cfg=rzSetor(s.sf);if(s.a.rec>=20&&(!cfg||!(cfg.peso>0)))out.push({lv:'op',sf:s.sf,imp:s.a.rec,t:`Setor ${s.sf} tem ${fmt(s.a.rec)} OS no GeoCall, mas está fora do rodízio`,d:cfg?'Está com peso 0. Coloque um peso para ele entrar na escala.':'Não está cadastrado no rodízio. Se for da área, cadastre em Pesos dos setores.',a:'Ver OS do setor'})});
  // colaborador: onde rende mais × menos
  const byEq={};Object.entries(ST.cx).forEach(([k,a])=>{const [eq,sf]=k.split('|');if(a.den<15)return;(byEq[eq]=byEq[eq]||[]).push({sf,pr:a.prod/a.den*100,n:a.den})});
  Object.entries(byEq).forEach(([eq,l])=>{if(l.length<2)return;l.sort((x,y)=>y.pr-x.pr);const b=l[0],w=l[l.length-1];if(b.pr-w.pr>=20)out.push({lv:'op',eq,sf:b.sf,imp:(b.pr-w.pr)*5,t:`<span class="rzn">${esc(nomeDe(eq))}</span> rende ${f1(b.pr)}% no setor ${b.sf} e ${f1(w.pr)}% no ${w.sf}`,d:'Vale entender o que muda entre os dois setores (tipo de ordem, horário, trajeto). Quando precisar trocar alguém, prefira mandar essa pessoa para onde ela rende mais.',a:'Ver OS dele'})});
  // justiça do rodízio
  const J=rzJustica(jan);const vals=rzAtivos().map(u=>J[u.id]?J[u.id].pts/J[u.id].dias:null).filter(x=>x!=null);const m=vals.reduce((s,x)=>s+x,0)/(vals.length||1);
  rzAtivos().forEach(u=>{const r=J[u.id];if(!r)return;const v=r.pts/r.dias;if(Math.abs(v-m)>=.8)out.push({lv:v<m?'med':'info',tab:'semana',imp:.5,t:`<span class="rzn">${esc(u.curto||u.nome)}</span> está com setores ${v<m?'mais fracos':'mais fortes'} que a média (${v.toFixed(1).replace('.',',')} × ${m.toFixed(1).replace('.',',')})`,d:'O rodízio corrige isso sozinho nos próximos dias; se persistir, confira faltas e ajustes manuais.',a:'Ver semana'})});
  // cobertura dos setores ALTO
  const altos=noRod.filter(s=>rzTK(s.potencial)==='ALTO');altos.forEach(s=>{const v=fq[s.codigo]||0;if(jan.length>=10&&v<jan.length*.5)out.push({lv:'med',sf:String(s.codigo),imp:2,t:`Setor ${s.codigo} (ALTO) recebe equipe só ${v} vez(es) em ${jan.length} dias úteis`,d:'Setor de maior arrecadação deveria ter equipe quase todo dia. Suba o peso ou confira se há faltas seguidas.',a:'Ajustar peso',peso:true})});
  const ord={alto:0,med:1,op:2,info:3};return out.sort((x,y)=>ord[x.lv]-ord[y.lv]||y.imp-x.imp)}

/* ---------- mapa ---------- */
const rzFormas=()=>(RZ.cfg&&RZ.cfg.formas)||window.RZ_FORMAS||null;
const RZ_MM=[['escala','Escala do dia'],['prod','Produtividade'],['pot','Potencial'],['ruas','Mapa de ruas']];
const rzProdCor=pr=>pr==null?null:pr>=META?'#22c55e':pr>=45?'#86efac':pr>=35?'#facc15':pr>=25?'#fb923c':'#ef4444';
function rzMapaHTML(d,ST){
  const mm=RZ.mm||'escala';const F=rzFormas();
  const dia=rzDia(d),it=dia?dia.itens:[],f=rzFeitos(d),quem={};it.forEach(i=>quem[i.setor]=i.unidade);
  const bar=`<div class="rzmm" role="tablist">${RZ_MM.filter(m=>m[0]!=='ruas'||rzMapa()).map(([k,l])=>`<button type="button" class="${mm===k?'on':''}" data-rz="mm" data-m="${k}">${l}</button>`).join('')}</div>`;
  if(mm==='ruas'||!F){const src=rzMapa();if(!src)return bar+'<p class="note">Mapa não carregado. Importe o pacote do rodízio em “Equipe e faltas”.</p>';
    return bar+`<div class="rzmap" id="rzMap"><img src="${src}" alt="Mapa dos setores com ruas" draggable="false" class="rzs">${RZ.cfg.setores.map(s=>{const p=MAPA_POS[s.codigo];if(!p)return '';const u=quem[s.codigo];
      return `<button type="button" class="rzpin ${u?'on':'off'} ${u&&f[u]?'ok':''} ${RZ.sel===+s.codigo?'sel':''}" data-rz="setor" data-c="${s.codigo}" style="left:${(p[0]/16).toFixed(2)}%;top:${(p[1]/7.96).toFixed(2)}%;--t:${rzCol(s.potencial)}" aria-label="Setor ${s.codigo}"><b class="rzs">${s.codigo}</b>${u?`<span class="rzn">${esc(rzNome(u))}</span>`:''}</button>`}).join('')}</div>
      <div class="rzleg"><span>Mapa original com as ruas · toque num setor para ver os detalhes</span></div>`}
  const st={};(ST?ST.setores:[]).forEach(x=>st[x.sf]=x);
  const cell=s=>{const c=String(s.codigo),u=quem[s.codigo],x=st[c],pr=x&&x.a.den>=10?x.a.prod/x.a.den*100:null;
    let fill,op,l2='';
    if(mm==='escala'){fill=u?rzCol(s.potencial):'#1b3358';op=u?.85:1;l2=u?rzNome(u):''}
    else if(mm==='prod'){fill=rzProdCor(pr)||'#1b3358';op=pr==null?1:.85;l2=pr==null?'sem dados':pr.toFixed(0)+'%'}
    else{fill=rzCol(s.potencial);op=.85;l2=s.potencial}
    return {c,u,fill,op,l2,pr,ok:u&&f[u]}};
  const cells=RZ.cfg.setores.filter(s=>F.paths[String(s.codigo)]).map(s=>Object.assign(cell(s),{s}));
  const tip=x=>{const s=x.s,a=st[x.c];return `<b>Setor ${x.c}</b> · ${esc(s.potencial||'')}<br>${esc(s.bairros||'')}<br>${x.u?'Hoje: <b>'+esc(rzNome(x.u))+'</b>'+(x.ok?' ✓':''):'Sem equipe neste dia'}${a?`<br>GeoCall: ${pct(a.a.prod,a.a.den)}% em ${fmt(a.a.den)} OS`:''}`.replace(/"/g,'&quot;')};
  const svg=`<svg class="rzsvg" viewBox="0 0 ${F.w} ${F.h}" role="img" aria-label="Mapa esquemático dos setores">
    <defs><filter id="rzGlow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="14"/></filter></defs>
    <path d="${F.outline}" fill="rgba(124,199,255,.16)" filter="url(#rzGlow)"/>
    <path d="${F.outline}" fill="#0f2445" stroke="rgba(124,199,255,.45)" stroke-width="2"/>
    ${cells.map(x=>`<path class="rzreg ${RZ.sel===+x.c?'sel':''} ${mm==='escala'&&!x.u?'vazio':''}" d="${F.paths[x.c]}" fill="${x.fill}" fill-opacity="${x.op}" data-rz="setor" data-c="${x.c}" data-tip="${tip(x)}"/>`).join('')}
    ${cells.filter(x=>RZ.sel===+x.c).map(x=>`<path d="${F.paths[x.c]}" fill="none" stroke="#fff" stroke-width="4" pointer-events="none"/>`).join('')}
    ${cells.map(x=>{const p=F.pole[x.c];if(!p)return '';const sm=p[2]<24;const dark=(mm!=='escala'||x.u)&&mm!=='pot'?'':'';
      return `<g class="rzlbl" pointer-events="none" transform="translate(${p[0]} ${p[1]})"><text class="rzs" y="${sm?6:-4}" font-size="${sm?17:27}" font-weight="700">${x.c}${x.ok?' ✓':''}</text>${sm?'':`<text class="${mm==='escala'&&x.u?'rzn':''}" y="18" font-size="16.5" font-weight="600">${esc(x.l2)}</text>`}</g>`}).join('')}
  </svg>`;
  const leg=mm==='escala'?`${RZ_TIERS.map(t=>`<span><i style="background:${rzCol(t)}"></i>${t} com equipe</span>`).join('')}<span><i style="background:#1b3358;box-shadow:inset 0 0 0 1px #3b5a86"></i>sem equipe</span><span>✓ programado no GeoCall</span>`
    :mm==='prod'?`<span><i style="background:#22c55e"></i>${META}% ou mais</span><span><i style="background:#86efac"></i>45–${META}%</span><span><i style="background:#facc15"></i>35–45%</span><span><i style="background:#fb923c"></i>25–35%</span><span><i style="background:#ef4444"></i>abaixo de 25%</span><span><i style="background:#1b3358"></i>menos de 10 OS</span><span class="muted">GeoCall · período filtrado</span>`
    :RZ_TIERS.map(t=>`<span><i style="background:${rzCol(t)}"></i>${t}</span>`).join('')+'<span class="muted">potencial de arrecadação do setor</span>';
  return bar+`<div class="rzmap rzvec" id="rzMap">${svg}</div><div class="rzleg">${leg}</div>`}
function rzFicha(c,d,ST){const s=rzSetor(c);if(!s)return `<div class="rzf-vazia"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#7cc7ff" stroke-width="1.6"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><b>Toque num setor do mapa</b><span>Veja bairros, quem está lá, próximas visitas e como o setor rende no GeoCall.</span></div>`;
  const dia=rzDia(d),it=dia&&dia.itens.find(i=>+i.setor===+c);let fim=d,k=0;while(k<9){fim=RM.proximoDiaUtil(RM.addDias(fim,1),rzFer());k++}
  const todos=rzEscalaAte(fim);const prox=todos.filter(x=>x.data>d&&x.itens.some(i=>+i.setor===+c)).slice(0,4);const ant=todos.filter(x=>x.data<d&&x.itens.some(i=>+i.setor===+c)).slice(-3).reverse();
  const lin=x=>{const i=x.itens.find(y=>+y.setor===+c);return `<li><span>${rzFmt(x.data)}</span><b class="rzn">${esc(rzNome(i.unidade))}</b></li>`};
  const st=ST.setores.find(x=>x.sf===String(c));const pr=st&&st.a.den?st.a.prod/st.a.den*100:null;
  const best=st?Object.entries(ST.cx).filter(([k,a])=>k.endsWith('|'+c)&&a.den>=8).map(([k,a])=>({eq:k.split('|')[0],pr:a.prod/a.den*100,n:a.den})).sort((x,y)=>y.pr-x.pr).slice(0,3):[];
  return `<div class="rzf" style="--t:${rzCol(s.potencial)}"><div class="rzf-top"><span class="rzf-cod rzs">${s.codigo}</span><div>${rzTier(s.potencial)}<small>Grupo ${esc(s.grupo||'—')} · peso ${s.peso}</small></div><button type="button" class="rzx" data-rz="fechar" aria-label="Fechar">×</button></div>
   <div class="rzf-sec"><span class="rzl">Bairros</span><div class="rzbai rzs">${String(s.bairros||'').split(' / ').map(b=>`<span>${esc(b)}</span>`).join('')}</div></div>
   <div class="rzf-sec"><span class="rzl">${rzFmt(d,true)}</span>${it?`<b class="rzf-quem rzn">${esc(rzNome(it.unidade))}</b>${rzFeitos(d)[it.unidade]?' <span class="st p">programado</span>':''}`:'<span class="muted">Sem equipe neste dia</span>'}</div>
   <div class="rzf-sec"><span class="rzl">No GeoCall (período filtrado)</span>${st?`<div class="rzf-k"><div><b class="${pr>=META?'up':'dn'}">${pct(st.a.prod,st.a.den)}%</b><span>produtividade</span></div><div><b>${fmt(st.a.rec)}</b><span>OS</span></div><div><b>${fmt(st.a.pag)}</b><span>pagamentos</span></div><div><b>${st.fechP.toFixed(0)}%</b><span>imóvel fechado</span></div></div>
     ${best.length?`<div class="rzf-best">${best.map(b=>`<button type="button" data-rz="drill" data-sf="${c}" data-eq="${esc(b.eq)}"><span class="rzn">${esc(nomeDe(b.eq))}</span><b>${b.pr.toFixed(0)}%</b><em>${b.n} OS</em></button>`).join('')}</div>`:''}
     <button type="button" class="btn sm ghost" data-rz="drill" data-sf="${c}">Ver as ${fmt(st.a.rec)} OS do setor →</button>`:'<span class="muted">Sem OS deste setor nas planilhas do período.</span>'}</div>
   <div class="rzf-sec"><span class="rzl">Vizinhos</span><div class="rzviz">${(RM.VIZINHOS[c]||[]).map(v=>{const q=dia&&dia.itens.find(i=>+i.setor===+v);return `<button type="button" data-rz="setor" data-c="${v}">${rzChip(v)}<span class="${q?'rzn':''}">${q?esc(rzNome(q.unidade)):'livre'}</span></button>`}).join('')}</div></div>
   <div class="rzf-cols"><div><span class="rzl">Próximas visitas</span>${prox.length?`<ul class="rzvis">${prox.map(lin).join('')}</ul>`:'<span class="muted">—</span>'}</div><div><span class="rzl">Últimas visitas</span>${ant.length?`<ul class="rzvis">${ant.map(lin).join('')}</ul>`:'<span class="muted">—</span>'}</div></div>
   <div class="rzf-sec"><label class="rzl" for="rzPesoF">Prioridade no rodízio (peso)</label><select id="rzPesoF" data-rz="peso" data-c="${s.codigo}">${[0,1,2,3,3.5,4,5].map(p=>`<option value="${p}" ${+s.peso===p?'selected':''}>Peso ${p}</option>`).join('')}</select></div></div>`}

/* ---------- telas ---------- */
function rzDayBar(sub){const d=RZ.dia,h=rzHoje();return `<div class="rzday"><button type="button" class="btn ghost sm" data-rz="dia" data-dir="-1" aria-label="Dia anterior">‹</button><div><b>${rzFmt(d,true)}${d===h?' · hoje':''}</b><small>${sub}</small></div><button type="button" class="btn ghost sm" data-rz="dia" data-dir="1" aria-label="Próximo dia">›</button>${d!==rzDiaInicial()?'<button type="button" class="btn ghost sm" data-rz="hojeBtn">Hoje</button>':''}</div>`}
function rzSemExp(){const d=RZ.dia;return d<RZ.cfg.inicio?`<div class="panel"><p class="note">O rodízio começa em ${rzFmt(RZ.cfg.inicio,true)}.</p></div>`:!RM.ehDiaUtil(d,rzFer())?'<div class="panel"><p class="note">Dia sem expediente (fim de semana ou feriado).</p></div>':''}
function rzKpi(lab,val,tot,sub,cls,attr){return `<button type="button" class="kpi ${cls||''}" ${attr||''}><span class="lab">${lab}</span><span class="val">${val}${tot!=null?`<small class="rzkt">/ ${tot}</small>`:''}</span><span class="sub">${sub}</span></button>`}

/* ---------- Rodízio de Restabelecimento e Religação (semanas alternadas) ---------- */
const RR_DW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function rrCfg(){if(!RZ.cfg)return null;if(!RZ.cfg.rr){RZ.cfg.rr={ativo:true,ancora:'2026-10-05',semA:[1,3,5],semB:[2,4],porDia:1,part:RZ.cfg.unidades.filter(u=>u.tipo!=='carro').map(u=>u.id),ajustes:{}}}return RZ.cfg.rr}
function rrSegunda(d){const x=new Date(d+'T12:00:00');const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return RM.iso(x)}
function rrSemana(d){const c=rrCfg();const n=Math.floor(RM.diasEntre(rrSegunda(c.ancora),rrSegunda(d))/7);return ((n%2)+2)%2===0?'A':'B'}
function rrEhDia(d){const c=rrCfg();if(!c||!c.ativo)return false;if((RZ.cfg.feriados||[]).includes(d))return false;const w=new Date(d+'T12:00:00').getDay();return (rrSemana(d)==='A'?c.semA:c.semB).includes(w)}
/* escala: quem ficou mais tempo sem fazer religação vai primeiro; faltas, férias e desligados ficam de fora */
function rrEscalaAte(fim){const c=rrCfg();if(!c)return [];const out=[];const ult={};let d=rrSegunda(c.ancora),g=0;
  const ordem=id=>{const u=rzUni(id);return u?(u.ordem||0):99};
  while(d<=fim&&g++<800){if(rrEhDia(d)){let quem;
      if(c.ajustes&&c.ajustes[d])quem=c.ajustes[d].slice();
      else{const disp=c.part.filter(id=>{const u=rzUni(id);return u&&RM.disponiveis([u],d,RZ.cfg.ausencias).length});
        disp.sort((a,b)=>(ult[a]||'')<(ult[b]||'')?-1:(ult[a]||'')>(ult[b]||'')?1:ordem(a)-ordem(b));quem=disp.slice(0,Math.max(1,+c.porDia||1))}
      quem.forEach(id=>ult[id]=d);out.push({d,quem,aj:!!(c.ajustes&&c.ajustes[d])})}
    d=RM.addDias(d,1)}return out}
function rrDoDia(d){if(!rrEhDia(d))return null;return rrEscalaAte(d).find(x=>x.d===d)||null}
function rrProximos(de,n){const c=rrCfg();let fim=de,k=0;while(k<60){fim=RM.addDias(fim,1);k++}return rrEscalaAte(fim).filter(x=>x.d>=de).slice(0,n)}
const rrNomes=x=>x.quem.map(id=>esc(rzNome(id))).join(' e ');
function rrBanner(d){const x=rrDoDia(d);if(!x){const p=rrProximos(d,1)[0];return p?`<div class="rrb off"><span class="rrb-ic">↻</span><div><b>Sem religação ${d===rzHoje()?'hoje':'neste dia'}</b><span>Próxima: ${rzFmt(p.d,true)} · <span class="rzn">${rrNomes(p)}</span></span></div><button type="button" class="btn ghost sm" data-rz="tab" data-t="rr">Ver escala</button></div>`:''}
  return `<div class="rrb"><span class="rrb-ic">↻</span><div><b>${d===rzHoje()?'Hoje é':'Neste dia é'} dia de restabelecimento e religação</b><span>Responsável: <b class="rzn">${rrNomes(x)}</b>${x.aj?' · ajustado':''}</span></div><button type="button" class="btn ghost sm" data-rz="tab" data-t="rr">Ver escala</button></div>`}
function rzTelaRR(){const c=rrCfg();const hoje=RZ.dia;const L=rrProximos(rzHoje()<RZ.cfg.inicio?RZ.cfg.inicio:RM.addDias(rzHoje(),-0),12);
  const semAt=rrSemana(hoje),dias=s=>(s==='A'?c.semA:c.semB).map(w=>RR_DW[w]).join(' · ')||'—';
  const hist=rrEscalaAte(RM.addDias(rzHoje(),28));const cont={};hist.forEach(x=>x.quem.forEach(id=>cont[id]=(cont[id]||0)+1));const mx=Math.max(1,...Object.values(cont));
  const part=new Set(c.part);
  return `<div class="kpis">
   ${rzKpi('Esta semana',`<span class="rrkv">${dias(semAt)}</span>`,null,'semana '+semAt+' do revezamento','rr')}
   ${rzKpi('Semana que vem',`<span class="rrkv">${dias(semAt==='A'?'B':'A')}</span>`,null,'semana '+(semAt==='A'?'B':'A'),'')}
   ${rzKpi('Próximo dia',`<span class="rrkv">${L[0]?rzFmt(L[0].d):'—'}</span>`,null,L[0]?`<span class="rzn">${rrNomes(L[0])}</span>`:'','g')}
   ${rzKpi('Na escala',fmt(c.part.length),RZ.cfg.unidades.length,c.porDia+' por dia','')}
   ${rzKpi('Dias de religação',fmt(hist.filter(x=>x.d>=rzHoje()&&x.d<=RM.addDias(rzHoje(),27)).length),null,'nas próximas 4 semanas','pg')}
   ${rzKpi('Faltas no período',fmt((RZ.cfg.ausencias||[]).filter(a=>a.ate>=rzHoje()).length),null,'pulam a vez automaticamente','ct','data-rz="tab" data-t="equipe"')}</div>
  <div class="g2"><div class="panel"><h3>Próximos dias de religação <small>troque o responsável se precisar</small></h3><div class="rrl">${L.map(x=>{const w=new Date(x.d+'T12:00:00').getDay();return `<div class="rrd ${x.d===rzHoje()?'hoje':''}"><span class="rrdw"><b>${RR_DW[w]}</b>${x.d.slice(8,10)}/${x.d.slice(5,7)}</span><span class="rrs">sem. ${rrSemana(x.d)}</span>
     <select data-rz="rrTroca" data-d="${x.d}" aria-label="Responsável em ${x.d}">${c.part.map(id=>`<option value="${esc(id)}" ${x.quem[0]===id?'selected':''}>${esc(rzNome(id))}</option>`).join('')}</select>${x.aj?`<button type="button" class="btn ghost sm" data-rz="rrDesf" data-d="${x.d}">Automático</button>`:''}</div>`}).join('')||'<p class="note">Nenhum dia configurado.</p>'}</div>
   <div class="rzact"><button type="button" class="btn" data-rz="rrCopiar">Copiar escala para o WhatsApp</button></div></div>
   <div class="panel"><h3>Como funciona <small>revezamento automático</small></h3>
    <div class="rrcfg"><div><span class="rzl">Semana A</span><div class="rrw">${[1,2,3,4,5,6].map(w=>`<label><input type="checkbox" data-rz="rrDia" data-s="A" value="${w}" ${c.semA.includes(w)?'checked':''}>${RR_DW[w]}</label>`).join('')}</div></div>
     <div><span class="rzl">Semana B</span><div class="rrw">${[1,2,3,4,5,6].map(w=>`<label><input type="checkbox" data-rz="rrDia" data-s="B" value="${w}" ${c.semB.includes(w)?'checked':''}>${RR_DW[w]}</label>`).join('')}</div></div>
     <div><span class="rzl">Esta semana é</span><div class="rrw"><label><input type="radio" name="rrAt" data-rz="rrAt" value="A" ${semAt==='A'?'checked':''}>Semana A</label><label><input type="radio" name="rrAt" data-rz="rrAt" value="B" ${semAt==='B'?'checked':''}>Semana B</label></div></div>
     <div><span class="rzl">Pessoas por dia</span><select data-rz="rrPor">${[1,2,3].map(n=>`<option ${+c.porDia===n?'selected':''}>${n}</option>`).join('')}</select></div></div>
    <span class="rzl" style="margin-top:12px">Quem entra no revezamento <span class="muted" style="text-transform:none;letter-spacing:0">· contagem das próximas 4 semanas</span></span>
    <div class="svcb rrp">${RZ.cfg.unidades.filter(u=>u.status!=='inativo').map(u=>`<button type="button" data-rz="rrPart" data-u="${esc(u.id)}" class="${part.has(u.id)?'':'off'}"><span><i class="rrck">${part.has(u.id)?'✓':''}</i><span class="rzn">${esc(u.curto||u.nome)}</span></span><div class="bar"><i style="width:${(cont[u.id]||0)/mx*100}%;background:#38bdf8"></i></div><b>${cont[u.id]||0}</b><em>${part.has(u.id)?'dias':'fora'}</em></button>`).join('')}</div>
    <p class="note">Quem está há mais tempo sem fazer religação é o próximo. Faltas e férias lançadas em “Equipe e faltas” pulam a pessoa naquele dia, e ela entra na próxima vez. Feriados não têm religação.</p></div></div>`}
function rrWhats(){const L=rrProximos(rzHoje(),8);return '*Restabelecimento e religação* – próximos dias\n\n'+L.map(x=>'• '+rzFmt(x.d,true)+' → '+x.quem.map(rzNome).join(' e ')).join('\n')}

function rzTelaHoje(rows,ST){const d=RZ.dia;const se=rzSemExp();if(se)return rzDayBar('Programação no GeoCall')+se;
  const dia=rzDia(d),it=dia?dia.itens:[],f=rzFeitos(d),feitos=it.filter(i=>f[i.unidade]).length,comp=RM.complementos(it,RZ.cfg.setores);
  const noRod=RZ.cfg.setores.filter(s=>s.peso>0),altos=noRod.filter(s=>rzTK(s.potencial)==='ALTO'),altC=altos.filter(s=>it.some(i=>+i.setor===+s.codigo)).length;
  const fora=rzFora(d),cob={};it.forEach(i=>cob[i.setor]=1);const sem=rzOrdem().filter(s=>s.peso>0&&!cob[s.codigo]);
  const aj=!!(dia&&dia.ajustado);
  let h=rzDayBar('Programação no GeoCall')+`<div class="kpis">
   ${rzKpi('Em campo',it.length,rzAtivos().length,fora.length?fora.length+' fora de campo':'equipe completa','rr')}
   ${rzKpi('Setores ALTO cobertos',altC,altos.length,'maior arrecadação',altC===altos.length?'g':'sp')}
   ${rzKpi('Setores com equipe',it.length,noRod.length,sem.length+' sem equipe hoje','')}
   ${rzKpi('Programados no GeoCall',feitos,it.length,feitos===it.length&&it.length?'tudo lançado':'falta '+(it.length-feitos),feitos===it.length&&it.length?'g':'')}
   ${rzKpi('Meta do dia',fmt(it.reduce((s,i)=>s+rzMeta(rzUni(i.unidade)),0)),null,'ordens somando a equipe','pg')}
   ${rzKpi('Produtividade da equipe',pct(ST.A.prod,ST.A.den)+'%',null,'GeoCall · período filtrado',ST.avg>=META?'g':'ct','data-rz="tab" data-t="analise"')}</div>`;
  h+=rrBanner(d);const rrHoje=rrDoDia(d),rrSet=new Set(rrHoje?rrHoje.quem:[]);
  h+=`<div class="panel"><h3>Escala do dia <small>em ordem de prioridade · marque ✓ ao lançar no GeoCall</small></h3>
   <div class="rzprog"><div class="rzbar"><i style="width:${it.length?feitos/it.length*100:0}%"></i></div><span>${feitos} de ${it.length} programados</span>${aj?'<span class="st o">ajustado</span>':''}</div>
   <div class="rzcards">${it.map((x,i)=>{const s=rzSetor(x.setor)||{codigo:x.setor,bairros:'',potencial:''},u=rzUni(x.unidade)||{},ok=!!f[x.unidade];
     const eq=rzEqDe(u),a=eq&&ST.cx[eq+'|'+x.setor];const hist=a&&a.den?`<button type="button" class="rzhist" data-rz="drill" data-sf="${x.setor}" data-eq="${esc(eq)}" title="Histórico dessa pessoa neste setor no GeoCall">neste setor: <b class="${a.prod/a.den*100>=META?'up':'dn'}">${pct(a.prod,a.den,0)}%</b> em ${fmt(a.den)} OS</button>`:(eq?'<span class="rzhist muted">primeira vez neste setor no período</span>':'');
     return `<article class="rzcard ${ok?'done':''}" style="--t:${rzCol(s.potencial)}"><span class="rzn0">${i+1}</span><button type="button" class="rzcode rzs" data-rz="setor" data-c="${s.codigo}" title="Ver no mapa">${esc(s.codigo)}</button>
      <div class="rzbody"><div class="rzwho"><b class="rzn">${esc(u.curto||u.nome||x.unidade)}</b>${u.tipo==='carro'?'<span class="st n0">carro</span>':''}${rrSet.has(x.unidade)?'<span class="rrtag">↻ religação</span>':''}</div><div class="rzwhere rzs">${esc(s.bairros)}</div>
       <div class="rzmeta">${rzTier(s.potencial)}<span class="rzm">meta ${rzMeta(u)}</span>${(comp[x.unidade]||[]).length?'<span class="muted">se faltar:</span>'+comp[x.unidade].map(c=>`<button type="button" data-rz="setor" data-c="${c}" class="rzplus"><span class="rzchip rzs" style="--t:${rzCol((rzSetor(c)||{}).potencial)}">+${c}</span></button>`).join(''):''}</div>${hist}
       <details class="rzmore"><summary>Trocar setor ou marcar falta</summary><div class="rzedit"><label>Mandar para o setor<select data-rz="troca" data-u="${esc(x.unidade)}">${rzOrdem().filter(z=>z.peso>0).map(z=>`<option value="${z.codigo}" ${+z.codigo===+x.setor?'selected':''}>${z.codigo} · ${esc(z.potencial)}</option>`).join('')}</select></label><button type="button" class="btn sm ghost" data-rz="falta" data-u="${esc(x.unidade)}">Faltou hoje</button></div></details></div>
      <button type="button" class="rzchk" data-rz="feito" data-u="${esc(x.unidade)}" aria-pressed="${ok}" aria-label="Marcar como programado">${ok?'✓':''}</button></article>`}).join('')}</div>
   ${sem.length?`<div class="rzfora"><span>Sem equipe hoje:</span>${sem.map(s=>`<button type="button" data-rz="setor" data-c="${s.codigo}">${rzChip(s.codigo)}</button>`).join('')}</div>`:''}
   ${fora.length?`<div class="rzfora"><span>Fora de campo:</span>${fora.map(x=>`<span class="rzpill"><span class="rzn">${esc(x.u.curto||x.u.nome)}</span>${x.a?' · '+esc(x.a.motivo||'')+' até '+rzBR(x.a.ate):''}</span>`).join('')}</div>`:''}
   <div class="rzact"><button type="button" class="btn" data-rz="copiar">Copiar escala para o WhatsApp</button>${aj?(RZ.confirm==='desfazer'?'<button type="button" class="btn danger sm" data-rz="desfazerOk">Confirmar: voltar ao automático</button><button type="button" class="btn ghost sm" data-rz="cancelar">Cancelar</button>':'<button type="button" class="btn ghost sm" data-rz="desfazer">Desfazer ajustes do dia</button>'):''}</div>
   <p class="note">No GeoCall: busque o setor, arraste as ordens para o nome indicado e marque ✓. Se o setor tiver menos ordens que a meta, complete com os vizinhos indicados (estão sem ninguém no dia).</p></div>`;
  return h}

function rzTelaMapa(rows,ST){const d=RZ.dia;const se=rzSemExp();if(se)return rzDayBar('Toque num setor')+se;
  const dia=rzDia(d),quem={};(dia?dia.itens:[]).forEach(i=>quem[i.setor]=i.unidade);
  return rzDayBar('Toque num setor do mapa')+`<div class="rzmapg"><div class="panel"><h3>São Mateus · ${RZ.cfg.setores.length} setores <small>${dia?dia.itens.length:0} com equipe neste dia</small></h3>${rzMapaHTML(d,ST)}</div>
   <div class="panel rzficha">${rzFicha(RZ.sel,d,ST)}</div></div>
   <div class="panel"><h3>Setores e bairros <small>digite um bairro para achar o setor</small></h3><input type="search" id="rzBusca" class="rzin" placeholder="Buscar bairro (ex.: Iguatemi)" value="${esc(RZ.q)}" autocomplete="off">
   <div class="rzidx">${RZ.cfg.setores.slice().sort((a,b)=>a.codigo-b.codigo).map(s=>{const u=quem[s.codigo];return `<button type="button" class="${RZ.sel===+s.codigo?'sel':''}" data-rz="setor" data-c="${s.codigo}" data-b="${esc(rzNorm(s.codigo+' '+s.bairros))}" style="--t:${rzCol(s.potencial)}">${rzChip(s.codigo)}<span class="rzs">${esc(s.bairros)}</span><em class="${u?'rzn':'muted'}">${u?esc(rzNome(u)):'—'}</em></button>`}).join('')}</div><p class="muted" id="rzBv" hidden>Nenhum setor com esse bairro.</p></div>`}

function rzTelaSemana(){const ini=RM.proximoDiaUtil(RZ.dia,rzFer());const ds=[];let d=ini;while(ds.length<10){ds.push(d);d=RM.proximoDiaUtil(RM.addDias(d,1),rzFer())}rzEscalaAte(ds[ds.length-1]);
  const jan=rzJanela(),J=rzJustica(jan),mx=5;
  return rzDayBar('Próximos 10 dias úteis a partir deste dia')+`<div class="panel"><h3>Escala dos próximos 10 dias úteis <small>toque num dia para abrir a escala dele</small></h3><div class="tw"><table class="rzsem"><thead><tr><th>Colaborador</th>${ds.map(x=>`<th class="c"><button type="button" class="rzdh" data-rz="abrir" data-d="${x}">${rzFmt(x)}</button></th>`).join('')}</tr></thead><tbody>
   ${rzAtivos().map(u=>`<tr><td class="nw"><span class="rzn">${esc(u.curto||u.nome)}</span></td>${ds.map(x=>{const dz=rzDia(x),i=dz&&dz.itens.find(y=>y.unidade===u.id);return `<td class="c">${i?rzChip(i.setor):'<span class="muted">—</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>
   <div class="rzleg">${RZ_TIERS.map(t=>`<span><i style="background:${rzCol(t)}"></i>${t}</span>`).join('')}</div></div>
   <div class="panel"><h3>Justiça do rodízio <small>potencial médio dos setores de cada um em ${jan.length} dias úteis (1 = fraco, 5 = forte)</small></h3><div class="svcb">
   ${rzAtivos().map(u=>{const r=J[u.id],v=r?r.pts/r.dias:0;return `<button type="button" tabindex="-1"><span class="rzn">${esc(u.curto||u.nome)}</span><div class="bar"><i style="width:${v/mx*100}%;background:#2dd4bf"></i></div><b>${r?v.toFixed(1).replace('.',','):'—'}</b><em>${r?r.alto+' em ALTO':''}</em></button>`}).join('')}</div><p class="note">Barras parecidas = divisão justa dos setores fortes entre a equipe.</p></div>`}

function rzTelaAnalise(rows,ST){
  const ins=rzInsights(ST);const jan=rzJanela(),fq=rzFreq(jan);
  const S=ST.setores.slice().sort((a,b)=>b.a.rec-a.a.rec);const avg=ST.avg;
  const sig=s=>s.a.den>=20;const prs=S.filter(sig).map(s=>({s,pr:s.a.prod/s.a.den*100}));
  const best=prs.slice().sort((a,b)=>b.pr-a.pr)[0],worst=prs.slice().sort((a,b)=>a.pr-b.pr)[0],fech=S.filter(sig).slice().sort((a,b)=>b.fechP-a.fechP)[0];
  const altoBaixo=prs.filter(x=>{const c=rzSetor(x.s.sf);return c&&rzTK(c.potencial)==='ALTO'&&x.pr<avg}).length;
  const rec=s=>{const c=rzSetor(s.sf);const pr=s.a.den?s.a.prod/s.a.den*100:0;if(!c)return ['Fora do rodízio','o'];if(!sig(s))return ['Pouca amostra','n0'];
    if(s.fechP>=ST.fechLim)return ['Mudar horário','f'];if(c.peso>=4&&pr<avg-5)return ['Revisar / baixar peso','i'];if(c.peso<=2&&pr>avg+5)return ['Subir peso','p'];return ['Manter','p0']};
  let h=`<div class="kpis">
   ${rzKpi('Setores com OS',fmt(S.length),RZ.cfg.setores.length,'no período filtrado','rr')}
   ${rzKpi('Melhor setor',best?best.s.sf:'—',null,best?best.pr.toFixed(0)+'% de produtividade':'sem amostra','g',best?`data-rz="drill" data-sf="${best.s.sf}"`:'')}
   ${rzKpi('Pior setor',worst?worst.s.sf:'—',null,worst?worst.pr.toFixed(0)+'% de produtividade':'sem amostra','sp',worst?`data-rz="drill" data-sf="${worst.s.sf}"`:'')}
   ${rzKpi('Mais imóvel fechado',fech?fech.sf:'—',null,fech?fech.fechP.toFixed(0)+'% das OS trabalhadas':'—','ct',fech?`data-rz="drill" data-sf="${fech.sf}"`:'')}
   ${rzKpi('ALTO abaixo da média',altoBaixo,null,`média da equipe ${avg.toFixed(0)}%`,altoBaixo?'sp':'g')}
   ${rzKpi('Pontos de melhoria',ins.length,null,'ver lista abaixo',ins.length?'ct':'g')}</div>`;
  const LV={alto:['Crítico','i'],med:['Atenção','f'],op:['Oportunidade','p'],info:['Info','n0']};
  h+=`<div class="panel"><h3>Pontos de melhoria da equipe e dos setores <small>gerados cruzando o rodízio com as OS do GeoCall · toque para agir</small></h3>
   ${ins.length?`<div class="rzins">${ins.slice(0,14).map(x=>`<div class="rzi rz-${x.lv}"><span class="st ${LV[x.lv][1]}">${LV[x.lv][0]}</span><div><b>${x.t}</b><p>${x.d}</p></div>
     <button type="button" class="btn sm ghost" ${x.tab?`data-rz="tab" data-t="${x.tab}"`:x.peso?`data-rz="setor" data-c="${x.sf}" data-go="mapa"`:`data-rz="drill" data-sf="${x.sf||''}" data-eq="${esc(x.eq||'')}"`}>${x.a} →</button></div>`).join('')}</div>${ins.length>14?`<p class="note">+ ${ins.length-14} pontos menores.</p>`:''}`:'<p class="note">Nenhum ponto de atenção no período. Setores e equipe estão equilibrados.</p>'}</div>`;
  h+=`<div class="panel"><h3>Desempenho por setor <small>potencial do rodízio × resultado real no GeoCall · toque na linha para ver as OS</small></h3><div class="tw"><table class="rztab"><thead><tr><th>Setor</th><th>Potencial</th><th class="n">Peso</th><th class="n">Equipe no rodízio</th><th class="n">OS</th><th>Produtividade</th><th class="n">Pagam.</th><th class="n">Imóvel fechado</th><th class="n">Colab.</th><th>Recomendação</th></tr></thead><tbody>

     <td><span class="rzpb"><i style="width:${Math.min(100,pr)}%;background:${pr>=META?'var(--green)':pr>=avg?'#7cc7ff':'#f87171'}"></i><s style="left:${META}%"></s></span><b class="rzpv">${pct(s.a.prod,s.a.den,0)}%</b></td><td class="n">${fmt(s.a.pag)}</td><td class="n">${s.fechP.toFixed(0)}%</td><td class="n">${s.cols}</td><td><span class="st ${rc}">${rt}</span></td></tr>`}).join('')}</tbody></table></div>

  h+=bairroTiersHTML(rows);
  // colaborador × setor
  const eqs=[...new Set(rows.filter(r=>r.sf).map(r=>r.eq))].sort((a,b)=>nomeDe(a).localeCompare(nomeDe(b)));const cols=S.slice(0,14).map(s=>s.sf);
  const cell=(eq,sf)=>{const a=ST.cx[eq+'|'+sf];if(!a||a.den<5)return '<td class="c"><span class="muted">·</span></td>';const pr=a.prod/a.den*100;const t=Math.max(-1,Math.min(1,(pr-avg)/25));
    const bg=t>=0?`rgba(34,197,94,${(.12+t*.5).toFixed(2)})`:`rgba(239,68,68,${(.12-t*.5).toFixed(2)})`;

  h+=`<div class="panel"><h3>Colaborador × setor <small>produtividade (%) de cada um em cada setor · verde acima da média da equipe, vermelho abaixo · mín. 5 OS</small></h3><div class="tw"><table class="rzhmt"><thead><tr><th>Colaborador</th>${cols.map(c=>`<th class="c">${rzChip(c)}</th>`).join('')}</tr></thead><tbody>
   ${eqs.map(eq=>`<tr><td class="nw"><span class="rzn">${esc(nomeDe(eq))}</span></td>${cols.map(sf=>cell(eq,sf)).join('')}</tr>`).join('')}</tbody></table></div>
   <p class="note">Mostra os ${cols.length} setores com mais OS no período. Use para decidir trocas: quando alguém faltar, mande para o setor vago quem tem o melhor número nele.</p></div>`;
  // conexões: setores vizinhos atendidos na mesma rota do dia
  const pares={};groupBy(rows.filter(r=>r.sf),r=>r.eq+'|'+r.day).forEach(rs=>{const ss=[...new Set(rs.sort((a,b)=>a.fim-b.fim).map(r=>r.sf))];for(let i=1;i<ss.length;i++){const k=[ss[i-1],ss[i]].sort().join('↔');pares[k]=(pares[k]||0)+1}});
  const pl=Object.entries(pares).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const viz=(a,b)=>(RM.VIZINHOS[a]||[]).includes(+b)||(RM.VIZINHOS[b]||[]).includes(+a);
  h+=`<div class="g2"><div class="panel"><h3>Ligações entre setores <small>trocas de setor dentro da mesma rota do dia (GeoCall)</small></h3>${pl.length?`<div class="svcb">${pl.map(([k,n])=>{const [a,b]=k.split('↔');const vz=viz(a,b);return `<button type="button" data-rz="drill" data-sf="${a}"><span>${rzChip(a)} ↔ ${rzChip(b)}</span><div class="bar"><i style="width:${n/pl[0][1]*100}%;background:${vz?'#2dd4bf':'#f5b73b'}"></i></div><b>${n}</b><em>${vz?'vizinhos':'<span style="color:#f5b73b">não vizinhos</span>'}</em></button>`}).join('')}</div><p class="note">Troca entre setores <b style="color:#f5b73b">não vizinhos</b> na mesma rota = deslocamento longo. Vale concentrar as ordens do dia no setor escalado e nos vizinhos indicados.</p>`:'<p class="note">Sem trocas de setor no período.</p>'}</div>
   <div class="panel"><h3>Faixa horária por setor <small>produtividade das baixas em cada faixa · top 8 setores</small></h3><div class="tw"><table class="rzhmt"><thead><tr><th>Setor</th>${BANDS.map(b=>`<th class="c">${b[0].replace(' ou mais','+').replace('Antes das ','< ')}</th>`).join('')}</tr></thead><tbody>
   ${S.slice(0,8).map(s=>`<tr><td>${rzChip(s.sf)}</td>${s.bands.map(b=>{if(b.n<8||b.pr==null)return '<td class="c"><span class="muted">·</span></td>';const t=Math.max(-1,Math.min(1,(b.pr-avg)/25));return `<td class="c"><span class="rzhm" style="background:${t>=0?`rgba(34,197,94,${(.12+t*.5).toFixed(2)})`:`rgba(239,68,68,${(.12-t*.5).toFixed(2)})`}" data-tip="${b.n} baixas">${b.pr.toFixed(0)}</span></td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="note">Ajuda a decidir em que horário atacar cada setor (ex.: setores com muito imóvel fechado rendem mais cedo).</p></div></div>`;
  return h}

   <form class="rzform" id="rzAdd"><label>Novo colaborador<input id="rzNn" placeholder="Nome completo" autocomplete="off"></label><label>Veículo<select id="rzNt"><option value="moto">Moto</option><option value="carro">Carro</option></select></label><button type="submit" class="btn">Adicionar</button></form></div>

function vRodizio(v,rows){

  if(!RZ.dia)RZ.dia=rzDiaInicial();

  let body='';try{body=T(rows,ST)}catch(e){console.error(e);body=`<div class="panel"><p class="note">Algo deu errado ao montar esta tela: ${esc(e.message)}</p></div>`}

    ${window.claude?'':`<button type="button" class="rzimp" data-rz="importar" aria-label="Atualizar dados do rodízio" data-tip="Atualizar dados do rodízio<br><span style='opacity:.75'>carregar o arquivo .json</span>"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.5v2.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.5"/><path d="M12 15V4.5M8 8.5l4-4 4 4"/></svg></button>`}
    <button type="button" class="rk-btn rzpv ${RZ.priv?'on':''}" data-rz="priv" aria-pressed="${RZ.priv}"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2">${RZ.priv?'<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a18 18 0 0 1-3.2 4M6.6 6.6C3.9 8.3 2 12 2 12s4 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/>':'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'}</svg>${RZ.priv?'Modo privado ligado':'Modo privado'}</button></div>${body}</div>`;

function rzFichaVer(){const f=document.querySelector('.rzficha');if(!f)return;const r=f.getBoundingClientRect();if(r.top>innerHeight-120)f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function rzBind(v){const root=v.querySelector('.rz');if(!root)return;
  root.onclick=async ev=>{
    const mp=ev.target.closest('#rzMap:not(.rzvec)');if(mp&&!ev.target.closest('[data-rz]')){const r=mp.getBoundingClientRect();const c=setorNoPonto((ev.clientX-r.left)/r.width*1600,(ev.clientY-r.top)/r.height*796);if(c){RZ.sel=c;rzRerender();rzFichaVer()}return}
    const b=ev.target.closest('[data-rz]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.rz,d=RZ.dia;
    try{
      if(a==='tab'){RZ.tab=b.dataset.t;RZ.confirm=null;render();scrollTo({top:0})}
      else if(a==='priv'){RZ.priv=!RZ.priv;try{localStorage.setItem('sa_rz_priv',RZ.priv?'1':'0')}catch(e){}rzRerender()}
      else if(a==='setor'){RZ.sel=+b.dataset.c;if(RZ.tab!=='mapa'){RZ.tab='mapa';render();const f=document.querySelector('.rzficha');if(f)f.scrollIntoView({block:'start'})}else{rzRerender();if(b.closest('#rzMap'))rzFichaVer()}}
      else if(a==='rrPart'){const c=rrCfg(),id=b.dataset.u;c.part=c.part.includes(id)?c.part.filter(x=>x!==id):c.part.concat(id);rzSave()}
      else if(a==='rrDesf'){const c=rrCfg();delete c.ajustes[b.dataset.d];rzSave('Dia voltou ao automático')}
      else if(a==='rrCopiar'){const t=rrWhats();try{await navigator.clipboard.writeText(t);toast('Escala de religação copiada.')}catch(e){toast('Não foi possível copiar')}}
      else if(a==='mm'){RZ.mm=b.dataset.m;rzRerender()}
      else if(a==='fechar'){RZ.sel=null;rzRerender()}
      else if(a==='dia'){const dir=+b.dataset.dir;let n=RM.addDias(d,dir),g=0;while(!RM.ehDiaUtil(n,rzFer())&&g++<30)n=RM.addDias(n,dir);RZ.dia=n;RZ.confirm=null;rzRerender()}
      else if(a==='hojeBtn'){RZ.dia=rzDiaInicial();rzRerender()}
      else if(a==='abrir'){RZ.dia=b.dataset.d;RZ.tab='hoje';render();scrollTo({top:0})}
      else if(a==='drill'){const o={label:''};if(b.dataset.sf)o.sf=b.dataset.sf;if(b.dataset.eq)o.eqs=[b.dataset.eq];o.label=(b.dataset.eq?nomeDe(b.dataset.eq)+' · ':'')+(b.dataset.sf?'Setor '+b.dataset.sf:'');drill(o)}
      else if(a==='feito'){RZ.cfg.feitos=RZ.cfg.feitos||{};const f=RZ.cfg.feitos[d]=RZ.cfg.feitos[d]||{};if(f[b.dataset.u])delete f[b.dataset.u];else f[b.dataset.u]=1;rzSave()}
      else if(a==='falta'){rzAusencia(b.dataset.u,d,d,'Falta');rzSave(rzNome(b.dataset.u)+' marcado com falta')}
      else if(a==='desfazer'){RZ.confirm='desfazer';rzRerender()}
      else if(a==='desfazerOk'){RZ.confirm=null;const pa=window.RZ_SEED&&RZ_SEED.ajustes&&RZ_SEED.ajustes[d];if(RZ.cfg.ajustes){if(pa)RZ.cfg.ajustes[d]=JSON.parse(JSON.stringify(pa));else delete RZ.cfg.ajustes[d]}rzSave('Dia voltou ao automático')}
      else if(a==='cancelar'){RZ.confirm=null;rzRerender()}
      else if(a==='copiar'){const t=rzWhats(d);try{await navigator.clipboard.writeText(t);toast('Escala copiada. Cole no grupo do WhatsApp.')}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.rows=9;ta.className='rzin';b.parentNode.after(ta);ta.select();toast('Selecione e copie o texto abaixo')}}
      else if(a==='ausDel'){RZ.confirm='aus'+b.dataset.i;rzRerender()}
      else if(a==='ausDelOk'){RZ.confirm=null;RZ.cfg.ausencias.splice(+b.dataset.i,1);rzSave('Ausência apagada')}
      else if(a==='desligar'){RZ.confirm='desl'+b.dataset.u;rzRerender()}
      else if(a==='desligarOk'){RZ.confirm=null;const u=rzUni(b.dataset.u);u.status='inativo';u.desde=rzHoje();rzSave(rzNome(u.id)+' saiu do rodízio')}
      else if(a==='religar'){const u=rzUni(b.dataset.u);u.status='ativo';rzSave(rzNome(u.id)+' voltou ao rodízio')}
      else if(a==='feriados'){RZ.cfg.feriados=$('#rzFer').value.split(/\s+/).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort();rzSave(RZ.cfg.feriados.length+' feriados salvos')}
      else if(a==='exportar'){const c=JSON.parse(JSON.stringify(RZ.cfg));c.mapa=rzMapa();c.formas=rzFormas();const blob=new Blob([JSON.stringify({tipo:'rodizio-sabesp',v:1,cfg:c})],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='rodizio-sao-mateus.json';document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(u);l.remove()},1500);toast('Pacote exportado.')}
      else if(a==='importar'){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const p=JSON.parse(await f.text());const c=p&&p.cfg;if(!c||!Array.isArray(c.unidades)||!Array.isArray(c.setores))throw new Error('arquivo não é um pacote do rodízio');if(RZ.cfg&&RZ.cfg.unidades&&RZ.cfg.unidades.length){if(confirm('Você já tem um rodízio salvo. Manter a equipe, as faltas e os ajustes que você lançou e atualizar só o mapa?')){if(c.formas)RZ.cfg.formas=c.formas;if(c.mapa)RZ.cfg.mapa=c.mapa;rzSave('Mapa atualizado. Equipe, faltas e ajustes mantidos.');return}if(!confirm('Substituir tudo pelo conteúdo do arquivo?'))return}RZ.cfg=RM.migrar(c);RZ.cfg.feitos=RZ.cfg.feitos||{};RZ.dia=rzDiaInicial();rzSave('Rodízio importado: '+c.unidades.length+' colaboradores, '+c.setores.length+' setores.')}catch(e){toast('Não foi possível importar: '+e.message)}};i.click()}
    }catch(e){toast(e&&e.message||'Não foi possível')}};
  root.onchange=ev=>{const el=ev.target,a=el.dataset&&el.dataset.rz;if(!a)return;try{
    if(a==='rrTroca'){const c=rrCfg();c.ajustes=c.ajustes||{};c.ajustes[el.dataset.d]=[el.value];rzSave('Responsável trocado')}
    else if(a==='rrDia'){const c=rrCfg(),k=el.dataset.s==='A'?'semA':'semB',w=+el.value;c[k]=el.checked?[...new Set(c[k].concat(w))].sort():c[k].filter(x=>x!==w);rzSave()}
    else if(a==='rrPor'){rrCfg().porDia=+el.value;rzSave()}
    else if(a==='rrAt'){const c=rrCfg();const seg=rrSegunda(RZ.dia);c.ancora=el.value==='A'?seg:RM.addDias(seg,-7);rzSave('Semana ajustada')}
    else if(a==='troca'){const o=rzTroca(RZ.dia,el.dataset.u,+el.value);rzSave(o?'Trocado com '+o:'Setor alterado')}
    else if(a==='peso'){const s=rzSetor(el.dataset.c);s.peso=+el.value;rzSave('Peso do setor '+s.codigo+' salvo')}}catch(e){toast(e.message)}};
  const bq=root.querySelector('#rzBusca');if(bq){const f=()=>{RZ.q=bq.value;const t=rzNorm(bq.value);let n=0;root.querySelectorAll('.rzidx [data-b]').forEach(r=>{const ok=!t||r.dataset.b.includes(t);r.hidden=!ok;if(ok)n++});$('#rzBv').hidden=n>0};bq.oninput=f;if(RZ.q)f()}
  const fa=root.querySelector('#rzAus');if(fa)fa.onsubmit=e=>{e.preventDefault();const de=$('#rzAd').value,ate=$('#rzAa').value||de;if(!de||ate<de){toast('Confira as datas.');return}const id=$('#rzAp').value;rzAusencia(id,de,ate,$('#rzAm').value);rzSave(rzNome(id)+': '+$('#rzAm').value+' lançado')};
  const fn=root.querySelector('#rzAdd');if(fn)fn.onsubmit=e=>{e.preventDefault();const n=$('#rzNn').value.trim();if(!n)return;const id=rzNorm(n).toLowerCase().replace(/[^a-z]/g,'').slice(0,12)+Date.now().toString(36).slice(-3);
    RZ.cfg.unidades.push({id,nome:n,curto:n.split(' ')[0],tipo:$('#rzNt').value,ordem:RZ.cfg.unidades.length+1});rzSave(n+' entrou no rodízio')};
  const fm=root.querySelector('#rzMetas');if(fm)fm.onsubmit=e=>{e.preventDefault();RZ.cfg.metas={moto:Math.max(1,+$('#rzMm').value||25),carro:Math.max(1,+$('#rzMc').value||10)};rzSave('Metas salvas')};
}

/* ============ início ============ */
function startApp(){REG=LS.get(REG_KEY,{});loadSeed();rebuild();buildNav();fillSelects();setPeriod();readF();bindFilters();info();tick();setInterval(tick,20000);render();pushHist();initStore();
  $('#hBack').onclick=()=>histGo(HI-1);$('#hFwd').onclick=()=>histGo(HI+1);addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();histGo(HI-1)}if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();histGo(HI+1)}});
  if(SECURE){const b=document.createElement('button');b.type='button';b.className='btn ghost sm lockbtn';b.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Bloquear';b.onclick=async()=>{await flushSaves();location.reload()};const c=$('.clock');if(c)c.appendChild(b);
    let idle=0;const reset=()=>{clearTimeout(idle);idle=setTimeout(async()=>{await flushSaves();location.reload()},(+CFG.bloquearAposMinutos||15)*60000)};['pointerdown','keydown','scroll','touchstart'].forEach(ev=>addEventListener(ev,reset,{passive:true}));reset()}}
function lockScreen(){
  const has=vaultExists();const ov=document.createElement('div');ov.className='lock';
    ov.innerHTML=`<div class="lock-bg"><i></i><i></i><i></i></div><form class="lock-card" id="lkF" autocomplete="off">
    <div class="lk-ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#9fd0ff" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.3" fill="#9fd0ff"/></svg></div><span class="lock-eyb">Área restrita</span>
    <h2>${has?'Acesso protegido':'Crie sua senha'}</h2>
    <p>${has?'Digite a sua senha para continuar.':'Crie uma senha para proteger o acesso. Use uma frase com 4 ou mais palavras.'}</p>
    <label for="lkP">Senha</label><input type="password" id="lkP" autocomplete="${has?'current-password':'new-password'}" required minlength="${has?1:12}" autofocus>
    ${has?'':`<div class="lk-meter"><i id="lkM"></i></div><small id="lkMs">Mínimo de 12 caracteres</small><label for="lkP2">Repita a senha</label><input type="password" id="lkP2" autocomplete="new-password" required>`}
    <button class="btn" type="button" id="lkB">${has?'Desbloquear':'Criar senha e entrar'}</button><p class="lk-err" id="lkE" role="alert"></p>
    ${has?'':`<div class="lk-forget"><button type="button" id="lkRest">Já tenho uma cópia de segurança</button></div>`}
    ${has?`<div class="lk-forget"><button type="button" id="lkF1">Esqueci a senha</button><div id="lkF2" hidden>Sem a senha não há como recuperar os dados. Apagar tudo deste navegador e começar de novo? <button type="button" class="btn sm danger" id="lkF3">Apagar e recomeçar</button></div></div>`:''}
    <small class="lk-foot">Conteúdo cifrado · acesso somente com senha</small></form>`;
  document.title='Acesso restrito';document.body.appendChild(ov);document.querySelector('.app').setAttribute('aria-hidden','true');document.querySelector('.app').classList.add('locked');
  const P=$('#lkP'),E=$('#lkE');setTimeout(()=>P.focus(),50);
  if(!has){P.oninput=()=>{const s=P.value;let sc=Math.min(4,Math.floor(s.length/5))+(/[A-Z]/.test(s)&&/[a-z]/.test(s)?1:0)+(/\d/.test(s)?1:0)+(/[^\w\s]/.test(s)||/\s/.test(s)?1:0);sc=Math.min(6,sc);
    $('#lkM').style.width=(sc/6*100)+'%';$('#lkM').style.background=sc<3?'#ef4444':sc<5?'#f5b73b':'#22c55e';$('#lkMs').textContent=s.length<12?'Mínimo de 12 caracteres':sc<3?'Fraca':sc<5?'Razoável':'Forte'}}
  if(!has)$('#lkRest').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const p=JSON.parse(await i.files[0].text());const vv=p&&p.vault;if(!vv||!vv.salt||!vv.iv||!vv.ct)throw 0;localStorage.setItem(VAULT,JSON.stringify(vv));location.reload()}catch(e){E.textContent='Esse arquivo não é uma cópia de segurança do painel.'}};i.click()};
  if(has){$('#lkF1').onclick=()=>{$('#lkF2').hidden=false};$('#lkF3').onclick=()=>{[VAULT,...SEC_KEYS].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()}}
  let tries=0;
  let busy=false;
  const go=async()=>{if(busy||$('#lkB').disabled)return;E.textContent='';const pw=P.value;
    if(!has){if(pw.length<12){E.textContent='Use pelo menos 12 caracteres.';return}if(pw!==$('#lkP2').value){E.textContent='As senhas não conferem.';return}}
    if(!pw){E.textContent='Digite a senha.';P.focus();return}
    busy=true;$('#lkB').disabled=true;$('#lkB').textContent=has?'Abrindo…':'Protegendo… (alguns segundos)';
    let ok=false;
    try{if(has)await vaultOpen(pw);else await vaultCreate(pw);ok=true}
    catch(err){busy=false;
      if(!has||(err&&err.name!=='OperationError')){$('#lkB').disabled=false;$('#lkB').textContent=has?'Desbloquear':'Criar senha e entrar';
        E.textContent='Este navegador bloqueou o armazenamento local (ex.: pré-visualização, aba anônima ou arquivo aberto dentro de outro app). Abra o link do GitHub Pages ou o arquivo baixado direto no Chrome ou Edge.';return}
      tries++;$('#lkB').disabled=false;$('#lkB').textContent=has?'Desbloquear':'Criar senha e entrar';E.textContent='Senha incorreta.';P.value='';P.focus();
      if(tries>=3){$('#lkB').disabled=true;let s=tries*10;const iv=setInterval(()=>{E.textContent=`Senha incorreta. Tente de novo em ${s}s.`;if(--s<0){clearInterval(iv);$('#lkB').disabled=false;E.textContent=''}},1000)}
      return}
    ov.remove();document.title='Gestão Operacional';document.querySelector('.app').removeAttribute('aria-hidden');document.querySelector('.app').classList.remove('locked');
    try{startApp()}catch(err){console.error(err);toast('Erro ao abrir o painel: '+(err&&err.message||err))}};
  $('#lkB').onclick=go;
  $('#lkF').onsubmit=e=>{e.preventDefault();go()};
  ov.querySelectorAll('input[type=password]').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}}));
}
if(SECURE){if(!window.crypto||!crypto.subtle){document.body.insertAdjacentHTML('beforeend','<p style="padding:20px">Este navegador não suporta cifragem. Abra no Chrome ou Edge atualizados.</p>')}else lockScreen()}else startApp();
})();

</script>
