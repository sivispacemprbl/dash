  return `<h3>${esc(b.pdfMax&&M.rows.length>b.pdfMax?b.pdfT:b.t)}</h3><table><thead><tr>${M.head.map(h=>`<th${al(h[1])}>${esc(h[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>{const t=M.head[i][1];const cls=t==='pm'&&typeof c==='number'?(c*100>=META?' up':' dn'):'';return `<td class="${t==='t'?'':'r'}${cls}">${rcVal(c,t)}</td>`}).join('')}</tr>`).join('')||`<tr><td colspan="${M.head.length}" class="mut">Sem dados no período</td></tr>`}</tbody>${M.total?`<tfoot><tr>${M.total.map((c,i)=>`<td${al(M.head[i][1])}>${rcVal(c,M.head[i][1])}</td>`).join('')}</tr></tfoot>`:''}</table>`}
function rcPDFdoc(R){const per=relPeriodo();const A=R.A;const agora=new Date();const ger=dayBRf(dayKey(agora))+' às '+pad(agora.getHours())+':'+pad(agora.getMinutes());
  const css=`*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{margin:0;font:11px/1.45 Arial,Helvetica,sans-serif;color:#0f172a}
   @page{size:A4 portrait;margin:12mm 11mm 13mm}@page{@bottom-right{content:counter(page) " / " counter(pages);font:9px Arial;color:#64748b}}
   .cap{height:268mm;display:flex;flex-direction:column;justify-content:space-between;padding:0}.cap .band{background:#0b3a75;color:#fff;border-radius:10px;padding:34px 30px}.cap .eb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:700}
   .cap h1{font-size:32px;margin:10px 0 6px;line-height:1.15}.cap .sb{font-size:14px;opacity:.92}.cap .pe{margin-top:22px;font-size:16px;font-weight:700;background:rgba(255,255,255,.12);display:inline-block;padding:8px 14px;border-radius:8px}
   .kg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.kg div{border:1px solid #d5dde8;border-radius:10px;padding:12px 14px;background:#f8fafc}.kg span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:700}.kg b{display:block;font-size:22px;color:#0b3a75;margin-top:3px}.kg b.up{color:#15803d}.kg b.dn{color:#b91c1c}
   .idx{columns:2;column-gap:28px;padding:0;margin:0;list-style:none;counter-reset:s}.idx li{counter-increment:s;padding:7px 0;border-bottom:1px solid #e5eaf1;font-size:12.5px;font-weight:600;break-inside:avoid}.idx li:before{content:counter(s,decimal-leading-zero);color:#2a72bd;font-weight:800;margin-right:10px}
   .ger{color:#64748b;font-size:10.5px;border-top:2px solid #0b3a75;padding-top:8px;display:flex;justify-content:space-between}
   .sec{break-before:page}.sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #0b3a75;padding-bottom:6px;margin-bottom:12px}.sh h2{margin:0;font-size:19px;color:#0b3a75}.sh h2 i{font-style:normal;color:#2a72bd;margin-right:8px}.sh span{color:#64748b;font-weight:700;font-size:10.5px;text-align:right}
   .sec .kg{grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}.sec .kg div{padding:8px 11px}.sec .kg b{font-size:17px}
   h3{font-size:12.5px;color:#0b3a75;margin:14px 0 6px}.ch{border:1px solid #e5eaf1;border-radius:10px;padding:10px 10px 4px;margin:0 0 6px}
   table{width:100%;border-collapse:collapse;font-size:10px}th{background:#0b3a75;color:#fff;font-size:8.6px;text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:5px 6px;vertical-align:bottom}td{padding:4px 6px;border-bottom:1px solid #e5eaf1;vertical-align:top}
   tbody tr:nth-child(even) td{background:#f8fafc}tfoot td{font-weight:800;background:#eef2f7;border-top:2px solid #0b3a75}.r{text-align:right;white-space:nowrap}tbody td:first-child{white-space:nowrap}td.up{color:#15803d;font-weight:700}td.dn{color:#b91c1c;font-weight:700}.mut{color:#94a3b8}thead{display:table-header-group}tr{break-inside:avoid}`;
  const K=(k)=>{const t=k[2];const c=t==='pm'?(k[1]*100>=META?'up':'dn'):'';return `<div><span>${esc(k[0])}</span><b class="${c}">${rcVal(k[1],t)}</b></div>`};
  const capK=[['OS trabalhadas',A.trab,'n'],['Produtivas',A.prod,'n'],['Produtividade',A.den?A.prod/A.den:0,'pm'],['Meta',META/100,'p'],['Dias com serviço',R.nd,'n'],['Colaboradores',R.ncol,'n'],['Pagamentos',A.pag,'n'],['Média de OS por dia',R.nd?A.trab/R.nd:0,'d']];
  const cap=`<section class="cap"><div><div class="band"><div class="eb">Gestão Operacional</div><h1>Relatório de Desempenho</h1><div class="sb">Corte, supressão, negociação via POS e religação</div><div class="pe">${esc(per)}</div></div>
    <div class="kg">${capK.map(K).join('')}</div><h3 style="margin-top:6px">Conteúdo</h3><ol class="idx">${R.secs.map(s=>`<li>${esc(s.t)}</li>`).join('')}</ol></div><div class="ger"><span>Gestão Operacional</span><span>Gerado em ${ger}</span></div></section>`;
  const body=R.secs.map((s,i)=>`<section class="sec"><div class="sh"><h2><i>${String(i+1).padStart(2,'0')}</i>${esc(s.t)}</h2><span>${esc(per)}</span></div>
    ${s.kpis?`<div class="kg">${s.kpis.map(K).join('')}</div>`:''}
    ${s.chart&&s.chart.tipo==='dia'?`<h3>Produtividade por dia</h3><div class="ch">${rcSvgDia(s.chart.D)}</div>`:''}
    ${s.chart&&s.chart.tipo==='rank'?`<h3>Produtividade por colaborador</h3><div class="ch">${rcSvgRank(s.chart.L)}</div>`:''}
    ${s.blocks.map(rcTab).join('')}</section>`).join('');
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório de Desempenho · ${esc(per)}</title><style>${css}</style></head><body>${cap}${body}</body></html>`}
function rcPDF(R){const html=rcPDFdoc(R);const ov=document.createElement('div');ov.className='ac-ov';ov.innerHTML=`<div class="ac-m dos-m" role="dialog" aria-label="Relatório completo"><header><b>Relatório completo · ${esc(relPeriodo())}</b><button type="button" class="ac-x" data-x aria-label="Fechar">×</button></header>
   <iframe class="dos-f" title="Prévia do relatório completo"></iframe><footer><button type="button" class="btn ghost sm" id="rcSave">Baixar arquivo</button><span style="flex:1"></span><button type="button" class="btn" id="rcPrint">Imprimir ou salvar em PDF</button></footer></div>`;
  document.body.appendChild(ov);const close=()=>ov.remove();ov.querySelectorAll('[data-x]').forEach(b=>b.onclick=close);ov.onclick=e=>{if(e.target===ov)close()};const f=ov.querySelector('iframe');f.srcdoc=html;
  ov.querySelector('#rcPrint').onclick=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('Use “Baixar arquivo” e imprima pelo navegador.')}};
  ov.querySelector('#rcSave').onclick=async()=>{const r=await salvarArquivo('relatorio-completo-'+(REL.ini||'')+'-a-'+(REL.fim||'')+'.html',html,'text/html');if(r==='ok')toast('Relatório salvo. Abra e imprima em PDF.')}}
function rcPainelHTML(){return `<div class="panel rc-p"><div class="rc-h"><div><h3>Relatório completo <small>todas as áreas do painel no período escolhido acima</small></h3></div>
   <div class="rl-act"><button type="button" class="btn ghost sm" id="rcXls">Baixar Excel completo</button><button type="button" class="btn sm" id="rcPdf">Gerar PDF completo</button></div></div>
   <div class="rc-ch">${RC_SEC.map(([k,l])=>`<label class="rc-c ${RC_SEL.includes(k)?'on':''}"><input type="checkbox" data-rc="${k}" ${RC_SEL.includes(k)?'checked':''}><span>${l}</span></label>`).join('')}</div></div>`}
function rcBind(v){v.querySelectorAll('[data-rc]').forEach(c=>c.onchange=()=>{const k=c.dataset.rc;RC_SEL=c.checked?RC_SEC.map(x=>x[0]).filter(x=>x===k||RC_SEL.includes(x)):RC_SEL.filter(x=>x!==k);c.closest('.rc-c').classList.toggle('on',c.checked)});
  const pr=()=>{if(!RC_SEL.length){toast('Marque pelo menos uma área.');return null}const rows=rcRows();if(!rows.length){toast('Sem OS no período escolhido.');return null}return rcModelo(rows)};
  v.querySelector('#rcPdf').onclick=()=>{const R=pr();if(R)rcPDF(R)};
  v.querySelector('#rcXls').onclick=async()=>{const R=pr();if(!R)return;const blob=rcXlsx(R,'Relatório de Desempenho · '+relPeriodo(),'Gestão Operacional');const r=await salvarArquivo('relatorio-completo-'+(REL.ini||'')+'-a-'+(REL.fim||'')+'.xlsx',blob,blob.type);if(r==='ok')toast('Relatório completo em Excel salvo.')}}

/* ============ início ============ */
function startApp(){REG=LS.get(REG_KEY,{});RESUMO=LS.get('sa_dash_resumo',{})||{};loadSeed();rebuild();setApres(APRES);{const b=$('#apresBtn');if(b)b.onclick=toggleApres}{const h=$('#hxSt');if(h)h.onclick=()=>go('planilhas')}buildNav();fillSelects();setPeriod();readF();bindFilters();info();tick();setInterval(tick,20000);render();pushHist();initStore().then(()=>{try{bkStatus()}catch(e){}});bkInit();verInit();
  $('#hBack').onclick=()=>histGo(HI-1);$('#hFwd').onclick=()=>histGo(HI+1);addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();histGo(HI-1)}if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();histGo(HI+1)}});
  if(SECURE){const b=document.createElement('button');b.type='button';b.className='btn ghost sm lockbtn';b.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Bloquear';b.onclick=async()=>{await flushSaves();location.reload()};const c=$('.clock');if(c)c.appendChild(b);
    let idle=0;const reset=()=>{clearTimeout(idle);idle=setTimeout(async()=>{await flushSaves();location.reload()},(+CFG.bloquearAposMinutos||15)*60000)};['pointerdown','keydown','scroll','touchstart'].forEach(ev=>addEventListener(ev,reset,{passive:true}));reset()}}
function lockScreen(){
  const has=vaultExists();const ov=document.createElement('div');ov.className='lock';
    ov.innerHTML=`<div class="lock-bg"><i></i><i></i><i></i></div><form class="lock-card" id="lkF" autocomplete="off">
    <div class="lk-ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#9fd0ff" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.3" fill="#9fd0ff"/></svg></div><span class="lock-eyb">Área restrita</span>
    <h2>${has?'Acesso protegido':'Crie sua senha'}</h2>
    <p>${has?'Digite a sua senha para continuar.':'Crie uma senha para proteger o acesso. Use uma frase com 4 ou mais palavras.'}</p>
    <label for="lkP">Senha</label><input type="password" id="lkP" autocomplete="${has?'current-password':'new-password'}" required minlength="${has?1:12}" autofocus>
    ${has?'':`<div class="lk-meter"><i id="lkM"></i></div><small id="lkMs">Mínimo de 12 caracteres</small><label for="lkP2">Repita a senha</label><input type="password" id="lkP2" autocomplete="new-password" required>`}
    <button class="btn" type="button" id="lkB">${has?'Desbloquear':'Criar senha e entrar'}</button><p class="lk-err" id="lkE" role="alert"></p>
    ${has?'':`<div class="lk-forget"><button type="button" id="lkRest">Já tenho uma cópia de segurança</button></div>`}
    ${has?`<div class="lk-forget"><button type="button" id="lkF1">Esqueci a senha</button><div id="lkF2" hidden>Sem a senha não há como recuperar os dados. Apagar tudo deste navegador e começar de novo? <button type="button" class="btn sm danger" id="lkF3">Apagar e recomeçar</button></div></div>`:''}
    <small class="lk-foot">Conteúdo cifrado · acesso somente com senha</small></form>`;
  document.title='Acesso restrito';document.body.appendChild(ov);document.querySelector('.app').setAttribute('aria-hidden','true');document.querySelector('.app').classList.add('locked');
  const P=$('#lkP'),E=$('#lkE');setTimeout(()=>P.focus(),50);
  if(!has){P.oninput=()=>{const s=P.value;let sc=Math.min(4,Math.floor(s.length/5))+(/[A-Z]/.test(s)&&/[a-z]/.test(s)?1:0)+(/\d/.test(s)?1:0)+(/[^\w\s]/.test(s)||/\s/.test(s)?1:0);sc=Math.min(6,sc);
    $('#lkM').style.width=(sc/6*100)+'%';$('#lkM').style.background=sc<3?'#ef4444':sc<5?'#f5b73b':'#22c55e';$('#lkMs').textContent=s.length<12?'Mínimo de 12 caracteres':sc<3?'Fraca':sc<5?'Razoável':'Forte'}}
  if(!has)$('#lkRest').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const p=JSON.parse(await i.files[0].text());const vv=p&&p.vault;if(!vv||!vv.salt||!vv.iv||!vv.ct)throw 0;localStorage.setItem(VAULT,JSON.stringify(vv));if(p.vaultPlan)localStorage.setItem(VAULT_P,JSON.stringify(p.vaultPlan));else localStorage.removeItem(VAULT_P);location.reload()}catch(e){E.textContent='Esse arquivo não é uma cópia de segurança do painel.'}};i.click()};
  if(has){$('#lkF1').onclick=()=>{$('#lkF2').hidden=false};$('#lkF3').onclick=()=>{[VAULT,VAULT_P,...SEC_KEYS].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()}}
  let tries=0;
  let busy=false;
  const go=async()=>{if(busy||$('#lkB').disabled)return;E.textContent='';const pw=P.value;
    if(!has){if(pw.length<12){E.textContent='Use pelo menos 12 caracteres.';return}if(pw!==$('#lkP2').value){E.textContent='As senhas não conferem.';return}}
    if(!pw){E.textContent='Digite a senha.';P.focus();return}
    busy=true;$('#lkB').disabled=true;$('#lkB').textContent=has?'Abrindo…':'Protegendo… (alguns segundos)';
    let ok=false;
    try{if(has)await vaultOpen(pw);else await vaultCreate(pw);ok=true}
    catch(err){busy=false;
      if(!has||(err&&err.name!=='OperationError')){$('#lkB').disabled=false;$('#lkB').textContent=has?'Desbloquear':'Criar senha e entrar';
        E.textContent='Este navegador bloqueou o armazenamento local (ex.: pré-visualização, aba anônima ou arquivo aberto dentro de outro app). Abra o link do GitHub Pages ou o arquivo baixado direto no Chrome ou Edge.';return}
      tries++;$('#lkB').disabled=false;$('#lkB').textContent=has?'Desbloquear':'Criar senha e entrar';E.textContent='Senha incorreta.';P.value='';P.focus();
      if(tries>=3){$('#lkB').disabled=true;let s=tries*10;const iv=setInterval(()=>{E.textContent=`Senha incorreta. Tente de novo em ${s}s.`;if(--s<0){clearInterval(iv);$('#lkB').disabled=false;E.textContent=''}},1000)}
      return}
    ov.remove();document.title='Gestão Operacional';document.querySelector('.app').removeAttribute('aria-hidden');document.querySelector('.app').classList.remove('locked');
    try{startApp()}catch(err){console.error(err);toast('Erro ao abrir o painel: '+(err&&err.message||err))}};
  $('#lkB').onclick=go;
  $('#lkF').onsubmit=e=>{e.preventDefault();go()};
  ov.querySelectorAll('input[type=password]').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}}));
}
if(SECURE){if(!window.crypto||!crypto.subtle){document.body.insertAdjacentHTML('beforeend','<p style="padding:20px">Este navegador não suporta cifragem. Abra no Chrome ou Edge atualizados.</p>')}else lockScreen()}else startApp();
})();

</script>
