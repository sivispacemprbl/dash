let PL_DEL=null;
function lidLista(){return SHEETS.filter(x=>x.ativa).flatMap(x=>x.recs.filter(r=>r.lid&&r.tipo!=='FORA'&&r.cat!=='FIMDIA'))}
function lidEquipe(){return [...new Set(allSheetRows().filter(r=>!r.lid&&r.eq).map(r=>r.eq))].sort((a,b)=>nomeDe(a).localeCompare(nomeDe(b),'pt'))}
/* sugestão de quem executou, pela nota de execução: primeiro nome da equipe ou matrícula já usada antes */
function lidSugere(r,eqs,mat){const t=norm(r.nota||'');if(!t)return '';const nums=t.match(/\b\d{5,7}\b/g)||[];for(const n of nums)if(mat[n])return mat[n];
  const hit=eqs.filter(e=>{const f=norm(e).split(' ')[0];return f.length>2&&new RegExp('\\b'+f+'\\b').test(t)});return hit.length===1?hit[0]:''}
/* a nota só aparece quando traz nome de alguém da equipe ou uma matrícula */
function lidTemId(nota,eqs){const t=norm(nota||'');if(!t)return false;if(/\b\d{5,7}\b/.test(t))return true;return eqs.some(e=>{const f=norm(e).split(' ')[0];return f.length>2&&new RegExp('\\b'+f+'\\b').test(t)})}
function lidMatriculas(L){const m={};L.forEach(r=>{if(!r.eq)return;(norm(r.nota||'').match(/\b\d{5,7}\b/g)||[]).forEach(n=>{if(!m[n])m[n]=r.eq})});return m}
function lidHTML(){const L=lidLista();if(!L.length)return '';const pend=L.filter(lidPend).length;const eqs=lidEquipe();const MAT=lidMatriculas(L);const DW=['dom','seg','ter','qua','qui','sex','sáb'];
  const opt=(sel,vazio)=>`<option value="">${vazio}</option>`+eqs.map(e=>`<option value="${esc(e)}" ${e===sel?'selected':''}>${esc(nomeDe(e))}</option>`).join('');
  const P=L.filter(lidPend),F=L.filter(r=>!lidPend(r));const dias=[...groupBy(P,r=>r.day)].sort((a,b)=>a[0]<b[0]?1:-1);
  const feitas=F.length?`<details class="lid-ok" ${LID_OPEN?'open':''}><summary><span>Já direcionadas</span><b>${fmt(F.length)}</b><em>${[...groupBy(F,r=>r.eq)].sort((a,b)=>b[1].length-a[1].length).map(([e,rs])=>`<span class="pvn">${esc(nomeDe(e).split(' ')[0])}</span> ${rs.length}`).join(' · ')}</em><i>ver ou corrigir</i></summary>
     <div class="tw"><table class="lid-t lid-tok nostack"><tbody>${F.slice().sort((a,b)=>b.fim-a.fim).map(r=>`<tr><td class="n">${dayBR(r.day)} ${hhmm(r.fim)}</td><td>${esc(title(r.tss||''))}</td><td><span class="st ${isProd(r.cat)?'p':'i'}">${esc(r.res)}</span></td><td>${esc(r.bai||'')}</td><td>OS ${esc(r.os)}</td><td><select data-lid="${esc(r.key)}" class="pvn">${opt(r.eq,'— a direcionar —')}</select></td></tr>`).join('')}</tbody></table></div></details>`:'';
  if(!P.length)return `<div class="panel lid-p lid-fim nocp" id="lidP"><h3>OS feitas no login do líder <small>todas direcionadas</small></h3>${feitas}</div>`;
  return `<div class="panel lid-p nocp" id="lidP"><h3>OS feitas no login do líder <small><b class="dn">${fmt(P.length)} a direcionar</b> · escolha quem executou: a OS passa a contar para essa pessoa e sai desta lista</small></h3>
   ${dias.map(([d,rs])=>{rs.sort((a,b)=>(a.ini||a.fim)-(b.ini||b.fim));const todos='';const um=[];const np=rs.length;
     return `<div class="lid-d ${np?'lp':''}"><div class="lid-h"><b>${DW[new Date(d+'T12:00').getDay()]} ${dayBRf(d)}</b><span><em>${np} a direcionar</em></span><label><span>Direcionar o dia todo para</span><select data-lidia="${d}" class="pvn">${opt('','— escolher —')}</select></label></div>
      <div class="tw"><table class="lid-t nostack"><tbody>${rs.map(r=>`<tr class="${lidPend(r)?'lp':''}"><td class="n">${hhmm(r.ini||r.fim)}–${hhmm(r.fim)}</td><td>${esc(title(r.tss||''))}</td><td><span class="st ${isProd(r.cat)?'p':'i'}">${esc(r.res)}</span>${APRES||!lidTemId(r.nota,eqs)?'':`<span class="lid-nota">“${esc(String(r.nota).replace(/\s+/g,' ').trim())}”</span>`}${(()=>{if(APRES||!lidPend(r))return '';const sg=lidSugere(r,eqs,MAT);return sg?`<button type="button" class="lid-sg" data-lsg="${esc(r.key)}" data-eq="${esc(sg)}">Usar <b class="pvn">${esc(nomeDe(sg).split(' ')[0])}</b><span class="lid-sgx">(sugestão pela nota)</span></button>`:''})()}</td><td>${esc(r.bai||'')}</td><td>OS ${esc(r.os)}</td><td><select data-lid="${esc(r.key)}" class="pvn">${opt(r.eq,'— a direcionar —')}</select></td></tr>`).join('')}</tbody></table></div></div>`}).join('')}${feitas}</div>`}
let LID_OPEN=false;
function bindLid(v){const dt=v.querySelector('.lid-ok');if(dt)dt.ontoggle=()=>{LID_OPEN=dt.open};const keep=()=>{const y=scrollY;refreshAll();scrollTo(0,y)};
  v.querySelectorAll('[data-lsg]').forEach(b=>b.onclick=()=>{ATRIB[b.dataset.lsg]=b.dataset.eq;saveAtrib();keep();toast('OS direcionada para '+nomeDe(b.dataset.eq)+'.')});
  v.querySelectorAll('select[data-lid]').forEach(s=>s.onchange=()=>{if(s.value)ATRIB[s.dataset.lid]=s.value;else delete ATRIB[s.dataset.lid];saveAtrib();keep();toast(s.value?'OS direcionada para '+nomeDe(s.value)+'.':'OS voltou para a lista "a direcionar".')});
  v.querySelectorAll('select[data-lidia]').forEach(s=>s.onchange=()=>{if(!s.value)return;const d=s.dataset.lidia;let n=0;lidLista().filter(r=>r.day===d&&lidPend(r)).forEach(r=>{ATRIB[r.key]=s.value;n++});saveAtrib();keep();toast(n+' OS de '+dayBRf(d)+' direcionadas para '+nomeDe(s.value)+'.')})}
function lidAviso(v){if(APRES)return;const n=lidLista().filter(lidPend).length;if(!n)return;
  v.insertAdjacentHTML('afterbegin',`<div class="lid-av"><span><b>${fmt(n)} OS feitas no login do líder</b> ainda não foram direcionadas e estão fora dos números.</span><button type="button" class="btn sm" id="lidGo">Direcionar agora</button></div>`);
  v.querySelector('#lidGo').onclick=()=>{go('planilhas');setTimeout(()=>{const e=$('#lidP');if(e)e.scrollIntoView({behavior:'smooth'})},250)}}
function vPlanilhas(v){
  const tot=SHEETS.reduce((s,x)=>s+x.recs.length,0);
  const st={ok:'Guardadas no painel: abrem em qualquer aparelho, para quem tem acesso a este dashboard.',local:'Guardadas neste navegador (o banco do painel não está disponível nesta visualização).',erro:'Não foi possível abrir as planilhas guardadas no painel agora. As deste navegador continuam disponíveis.',carregando:'Abrindo planilhas guardadas…'}[DBSTATE];
  const list=[...SHEETS].sort((x,y)=>{const a=sheetInfo(x).ini,b=sheetInfo(y).ini;return a<b?1:a>b?-1:0});
  const fora=[...groupBy(SHEETS.filter(s=>s.ativa).flatMap(s=>s.recs.filter(r=>r.tipo==='FORA')),r=>r.tss||'(sem serviço)')].map(([k,rs])=>({k,rs})).sort((a,b)=>b.rs.length-a.rs.length);
  const foraH=fora.length?`<div class="panel"><h3>Serviços que não entram no painel <small>${fmt(fora.reduce((n,x)=>n+x.rs.length,0))} execuç${fora.reduce((n,x)=>n+x.rs.length,0)>1?'ões':'ão'} nas planilhas ativas</small></h3><div class="tw"><table><thead><tr><th>Serviço (TSS)</th><th class="n">Execuções</th><th>Resultados</th><th>Colaboradores</th></tr></thead><tbody>${fora.map(x=>`<tr><td>${esc(x.k)}</td><td class="n">${fmt(x.rs.length)}</td><td>${esc([...new Set(x.rs.map(r=>r.res))].join(', '))}</td><td><span class="pvn">${esc([...new Set(x.rs.map(r=>nomeDe(r.eq)))].join(', '))}</span></td></tr>`).join('')}</tbody></table></div></div>`:'';
  v.innerHTML=classifHTML()+lidHTML()+foraH+`<div class="panel"><h3>Planilhas importadas <small>${fmt(SHEETS.length)} guardada${SHEETS.length>1?'s':''} · ${fmt(ROWS.length)} execuções ativas</small></h3>
   <div class="plhead"><button class="btn" type="button" id="plImp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>Importar planilhas</button>
    <button class="btn ghost" type="button" id="plAll">Ativar todas</button><span class="note">${esc(st)}</span></div>
   <div class="plist">${list.map(s=>{const inf=sheetInfo(s);const d=new Date(s.importadaEm);return `<div class="plc ${s.ativa?'on':''}">
     <label class="plt"><input type="checkbox" data-pl="${esc(s.id)}" ${s.ativa?'checked':''}><span><b>${esc(s.nome)}</b><small>${s.builtin?'planilha inicial':'importada em '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}</small></span></label>
     <div class="plm"><span><b>${fmt(s.recs.length)}</b> execuções</span><span>${inf.ini?dayBRf(inf.ini)+' a '+dayBRf(inf.fim):'—'}</span><span>${s.recs.length&&s.recs.every(r=>r.lid)?'login do líder':fmt(new Set(s.recs.map(r=>r.lid?'':r.eq).filter(Boolean)).size)+' colaboradores'}</span></div>
     <div class="pla"><button class="btn ghost sm" type="button" data-only="${esc(s.id)}">Ver só esta</button>${s.builtin?'':(PL_DEL===s.id?`<span class="small">Remover de vez?</span><button class="btn sm danger" type="button" data-del="${esc(s.id)}">Sim, remover</button><button class="btn ghost sm" type="button" data-nodel="1">Cancelar</button>`:`<button class="btn ghost sm" type="button" data-ask="${esc(s.id)}">Remover</button>`)}</div></div>`}).join('')}</div>
   <p class="note">Marque as planilhas que entram nos indicadores. Execuções repetidas contam uma vez só.</p>${(()=>{const f=Object.entries(CLASSIF);return f.length?`<details class="cls-feitos"><summary>Resultados que você classificou (${f.length})</summary><div class="cls-l">${f.map(([k,v])=>`<div><span><b>${esc(k)}</b><small>${v==='P'?'produtivo':'não produtivo'}</small></span><button type="button" class="btn ghost sm" data-clx="${esc(k)}">Desfazer</button></div>`).join('')}</div></details>`:''})()}</div>`;
  $('#plImp').onclick=()=>$('#file').click();bindClassif(v);bindLid(v);
  $('#plAll').onclick=()=>{SHEETS.forEach(s=>{if(!s.ativa){s.ativa=true;dbSetAtiva(s)}});lsSave();refreshAll()};
  v.querySelectorAll('[data-pl]').forEach(c=>c.onchange=()=>{const s=SHEETS.find(x=>x.id===c.dataset.pl);s.ativa=c.checked;dbSetAtiva(s);lsSave();refreshAll();toast(c.checked?'Planilha incluída nos indicadores.':'Planilha fora dos indicadores (continua guardada).')});
  v.querySelectorAll('[data-only]').forEach(b=>b.onclick=()=>{SHEETS.forEach(s=>{const on=s.id===b.dataset.only;if(s.ativa!==on){s.ativa=on;dbSetAtiva(s)}});lsSave();$('#fPer').value='ALL';refreshAll();toast('Mostrando só esta planilha.')});
  v.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{PL_DEL=b.dataset.ask;render()});
  v.querySelectorAll('[data-nodel]').forEach(b=>b.onclick=()=>{PL_DEL=null;render()});
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const s=SHEETS.find(x=>x.id===b.dataset.del);PL_DEL=null;SHEETS=SHEETS.filter(x=>x!==s);
    try{await dbDeleteSheet(s,s.partes||Math.ceil(s.recs.length/300)+2)}catch(e){console.error(e)}lsSave();refreshAll();toast('Planilha removida.')});
}

/* ---------- Telemetria / Bairros ---------- */
let TL={eq:'',day:'',sort:'os',tab:'areas',susEq:''};
function vBairros(v,rows){rows=rows.filter(r=>!r.man);
  const base=rows.filter(isBaixa);
  const med=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
  const moves=[];for(const rs of groupBy(base,r=>r.eq+'|'+r.day).values()){rs.sort((x,y)=>x.fim-y.fim);for(let i=1;i<rs.length;i++){const p=rs[i-1],c=rs[i];moves.push({p,c,from:p.bai||'—',to:c.bai||'—',gap:Math.max(0,Math.round(((c.ini||c.fim)-p.fim)/6e4)),eq:c.eq,day:c.day,sus:c.sus,troca:norm(p.bai)!==norm(c.bai)})}}
  const same=moves.filter(m=>!m.troca),trocas=moves.filter(m=>m.troca),trocasOk=trocas.filter(m=>!m.sus);
  const mSame=med(same.map(m=>m.gap)),mTroca=med(trocasOk.map(m=>m.gap));
  const perEq=[...groupBy(moves,m=>m.eq)].map(([k,ms])=>{const t=ms.filter(m=>m.troca);return {k,n:t.length,sm:med(ms.filter(m=>!m.troca).map(m=>m.gap)),tr:med(t.filter(m=>!m.sus).map(m=>m.gap)),dias:new Set(ms.map(m=>m.day)).size}});
  const byTroca=[...perEq].sort((x,y)=>y.n-x.n);
  const sus=base.filter(r=>r.sus).sort((x,y)=>y.fim-x.fim);
  const bai=[...groupBy(rows,r=>r.bai||'(sem bairro)')].map(([k,rs])=>{const a=agg(rs);const f=rs.filter(r=>/^IMOVEL FECHADO/.test(norm(r.res))).length;return {k,sf:[...new Set(rs.map(r=>r.sf).filter(Boolean))].join(', '),a,f,cs:[...new Set(rs.map(r=>r.eq))]}});
  bai.sort({os:(x,y)=>y.a.rec-x.a.rec,pr:(x,y)=>y.a.pr-x.a.pr,fech:(x,y)=>y.f/y.a.rec-x.f/x.a.rec,nome:(x,y)=>x.k<y.k?-1:1}[TL.sort]);
  const eqs=[...new Set(base.map(r=>r.eq))].sort();if(!eqs.includes(TL.eq))TL.eq=byTroca[0]?byTroca[0].k:(eqs[0]||'');
  const dias=[...new Set(base.filter(r=>r.eq===TL.eq).map(r=>r.day))].sort().reverse();if(!dias.includes(TL.day))TL.day=dias[0]||'';
  const rota=base.filter(r=>r.eq===TL.eq&&r.day===TL.day).sort((x,y)=>x.fim-y.fim);
  const AR=areaStats(rows),arTop=AR.S.slice().sort((x,y)=>y.nota-x.nota)[0];
  const tiles=[['areas','Melhores áreas',arTop?'Setor '+esc(arTop.k):'—',arTop?(arTop.d?esc(arTop.d)+' · ':'')+'nota '+arTop.nota:'sem amostra','g'],['bairros','Bairros atendidos',fmt(bai.length),`${fmt(new Set(rows.map(r=>r.sf).filter(Boolean)).size)} setores`,''],
    ['trocas','Trocas de bairro',fmt(trocas.length),`de ${fmt(moves.length)} deslocamentos`,''],
    ['same','Tempo entre OS · mesmo bairro',mSame==null?'—':mSame+' min','mediana da equipe',''],
    ['troca','Tempo ao trocar de bairro',mTroca==null?'—':mTroca+' min','mediana, sem baixas fora do local',''],
    ['sus','Baixas fora do local',fmt(sus.length),`${pct(sus.length,base.length)}% das baixas`,'sp']];
  const T=TL.tab;let det='';
  const tbl=(head,body,lim)=>`<div class="tw"><table${lim?` data-limit="${lim}"`:''}><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  const bars=(title,sub,items,cls)=>miniBlock(title,sub,items,{cls:'wide '+(cls||'')});
  const buckets=gs=>{const B=[['até 2 min',0,2],['3 a 5 min',3,5],['6 a 10 min',6,10],['11 a 20 min',11,20],['21 a 45 min',21,45],['mais de 45 min',46,1e9]];const n=gs.length||1;const mx=Math.max(1,...B.map(([l,a,b])=>gs.filter(g=>g>=a&&g<=b).length));return B.map(([l,a,b])=>{const c=gs.filter(g=>g>=a&&g<=b).length;return {l,w:c/mx*100,v:fmt(c),s:pct(c,n,0)+'%',c:'#7cc7ff'}})};
  const two=(h,a,b)=>`<h3>${h}</h3><div class="tl-two"><div>${a}</div><div>${b}</div></div>`;
  if(T==='bairros'){const top=[...bai].sort((x,y)=>y.a.rec-x.a.rec).slice(0,10),mx=Math.max(1,...top.map(x=>x.a.rec));
    det=two(`Bairros atendidos <small><select id="tlSort" class="daysel" aria-label="Ordenar"><option value="os">Mais OS</option><option value="pr">Maior produtividade</option><option value="fech">Mais imóvel fechado</option><option value="nome">Nome</option></select></small>`,
      tbl('<th>Bairro</th><th class="n">OS</th><th class="n">Produtividade</th><th class="n">Imóvel fechado</th><th class="n">Colab.</th>',bai.map(b=>`<tr data-b="${esc(b.k)}"><td>${esc(b.k)}<br><span class="muted small">setor ${esc(b.sf)||'—'}</span></td><td class="n">${fmt(b.a.rec)}</td><td class="n ${b.a.pr>=META?'rp':'rn'}">${pct(b.a.prod,b.a.den)}%</td><td class="n">${pct(b.f,b.a.rec,0)}%</td><td class="n" title="${esc(b.cs.map(nomeDe).join(', '))}">${b.cs.length}</td></tr>`).join(''),12),
      bars('10 bairros com mais OS','cor = produtividade',top.map(x=>({l:esc(x.k),w:x.a.rec/mx*100,v:fmt(x.a.rec),s:pct(x.a.prod,x.a.den,0)+'%',c:x.a.pr>=META?'var(--green)':x.a.pr>=35?'#7cc7ff':'#f87171',attr:`data-tb="${esc(x.k)}"`}))))}
  else if(T==='trocas'){const rotas=[...groupBy(trocas,m=>m.from+' → '+m.to)].map(([k,ms])=>({k,n:ms.length,g:med(ms.map(m=>m.gap)),s:ms.filter(m=>m.sus).length,to:ms[0].to})).sort((x,y)=>y.n-x.n).slice(0,30);
    const pe=byTroca.slice(0,11),mx=Math.max(1,...pe.map(x=>x.n));
    det=two('Trocas de bairro <small>toque para ver as OS do bairro de destino</small>',
      tbl('<th>De → Para</th><th class="n">Vezes</th><th class="n">Tempo típico</th><th class="n">Fora do local</th>',rotas.map(x=>`<tr data-b="${esc(x.to)}"><td>${esc(x.k)}</td><td class="n">${x.n}</td><td class="n">${x.g} min</td><td class="n ${x.s?'rn':''}">${x.s||'—'}</td></tr>`).join(''),12),
      bars('Trocas por colaborador','toque para ver a rota',pe.map(x=>({l:esc(curto(x.k)),w:x.n/mx*100,v:fmt(x.n),s:(x.n/Math.max(1,x.dias)).toFixed(1).replace('.',',')+'/dia',c:'#c4b5fd',attr:`data-tq="${esc(x.k)}"`}))))}
  else if(T==='same'||T==='troca'){const key=T==='same'?'sm':'tr';const L=[...perEq].filter(x=>x[key]!=null).sort((x,y)=>x[key]-y[key]);const mx=Math.max(1,...L.map(x=>x[key]));

    det=two(`${T==='same'?'Tempo entre OS no mesmo bairro':'Tempo ao trocar de bairro'} <small>mediana da equipe: ${T==='same'?mSame:mTroca} min</small>`,
      bars('Por colaborador','mediana · toque para ver a rota',L.map(x=>({l:esc(curto(x.k)),w:x[key]/mx*100,v:x[key]+' min',s:x.dias+' dias',c:T==='same'?'#7cc7ff':'#c4b5fd',attr:`data-tq="${esc(x.k)}"`}))),
      bars('Como se distribui','quantidade de deslocamentos',buckets(gs))+(T==='troca'&&lenta.length?`<div class="svct" style="margin-top:14px">Trocas mais demoradas <span class="muted">acima de 45 min</span></div>`+tbl('<th>Colaborador</th><th>De → Para</th><th class="n">Dia</th><th class="n">Tempo</th>',lenta.map(m=>`<tr data-os="${esc(m.c.os)}"><td>${esc(nomeDe(m.eq))}</td><td>${esc(m.from)} → ${esc(m.to)}</td><td class="n">${dayBR(m.day)}</td><td class="n rn">${m.gap} min</td></tr>`).join('')):''))}
  else if(T==='sus'){const pe=[...groupBy(sus,r=>r.eq)].map(([k,rs])=>({k,n:rs.length})).sort((x,y)=>y.n-x.n);
    const outroB=sus.filter(r=>r.susAnc&&norm(r.susAnc.bai)!==norm(r.bai)).length;
    const onde=[...groupBy(sus.filter(r=>r.susAnc),r=>r.susAnc.bai||'—')].map(([k,rs])=>({k,n:rs.length})).sort((x,y)=>y.n-x.n).slice(0,6),mo=Math.max(1,...onde.map(x=>x.n));
    det=two(`Baixas fora do local <small><button type="button" class="cptab" id="tlSusAll">Ver todas no Detalhamento →</button></small>`,
      bars('Por colaborador',TL.susEq?'filtrando '+esc(nomeDe(TL.susEq))+' · toque de novo para limpar':'toque para filtrar os cartões abaixo',pe.map(x=>({l:esc(curto(x.k)),w:x.n/Math.max(1,pe[0].n)*100,v:x.n,s:'baixas',c:x.k===TL.susEq?'#fca5a5':'#f87171',attr:`data-su="${esc(x.k)}"`}))),
      `<div class="susum"><div><b>${fmt(sus.length)}</b><span>baixas fora do local</span></div><div><b>${fmt(outroB)}</b><span>em outro bairro</span></div><div><b>${fmt(sus.length-outroB)}</b><span>outra rua ou 23:59</span></div></div>`+

  rzCarroNome()}
function rzEqDe(u){if(!u)return null;const base=rzNorm(String(u.nome).split('+')[0]);const ks=Object.keys(REG);const b=base.split(' ');
  return ks.find(k=>rzNorm(k)===base)||ks.find(k=>{const a=rzNorm(k).split(' ');return a[0]===b[0]&&a[1]===b[1]})||ks.find(k=>rzNorm(k).split(' ')[0]===b[0]&&b.length<3)||null}
/* estatísticas de produção por setor (SF) e por colaborador × setor, no período filtrado */
function rzStats(rows){
  const bySf=groupBy(rows.filter(r=>r.sf),r=>String(r.sf));const A=agg(rows);
  const setores=[...bySf].map(([sf,rs])=>{const a=agg(rs);const fech=rs.filter(r=>/IM[OÓ]VEL FECHADO/.test(r.res||'')).length;
    const bands=BANDS.map(([l,h0,h1])=>{const b=rs.filter(r=>isBaixa(r)&&hourOf(r)>=h0&&hourOf(r)<h1);const x=agg(b);return {l,n:b.length,pr:x.den?x.prod/x.den*100:null}});
    return {sf,rs,a,fech,fechP:a.den?fech/a.den*100:0,fimP:a.rec?a.FIMDIA/a.rec*100:0,dias:new Set(rs.map(r=>r.day)).size,cols:new Set(rs.map(r=>r.eq)).size,bands,bai:[...new Set(rs.map(r=>r.bai))]}});
  const cross={};rows.forEach(r=>{if(!r.sf)return;const k=r.eq+'|'+r.sf;(cross[k]=cross[k]||[]).push(r)});
  const cx={};Object.entries(cross).forEach(([k,rs])=>cx[k]=agg(rs));
  const tf=setores.reduce((q,x)=>q+x.fech,0),td=setores.reduce((q,x)=>q+x.a.den,0),tfim=setores.reduce((q,x)=>q+x.a.FIMDIA,0),trec=setores.reduce((q,x)=>q+x.a.rec,0);
  const fechAvg=td?tf/td*100:0,fimAvg=trec?tfim/trec*100:0;
  return {A,setores,cx,avg:A.den?A.prod/A.den*100:0,fechAvg,fimAvg,fechLim:Math.max(40,fechAvg+8),fimLim:Math.max(15,fimAvg+7)}}
function rzFreq(janela){const v={};janela.forEach(x=>x.itens.forEach(i=>v[i.setor]=(v[i.setor]||0)+1));return v}
function rzJanela(){const d=RZ.dia;let fim=d,k=0;while(k<9){fim=RM.proximoDiaUtil(RM.addDias(fim,1),rzFer());k++}return rzEscalaAte(fim).filter(x=>x.data<=fim).slice(-20)}
function rzJustica(jan){const p={};jan.forEach(z=>z.itens.forEach(i=>{const s=rzSetor(i.setor)||{peso:0,potencial:''};const r=p[i.unidade]||(p[i.unidade]={dias:0,pts:0,alto:0});r.dias++;r.pts+=+s.peso||0;if(rzTK(s.potencial)==='ALTO')r.alto++}));return p}

/* pontos de melhoria: cruza potencial do setor, frequência no rodízio e o resultado real das OS */
function rzInsights(ST){
  const out=[];const avg=ST.avg;const noRod=RZ.cfg.setores.filter(s=>s.peso>0);const jan=rzJanela();const fq=rzFreq(jan);
  const bySf=Object.fromEntries(ST.setores.map(s=>[s.sf,s]));const f1=x=>x.toFixed(0);
  ST.setores.filter(s=>s.a.den>=20).forEach(s=>{const cfg=rzSetor(s.sf);const pr=s.a.prod/s.a.den*100;
    if(cfg&&(rzTK(cfg.potencial)==='ALTO'||cfg.peso>=4)&&pr<avg-5)out.push({lv:'alto',sf:s.sf,imp:(avg-pr)*s.a.den,t:`Setor ${s.sf} é potencial ${cfg.potencial}, mas rende ${f1(pr)}% (média da equipe ${f1(avg)}%)`,d:`${fmt(s.a.den)} OS trabalhadas. Revisar a qualidade das ordens programadas ou reduzir o peso para liberar a equipe para setores que rendem mais.`,a:'Ver OS do setor'});
    if(cfg&&cfg.peso<=2&&cfg.peso>0&&pr>avg+5)out.push({lv:'op',sf:s.sf,imp:(pr-avg)*s.a.den,t:`Setor ${s.sf} rende ${f1(pr)}%, acima da média, mas tem peso ${cfg.peso}`,d:`Subir o peso faz a equipe voltar lá com mais frequência (hoje aparece ${fq[s.sf]||0} vez(es) em ${jan.length} dias úteis).`,a:'Ajustar peso',peso:true});
    if(s.fechP>=ST.fechLim)out.push({lv:'med',sf:s.sf,imp:s.fech,t:`Muito imóvel fechado no setor ${s.sf}: ${f1(s.fechP)}% das OS trabalhadas (média ${f1(ST.fechAvg)}%)`,d:(()=>{const b=s.bands.filter(x=>x.n>=10&&x.pr!=null).sort((x,y)=>y.pr-x.pr);return b.length>1?`Melhor faixa: ${b[0].l} (${f1(b[0].pr)}%) · pior: ${b[b.length-1].l} (${f1(b[b.length-1].pr)}%). Programar esse setor para começar na melhor faixa.`:'Tentar outro horário de visita ou reprogramar em lote.'})(),a:'Ver OS do setor'});
  });
  noRod.forEach(s=>{if(!bySf[String(s.codigo)]&&(fq[s.codigo]||0)>0)out.push({lv:'info',sf:String(s.codigo),imp:1,t:`Setor ${s.codigo} está no rodízio, mas não tem OS no período filtrado`,d:'Confirmar no GeoCall se há ordens para esse setor. Se não houver, baixe o peso para não mandar ninguém à toa.',a:'Ajustar peso',peso:true})});
  ST.setores.forEach(s=>{const cfg=rzSetor(s.sf);if(s.a.rec>=20&&(!cfg||!(cfg.peso>0)))out.push({lv:'op',sf:s.sf,imp:s.a.rec,t:`Setor ${s.sf} tem ${fmt(s.a.rec)} OS no GeoCall, mas está fora do rodízio`,d:cfg?'Está com peso 0. Coloque um peso para ele entrar na escala.':'Não está cadastrado no rodízio. Se for da área, cadastre em Pesos dos setores.',a:'Ver OS do setor'})});
  // colaborador: onde rende mais × menos
  const byEq={};Object.entries(ST.cx).forEach(([k,a])=>{const [eq,sf]=k.split('|');if(a.den<15)return;(byEq[eq]=byEq[eq]||[]).push({sf,pr:a.prod/a.den*100,n:a.den})});
  Object.entries(byEq).forEach(([eq,l])=>{if(l.length<2)return;l.sort((x,y)=>y.pr-x.pr);const b=l[0],w=l[l.length-1];if(b.pr-w.pr>=20)out.push({lv:'op',eq,sf:b.sf,imp:(b.pr-w.pr)*5,t:`<span class="rzn">${esc(nomeDe(eq))}</span> rende ${f1(b.pr)}% no setor ${b.sf} e ${f1(w.pr)}% no ${w.sf}`,d:'Vale entender o que muda entre os dois setores (tipo de ordem, horário, trajeto). Quando precisar trocar alguém, prefira mandar essa pessoa para onde ela rende mais.',a:'Ver OS dele'})});
  // justiça do rodízio
  const J=rzJustica(jan);const vals=rzAtivos().map(u=>J[u.id]?J[u.id].pts/J[u.id].dias:null).filter(x=>x!=null);const m=vals.reduce((s,x)=>s+x,0)/(vals.length||1);
  rzAtivos().forEach(u=>{const r=J[u.id];if(!r)return;const v=r.pts/r.dias;if(Math.abs(v-m)>=.8)out.push({lv:v<m?'med':'info',tab:'semana',imp:.5,t:`<span class="rzn">${esc(rzNome(u.id))}</span> está com setores ${v<m?'mais fracos':'mais fortes'} que a média (${v.toFixed(1).replace('.',',')} × ${m.toFixed(1).replace('.',',')})`,d:'O rodízio corrige isso sozinho nos próximos dias; se persistir, confira faltas e ajustes manuais.',a:'Ver semana'})});
  // cobertura dos setores ALTO
  const altos=noRod.filter(s=>rzTK(s.potencial)==='ALTO');altos.forEach(s=>{const v=fq[s.codigo]||0;if(jan.length>=10&&v<jan.length*.5)out.push({lv:'med',sf:String(s.codigo),imp:2,t:`Setor ${s.codigo} (ALTO) recebe equipe só ${v} vez(es) em ${jan.length} dias úteis`,d:'Setor de maior arrecadação deveria ter equipe quase todo dia. Suba o peso ou confira se há faltas seguidas.',a:'Ajustar peso',peso:true})});
  const ord={alto:0,med:1,op:2,info:3};return out.sort((x,y)=>ord[x.lv]-ord[y.lv]||y.imp-x.imp)}

let RZ_AR=2;
function rzSetAR(){const a=innerWidth<640?1.5:2;if(a!==RZ_AR){RZ_AR=a;RZ.vb=null}}
function rzVBfoco(){const F=rzFormas();if(!F)return [0,0,1600,1600/RZ_AR];const cs=Object.keys(F.paths).filter(c=>emFoco(c));if(!cs.length||cs.length===Object.keys(F.paths).length)return rzClampVB([0,(796-1600/RZ_AR)/2,1600,1600/RZ_AR]);const b=cs.map(c=>rzBBox(F.paths[c]));return rzFitVB([Math.min(...b.map(x=>x[0])),Math.min(...b.map(x=>x[1])),Math.max(...b.map(x=>x[2])),Math.max(...b.map(x=>x[3]))],30)}
const rzNomesC=u=>{const n=u.map(rzNome).join(' + ').split(' + ');return n.length>2?n[0]+' +'+(n.length-1):n.join(' + ')};
function rzVBall(){return rzClampVB([0,(796-1600/RZ_AR)/2,1600,1600/RZ_AR])}
function rzVB(){const v=RZ.vb;return v&&v.length===4?v:rzVBall()}
function rzBBox(d){const n=String(d).match(/-?\d+(\.\d+)?/g).map(Number);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=0;i+1<n.length;i+=2){x0=Math.min(x0,n[i]);x1=Math.max(x1,n[i]);y0=Math.min(y0,n[i+1]);y1=Math.max(y1,n[i+1])}return [x0,y0,x1,y1]}
function rzFitVB(b,pad){const R=RZ_AR;let [x0,y0,x1,y1]=b;x0-=pad;y0-=pad;x1+=pad;y1+=pad;let w=x1-x0,h=y1-y0;if(w/h>R){const nh=w/R;y0-=(nh-h)/2;h=nh}else{const nw=h*R;x0-=(nw-w)/2;w=nw}return rzClampVB([x0,y0,w,h])}
function rzClampVB(v){let [x,y,w,h]=v;w=Math.max(220,Math.min(1600,w));h=w/RZ_AR;x=Math.max(0,Math.min(1600-w,x));y=h>=796?(796-h)/2:Math.max(0,Math.min(796-h,y));return [x,y,w,h]}

/* ---------- Foco em setores: rodízio completo (cada um passa por todos os setores antes de repetir) ---------- */
const FOCO_PADRAO={ativo:true,setores:[149,150,151,152,153,154,155],inicio:'2026-10-07'};
function rzFoco(){if(!RZ.cfg)return null;if(!RZ.cfg.foco)RZ.cfg.foco=JSON.parse(JSON.stringify(FOCO_PADRAO));return RZ.cfg.foco}
const focoOn=()=>{const f=rzFoco();return !!(f&&f.ativo&&f.setores&&f.setores.length)};
const emFoco=c=>!focoOn()||rzFoco().setores.includes(+c);
/* nota de cada setor: 50% potencial de arrecadação (peso) + 50% produtividade real no GeoCall (todas as planilhas guardadas) */
let _fr=null;
function focoRanking(){const f=rzFoco();const key=f.setores.join(',')+'|'+SHEETS.length+'|'+ROWS.length;if(_fr&&_fr.key===key)return _fr.list;
  const rows=typeof allSheetRows==='function'?allSheetRows():[];const g=groupBy(rows.filter(r=>r.sf),r=>String(r.sf));
  const base=f.setores.map(c=>{const s=rzSetor(c)||{codigo:c,peso:1,potencial:'',bairros:''};const rs=g.get(String(c))||[];const a=agg(rs);
    const fech=rs.filter(r=>/^IMOVEL FECHADO/.test(norm(r.res))).length;const p=agg(rs.filter(r=>r.tipo==='POS'));return {c:+c,s,a,pr:a.den>=20?a.prod/a.den*100:null,fechP:a.den?fech/a.den*100:0,pPr:p.den>=10?p.prod/p.den*100:null,d:distDe(c)}});
  const vals=base.filter(x=>x.pr!=null).map(x=>x.pr),mx=Math.max(1,...vals),med=vals.length?vals.reduce((p,q)=>p+q,0)/vals.length:0;
  base.forEach(x=>{const pr=x.pr==null?med:x.pr;x.nota=Math.round(50*((+x.s.peso||0)/5)+50*(pr/mx))});
  base.sort((x,y)=>y.nota-x.nota||x.c-y.c);_fr={key,list:base};return base}
function hung(c){const n=c.length,INF=1e18,u=Array(n+1).fill(0),v=Array(n+1).fill(0),p=Array(n+1).fill(0),way=Array(n+1).fill(0);
  for(let i=1;i<=n;i++){p[0]=i;let j0=0;const minv=Array(n+1).fill(INF),used=Array(n+1).fill(false);
    do{used[j0]=true;const i0=p[j0];let delta=INF,j1=0;for(let j=1;j<=n;j++)if(!used[j]){const cur=c[i0-1][j-1]-u[i0]-v[j];if(cur<minv[j]){minv[j]=cur;way[j]=j0}if(minv[j]<delta){delta=minv[j];j1=j}}
      for(let j=0;j<=n;j++){if(used[j]){u[p[j]]+=delta;v[j]-=delta}else minv[j]-=delta}j0=j1}while(p[j0]!==0);
    do{const j1=way[j0];p[j0]=p[j1];j0=j1}while(j0)}
  const r=Array(n);for(let j=1;j<=n;j++)if(p[j])r[p[j]-1]=j-1;return r}
/* ciclo de cada pessoa = setores já feitos desde que completou o último giro */
function focoCiclos(hist){const S=rzFoco().setores.map(Number),cic={},ult={};
  hist.forEach(d=>d.itens.forEach(i=>{if(!S.includes(+i.setor))return;const c=cic[i.unidade]||(cic[i.unidade]=new Set());if(c.size>=S.length)c.clear();c.add(+i.setor);ult[i.unidade]=+i.setor}));
  Object.keys(cic).forEach(k=>{if(cic[k].size>=S.length)cic[k].clear()});return {cic,ult}}
function focoGerar(d,hist){const S=rzFoco().setores.map(Number);const rank=focoRanking().map(x=>x.c);
  const pes=RM.disponiveis(RZ.cfg.unidades,d,RZ.cfg.ausencias||[]);if(!pes.length)return [];
  const {cic,ult}=focoCiclos(hist);
  /* 1) reforço vai para os setores que mais gente ainda precisa visitar neste giro (desempate: melhor nota);
     2) o cálculo distribui as pessoas com menor custo: repetir setor antes de fechar o giro custa muito, sair da distribuição ideal custa pouco. */
  const n=pes.length;const need={},cap={};rank.forEach(c=>{need[c]=pes.filter(u=>!(cic[u.id]&&cic[u.id].has(c))).length;cap[c]=0});
  for(let k=0;k<n;k++){let best=rank[0],bv=-1e9;for(const c of rank){const v=need[c]-cap[c]+(cap[c]===0?.5:0);if(v>bv){bv=v;best=c}}cap[best]++}
  const slots=[];rank.forEach((c,ri)=>{for(let k=0;k<n;k++)slots.push({c,k,ri,ok:k<cap[c]})});
  const N=slots.length;const C=[];
  for(let i=0;i<N;i++){const row=[];for(let j=0;j<N;j++){const u=pes[i],sl=slots[j];if(!u){row.push(0);continue}
      const feito=cic[u.id]&&cic[u.id].has(sl.c);row.push((feito?10000:0)+(ult[u.id]===sl.c?300:0)+(sl.ok?sl.k*3:400+sl.k*50)+sl.ri*0.01)}C.push(row)}
  const a=hung(C);const out=[];pes.forEach((u,i)=>{const sl=slots[a[i]];if(sl)out.push({unidade:u.id,setor:sl.c})});
  return out.sort((x,y)=>rank.indexOf(x.setor)-rank.indexOf(y.setor))}
function rzSimular(cfg,ate){const f=rzFoco();if(!focoOn())return RM.simular(cfg,ate);
  const ini=RM.proximoDiaUtil(f.inicio>cfg.inicio?f.inicio:cfg.inicio,cfg.feriados||[]);
  const antes=ini>cfg.inicio?RM.simular(cfg,RM.addDias(ini,-1)):[];const out=antes.slice(),hist=[];let d=ini,g=0;
  while(d<=ate&&g++<1500){const aj=cfg.ajustes&&cfg.ajustes[d];const itens=aj||focoGerar(d,hist);const dia={data:d,itens,ajustado:!!aj};out.push(dia);hist.push(dia);d=RM.proximoDiaUtil(RM.addDias(d,1),cfg.feriados||[])}
  return out}
function focoStatus(d){const S=rzFoco().setores.map(Number);const hist=rzEscalaAte(d).filter(x=>x.data<=d&&x.data>=rzFoco().inicio);const {cic}=focoCiclos(hist);return {S,cic}}

function focoSextaHTML(d){const rows=typeof allSheetRows==='function'?allSheetRows():[];const {S}=areaStats(rows);if(!S.length)return '';

   <div class="fc-sxl">${top.map(x=>`<button type="button" data-rz="drill" data-sf="${x.k}">${rzChip(x.k)}<span>negociação <b>${x.pPr==null?'—':x.pPr.toFixed(0)+'%'}</b></span>${paTag(x.d)}</button>`).join('')}${bx.map(x=>`<button type="button" class="ev" data-rz="drill" data-sf="${x.k}">${rzChip(x.k)}<span>evitar · ${x.fechP.toFixed(0)}% fechado</span></button>`).join('')}</div>
   <button type="button" class="btn ghost sm" data-rz="view" data-v="sexta">Plano Sexta-feira →</button></div>`}
function rzTelaFoco(rows,ST){const f=rzFoco();const R=focoRanking();const d=RZ.dia;const dia=rzDia(d),it=dia?dia.itens:[];
  const quem={};it.forEach(i=>(quem[i.setor]=quem[i.setor]||[]).push(i.unidade));
  const {S,cic}=focoStatus(d);const pessoas=rzAtivos();const bai=new Set();R.forEach(x=>String(x.s.bairros||'').split(' / ').forEach(b=>b&&bai.add(b)));

  const prog=pessoas.map(u=>({u,n:cic[u.id]?cic[u.id].size:0}));const giroMed=prog.length?prog.reduce((s,x)=>s+x.n,0)/prog.length:0;
  const col=fxCor;
  return `<div class="kpis">
   ${rzKpi('Setores em foco',S.length,null,'maior retorno da área','rr')}

   ${rzKpi('Reforço hoje',`<span class="rrkv">${reforco.length?reforco.join(' · '):'—'}</span>`,null,'setores com 2 pessoas','')}
   ${rzKpi('Produtividade no foco',tot?pct(prd,tot)+'%':'—',null,'GeoCall · setores em foco',tot&&prd/tot*100>=META?'g':'ct')}</div>

     return `<article class="rzcard ${ok?'done':''}" style="--t:${rzCol(s.potencial)}"><span class="rzn0">${i+1}</span><button type="button" class="rzcode rzs" data-rz="setor" data-c="${s.codigo}" title="Ver no mapa">${esc(s.codigo)}</button>

       <details class="rzmore"><summary>Ajustar o dia</summary><div class="rzedit rzedit2"><label>Ordens hoje<input type="number" min="0" max="99" class="rzord" data-rz="ordens" data-u="${esc(x.unidade)}" value="${rzOrd(d,x.unidade)}"></label><button type="button" class="btn sm ghost" data-rz="semord" data-u="${esc(x.unidade)}" title="Vai para outro setor só hoje; este setor continua pendente para a pessoa">Setor sem ordens hoje</button><label>Completar com o setor<select data-rz="compl" data-u="${esc(x.unidade)}"><option value="">não completar</option>${(focoOn()?focoRanking().map(z=>rzSetor(z.c)).filter(Boolean):rzOrdem().filter(z=>z.peso>0)).filter(z=>+z.codigo!==+x.setor).map(z=>`<option value="${z.codigo}" ${+rzCompl(d)[x.unidade]===+z.codigo?'selected':''}>${z.codigo} · ${esc(z.bairros||z.potencial||'').split(' / ')[0]}</option>`).join('')}</select></label></div><div class="rzedit"><label>Mandar para o setor<select data-rz="troca" data-u="${esc(x.unidade)}">${rzOrdem().filter(z=>z.peso>0).map(z=>`<option value="${z.codigo}" ${+z.codigo===+x.setor?'selected':''}>${z.codigo} · ${esc(z.potencial)}</option>`).join('')}</select></label><button type="button" class="btn sm ghost" data-rz="falta" data-u="${esc(x.unidade)}">Faltou hoje</button></div></details></div>
      <button type="button" class="rzchk" data-rz="feito" data-u="${esc(x.unidade)}" aria-pressed="${ok}" aria-label="Marcar como programado">${ok?'✓':''}</button></article>`}).join('')}</div>
   ${sem.length?`<div class="rzfora"><span>Sem equipe hoje:</span>${sem.map(s=>`<button type="button" data-rz="setor" data-c="${s.codigo}">${rzChip(s.codigo)}</button>`).join('')}</div>`:''}
   ${fora.length?`<div class="rzfora"><span>Fora de campo:</span>${fora.map(x=>`<span class="rzpill"><span class="rzn">${esc(rzNome(x.u.id))}</span>${x.a?' · '+esc(x.a.motivo||'')+' até '+rzBR(x.a.ate):''}</span>`).join('')}</div>`:''}

  return h}

function rzTelaMapa(rows,ST){const d=RZ.dia;const se=rzSemExp();if(se)return rzDayBar('Toque num setor')+se;rzSetAR();

function rzTelaAnalise(rows,ST){
  const ins=rzInsights(ST);const jan=rzJanela(),fq=rzFreq(jan);
  const S=ST.setores.slice().sort((a,b)=>b.a.rec-a.a.rec);const avg=ST.avg;
  const sig=s=>s.a.den>=20;const prs=S.filter(sig).map(s=>({s,pr:s.a.prod/s.a.den*100}));
  const best=prs.slice().sort((a,b)=>b.pr-a.pr)[0],worst=prs.slice().sort((a,b)=>a.pr-b.pr)[0],fech=S.filter(sig).slice().sort((a,b)=>b.fechP-a.fechP)[0];
  const altoBaixo=prs.filter(x=>{const c=rzSetor(x.s.sf);return c&&rzTK(c.potencial)==='ALTO'&&x.pr<avg}).length;
  const rec=s=>{const c=rzSetor(s.sf);const pr=s.a.den?s.a.prod/s.a.den*100:0;if(!c)return ['Fora do rodízio','o'];if(!sig(s))return ['Pouca amostra','n0'];
    if(s.fechP>=ST.fechLim)return ['Mudar horário','f'];if(c.peso>=4&&pr<avg-5)return ['Revisar / baixar peso','i'];if(c.peso<=2&&pr>avg+5)return ['Subir peso','p'];return ['Manter','p0']};
  let h=`<div class="kpis">
   ${rzKpi('Setores com OS',fmt(S.length),RZ.cfg.setores.length,'no período filtrado','rr')}
   ${rzKpi('Melhor setor',best?best.s.sf:'—',null,best?best.pr.toFixed(0)+'% de produtividade':'sem amostra','g',best?`data-rz="drill" data-sf="${best.s.sf}"`:'')}
   ${rzKpi('Pior setor',worst?worst.s.sf:'—',null,worst?worst.pr.toFixed(0)+'% de produtividade':'sem amostra','sp',worst?`data-rz="drill" data-sf="${worst.s.sf}"`:'')}
   ${rzKpi('Mais imóvel fechado',fech?fech.sf:'—',null,fech?fech.fechP.toFixed(0)+'% das OS trabalhadas':'—','ct',fech?`data-rz="drill" data-sf="${fech.sf}"`:'')}
   ${rzKpi('ALTO abaixo da média',altoBaixo,null,`média da equipe ${avg.toFixed(0)}%`,altoBaixo?'sp':'g')}
   ${rzKpi('Pontos de melhoria',ins.length,null,'ver lista abaixo',ins.length?'ct':'g')}</div>`;
  const LV={alto:['Crítico','i'],med:['Atenção','f'],op:['Oportunidade','p'],info:['Info','n0']};
  h+=`<div class="panel"><h3>Pontos de melhoria da equipe e dos setores <small>gerados cruzando o rodízio com as OS do GeoCall · toque para agir</small></h3>
   ${ins.length?`<div class="rzins">${ins.slice(0,14).map(x=>`<div class="rzi rz-${x.lv}"><span class="st ${LV[x.lv][1]}">${LV[x.lv][0]}</span><div><b>${x.t}</b><p>${x.d}</p></div>
     <button type="button" class="btn sm ghost" ${x.tab?`data-rz="tab" data-t="${x.tab}"`:x.peso?`data-rz="setor" data-c="${x.sf}" data-go="mapa"`:`data-rz="drill" data-sf="${x.sf||''}" data-eq="${esc(x.eq||'')}"`}>${x.a} →</button></div>`).join('')}</div>${ins.length>14?`<p class="note">+ ${ins.length-14} pontos menores.</p>`:''}`:'<p class="note">Nenhum ponto de atenção no período. Setores e equipe estão equilibrados.</p>'}</div>`;
  h+=`<div class="panel"><h3>Desempenho por setor <small>potencial do rodízio × resultado real no GeoCall · toque na linha para ver as OS</small></h3><div class="tw"><table class="rztab"><thead><tr><th>Setor</th><th>Potencial</th><th class="n">Peso</th><th class="n">Equipe no rodízio</th><th class="n">OS</th><th>Produtividade</th><th class="n">Pagam.</th><th class="n">Imóvel fechado</th><th class="n">Colab.</th><th>Recomendação</th></tr></thead><tbody>
   ${S.map(s=>{const c=rzSetor(s.sf);const pr=s.a.den?s.a.prod/s.a.den*100:0;const [rt,rc]=rec(s);return `<tr data-rz="drill" data-sf="${esc(s.sf)}"><td>${rzChip(s.sf)}</td><td>${c?rzTier(c.potencial):'<span class="muted">fora</span>'}</td><td class="n">${c?c.peso:'—'}</td><td class="n">${fq[s.sf]||0}/${jan.length}</td><td class="n">${fmt(s.a.rec)}</td>
     <td><span class="rzpb"><i style="width:${Math.min(100,pr)}%;background:${pr>=META?'var(--green)':pr>=avg?'#7cc7ff':'#f87171'}"></i><s style="left:${META}%"></s></span><b class="rzpv">${pct(s.a.prod,s.a.den,0)}%</b></td><td class="n">${fmt(s.a.pag)}</td><td class="n">${s.fechP.toFixed(0)}%</td><td class="n">${s.cols}</td><td><span class="st ${rc}">${rt}</span></td></tr>`}).join('')}</tbody></table></div>
   </div>`;
  // colaborador × setor
  const eqs=[...new Set(rows.filter(r=>r.sf).map(r=>r.eq))].sort((a,b)=>nomeDe(a).localeCompare(nomeDe(b)));const cols=S.slice(0,14).map(s=>s.sf);
  const cell=(eq,sf)=>{const a=ST.cx[eq+'|'+sf];if(!a||a.den<5)return '<td class="c"><span class="muted">·</span></td>';const pr=a.prod/a.den*100;const t=Math.max(-1,Math.min(1,(pr-avg)/25));
    const bg=t>=0?`rgba(34,197,94,${(.12+t*.5).toFixed(2)})`:`rgba(239,68,68,${(.12-t*.5).toFixed(2)})`;
    return `<td class="c"><button type="button" class="rzhm" style="background:${bg}" data-rz="drill" data-sf="${sf}" data-eq="${esc(eq)}" data-tip="<b>${esc(nomeDe(eq))}</b> no setor ${sf}<br>${pct(a.prod,a.den)}% de produtividade<br>${fmt(a.prod)} produtivos em ${fmt(a.den)} OS">${pr.toFixed(0)}</button></td>`};
  h+=`<div class="panel"><h3>Colaborador × setor <small>produtividade (%) de cada um em cada setor · verde acima da média da equipe, vermelho abaixo · mín. 5 OS</small></h3><div class="tw"><table class="rzhmt"><thead><tr><th>Colaborador</th>${cols.map(c=>`<th class="c">${rzChip(c)}</th>`).join('')}</tr></thead><tbody>
   ${eqs.map(eq=>`<tr><td class="nw"><span class="rzn">${esc(nomeDe(eq))}</span></td>${cols.map(sf=>cell(eq,sf)).join('')}</tr>`).join('')}</tbody></table></div>
   </div>`;
  // conexões: setores vizinhos atendidos na mesma rota do dia
  const pares={};groupBy(rows.filter(r=>r.sf),r=>r.eq+'|'+r.day).forEach(rs=>{const ss=[...new Set(rs.sort((a,b)=>a.fim-b.fim).map(r=>r.sf))];for(let i=1;i<ss.length;i++){const k=[ss[i-1],ss[i]].sort().join('↔');pares[k]=(pares[k]||0)+1}});
  const pl=Object.entries(pares).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const viz=(a,b)=>(RM.VIZINHOS[a]||[]).includes(+b)||(RM.VIZINHOS[b]||[]).includes(+a);
  h+=`<div class="g2"><div class="panel"><h3>Ligações entre setores <small>trocas de setor dentro da mesma rota do dia (GeoCall)</small></h3>${pl.length?`<div class="svcb">${pl.map(([k,n])=>{const [a,b]=k.split('↔');const vz=viz(a,b);return `<button type="button" data-rz="drill" data-sf="${a}"><span>${rzChip(a)} ↔ ${rzChip(b)}</span><div class="bar"><i style="width:${n/pl[0][1]*100}%;background:${vz?'#2dd4bf':'#f5b73b'}"></i></div><b>${n}</b><em>${vz?'vizinhos':'<span style="color:#f5b73b">não vizinhos</span>'}</em></button>`}).join('')}</div>`:'<p class="note">Sem trocas de setor no período.</p>'}</div>
   <div class="panel"><h3>Faixa horária por setor <small>produtividade das baixas em cada faixa · top 8 setores</small></h3><div class="tw"><table class="rzhmt"><thead><tr><th>Setor</th>${BANDS.map(b=>`<th class="c">${b[0].replace(' ou mais','+').replace('Antes das ','< ')}</th>`).join('')}</tr></thead><tbody>
   ${S.slice(0,8).map(s=>`<tr><td>${rzChip(s.sf)}</td>${s.bands.map(b=>{if(b.n<8||b.pr==null)return '<td class="c"><span class="muted">·</span></td>';const t=Math.max(-1,Math.min(1,(b.pr-avg)/25));return `<td class="c"><span class="rzhm" style="background:${t>=0?`rgba(34,197,94,${(.12+t*.5).toFixed(2)})`:`rgba(239,68,68,${(.12-t*.5).toFixed(2)})`}" data-tip="${b.n} baixas">${b.pr.toFixed(0)}</span></td>`}).join('')}</tr>`).join('')}</tbody></table></div></div></div>`;
  return h}

     const fn=rzFuncao(u),dp=rzDupla();if(u.tipo==='carro')return `<div class="rzcar"><span><b>Carro · supressão no passeio</b><small>Titular (login no GeoCall): <b class="rzn">${u.tit?esc(rzNome(u.tit)):'<span style="color:#f5b73b">ninguém — o carro está fora da escala</span>'}</b> · Parceiro: <b class="rzn">${u.parc?esc(rzNome(u.parc)):esc(u.parcTxt||'ninguém')}</b></small></span></div>`;

/* ===== v1.28 · Supressão · regra dos 60 dias ===== */
const SUP_KW0=['vago','vazio','desocupado','abandonado','sem morador','demolido','nao ha morador','nao haver mais morador'];
let SUP={fx:'',sf:'',bai:'',wk:'',open:{}};let SUPC=null;let SUP_ADD=false;
function supCfg(){if(!SUPC){SUPC=LS.get('sa_dash_sup60',null)||{};if(!Array.isArray(SUPC.kw))SUPC.kw=SUP_KW0.slice();if(!SUPC.dias)SUPC.dias=60}return SUPC}
function supSave(){LS.set('sa_dash_sup60',SUPC)}
const SUP_FX={lib:['Liberado','#22c55e','pronto para supressão'],f7:['Libera em até 7 dias','#fbbf24','imóveis'],f30:['Libera em 8 a 30 dias','#38bdf8','imóveis'],cont:['Em contagem','#94a3b8','imóveis'],cav:['Cavalete múltiplo','#f87171','com complemento · supressão inviável']};
function supData(){const C=supCfg();const kws=C.kw.map(k=>norm(k)).filter(Boolean);const all=allSheetRows().filter(r=>!r.man);
  const key=r=>r.pde||norm(r.end||'');const EXC=['RELIGA','RESTABELECIDA','REATIVADA','CLIENTE EFETUOU PGTO','PAGAMENTO EFETIVADO','CLIENTE APRESENTOU','CORTADA','SUPRIMIDA'];
  const idx=new Map();for(const r of all){const k=key(r);if(!k)continue;const n=norm(r.res);if(EXC.some(e=>n.startsWith(e))){(idx.get(k)||idx.set(k,[]).get(k)).push(r)}}
  const hoje=dayKey(Date.now());const L=[],X=[];const visto=new Set();
  for(const r of all){const n=norm(r.res);if(!n.startsWith('CORTADA LIGACAO DE AGUA POR DEBITO'))continue;const nt=norm(r.nota||'');const kw=kws.find(k=>nt.includes(k));if(!kw)continue;
    const k=key(r);const dep=(idx.get(k)||[]).filter(x=>x.fim>r.fim).sort((a,b)=>a.fim-b.fim)[0];
    if(dep){X.push({r,dep});continue}
    if(visto.has(k))continue;visto.add(k);
    const lib=dayKey(Date.parse(r.day+'T12:00')+C.dias*864e5);const d=Math.round((Date.parse(lib)-Date.parse(hoje))/864e5);
    const cav=supCav(r);L.push({r,lib,d,kw,cav,fx:cav?'cav':d<=0?'lib':d<=7?'f7':d<=30?'f30':'cont'})}
  L.sort((a,b)=>a.d-b.d||String(a.r.sf).localeCompare(String(b.r.sf)));
  return {L,X,hoje}}
function supCav(r){const e=String(r.end||'');const m=e.match(/^(.*?)\s-\s(.+)$/);const cpl=m?m[2].trim():'';const base=m?m[1]:e;const num=(base.match(/(\S+)$/)||[])[1]||'';
  if(cpl&&!/^[A-Za-z]$/.test(cpl))return 'complemento '+cpl;if(/CAVALETE MULTIPLO|CAVALETE COLETIVO/.test(norm(r.nota||'')))return 'cavalete múltiplo na nota';return ''}
function supSemana(d){const t=new Date(d+'T12:00');const w=(t.getDay()+6)%7;return dayKey(t.getTime()-w*864e5)}
function supTexto(L,tit){const C=supCfg();return [tit,'',...L.map(x=>`Setor ${x.r.sf||'—'} | ${x.r.bai||'—'} | PDE ${x.r.pde||'—'} | ${x.r.end||'—'} | baixa ${dayBRf(x.r.day)} | ${x.cav?'cavalete múltiplo · supressão inviável':'libera '+dayBRf(x.lib)+(x.d>0?' (faltam '+x.d+' dias)':' (liberado)')} | ${String(x.r.nota||'').replace(/\s+/g,' ').trim()}`),'',`${L.length} imóve${L.length===1?'l':'is'} · regra de ${C.dias} dias após o corte`].join('\n')}
function vSup60(v){const C=supCfg();const {L,X,hoje}=supData();const CNT={lib:0,f7:0,f30:0,cont:0,cav:0};L.forEach(x=>CNT[x.fx]++);const LV=L.filter(x=>!x.cav);
  const futuros=LV.map(x=>x.d<=0?hoje:x.lib);const W=new Map();futuros.forEach(d=>{const w=supSemana(d);W.set(w,(W.get(w)||0)+1)});const ws=[...W.keys()].sort().slice(0,8);const mx=Math.max(1,...ws.map(w=>W.get(w)));
  const prox=LV.find(x=>x.d>0);
  let F=L.filter(x=>(SUP.fx?x.fx===SUP.fx:!x.cav)&&(!SUP.sf||String(x.r.sf)===SUP.sf)&&(!SUP.bai||x.r.bai===SUP.bai)&&(!SUP.wk||supSemana(x.d<=0?hoje:x.lib)===SUP.wk));
  const sfs=[...new Set(L.map(x=>String(x.r.sf||'—')))].sort((a,b)=>a.localeCompare(b,'pt',{numeric:true}));const bais=[...new Set(L.filter(x=>!SUP.sf||String(x.r.sf)===SUP.sf).map(x=>x.r.bai))].sort();
  const G=[...groupBy(F,x=>String(x.r.sf||'—'))].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],'pt',{numeric:true}));
  const cd=x=>x.cav?`<span class="sp-cav" title="${esc(x.cav)}">cavalete múltiplo</span>`:`<span class="sp-cd" style="--c:${SUP_FX[x.fx][1]}">${x.d<=0?'liberado'+(x.d<0?' há '+(-x.d)+' dia'+(x.d===-1?'':'s'):' hoje'):'faltam '+x.d+' dia'+(x.d===1?'':'s')}</span>`;
  const row=x=>`<tr data-sos="${esc(x.r.os)}"><td class="sp-pde">${esc(x.r.pde||'—')}</td><td>${esc(x.r.end||'—')}<small>${esc(x.r.bai||'')}</small></td><td class="n" data-l="Baixa">${dayBRf(x.r.day)}</td><td class="n" data-l="Libera"><b>${dayBRf(x.lib)}</b></td><td>${cd(x)}</td><td class="sp-nt">${esc(String(x.r.nota||'').replace(/\s+/g,' ').trim())}</td></tr>`;
  const lim=8;
  const blocos=G.map(([sf,xs])=>{const aberto=SUP.open[sf];const vis=aberto?xs:xs.slice(0,lim);return `<section class="sp-sf"><header><b>Setor ${esc(sf)}</b><span>${xs.length} imóve${xs.length===1?'l':'is'} · ${new Set(xs.map(x=>x.r.bai)).size} bairro${new Set(xs.map(x=>x.r.bai)).size===1?'':'s'}${xs.some(x=>x.fx==='lib')?` · <em class="ok">${xs.filter(x=>x.fx==='lib').length} liberado${xs.filter(x=>x.fx==='lib').length===1?'':'s'}</em>`:''}</span><button type="button" class="sp-cp" data-spcp="${esc(sf)}">${CP_ICON} Copiar setor ${esc(sf)}</button></header>
    <div class="tw"><table class="sp-t"><colgroup><col style="width:118px"><col><col style="width:104px"><col style="width:112px"><col style="width:150px"><col style="width:30%"></colgroup><thead><tr><th>PDE</th><th>Endereço · bairro</th><th class="n">Baixa</th><th class="n">Liberação</th><th>Contagem</th><th>Nota de execução</th></tr></thead><tbody>${vis.map(row).join('')}</tbody></table></div>
    ${xs.length>lim?`<button type="button" class="sp-more" data-spmore="${esc(sf)}">${aberto?'Mostrar menos':'Ver os '+xs.length+' imóveis do setor'}</button>`:''}</section>`}).join('');
  const sel=(id,lab,opts,val)=>`<div class="fgroup sp-f ${val?'on':''}"><label for="${id}">${lab}</label><select id="${id}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===val?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
  window.PG_STATS=`<span><small>Supressão viável</small><b>${fmt(LV.length)}</b></span><span><small>Liberados</small><b class="${CNT.lib?'up':''}">${fmt(CNT.lib)}</b></span><span><small>Próxima liberação</small><b>${prox?dayBR(prox.lib):'—'}</b></span>`;
  v.innerHTML=`<div class="sp-w">
   <div class="sp-fks">${Object.entries(SUP_FX).map(([k,f])=>`<button type="button" class="sp-fk ${k==='cav'?'cav':''} ${SUP.fx===k?'on':''}" data-spfx="${k}" style="--c:${f[1]}"><span>${f[0]}</span><b>${fmt(CNT[k])}</b><em>${f[2]}</em></button>`).join('')}</div>
   <div class="sp-row">
    <div class="panel sp-wk"><h3>Previsão de liberações por semana <small>quantos imóveis completam ${C.dias} dias em cada semana · toque para filtrar a lista</small></h3>
     ${ws.length?`<div class="sp-bars">${ws.map((w,i)=>{const n=W.get(w),fim=dayKey(Date.parse(w+'T12:00')+6*864e5);return `<button type="button" class="${i===0?'cur':''} ${SUP.wk===w?'on':''}" data-spwk="${w}" title="Semana de ${dayBRf(w)} a ${dayBRf(fim)}: ${n} imóve${n===1?'l':'is'}"><b>${n}</b><i style="height:${Math.max(6,n/mx*100)}%"></i><span>${dayBR(w)}<em>a ${dayBR(fim)}</em></span></button>`}).join('')}</div>`:'<p class="note">Nenhum imóvel na regra com as planilhas carregadas.</p>'}</div>
    <div class="panel sp-rg"><h3>Regra aplicada <small>toque no ✕ para tirar uma palavra</small></h3>
     <p>Entra na lista o corte <b>Cortada ligação de água por débito (OP ou DIF)</b> cuja nota de execução contém uma destas palavras:</p>
     <div class="sp-chips">${C.kw.map((k,i)=>`<span>${esc(k)}<button type="button" data-spdel="${i}" aria-label="Tirar ${esc(k)}">✕</button></span>`).join('')}${SUP_ADD?`<form class="sp-add" id="spAddF"><input id="spAddI" placeholder="nova palavra" maxlength="40" autocomplete="off"><button type="submit">Incluir</button></form>`:`<button type="button" class="sp-addb" id="spAdd">+ palavra</button>`}</div>
     <p><b>Liberação</b> = data da baixa + <b>${C.dias} dias</b> corridos. Considera todas as planilhas carregadas.</p>
     <div class="sp-cavr"><b>Só endereço sem complemento.</b> Com complemento (C/1, C/2, casa 2, fundos…) é cavalete múltiplo: o mesmo ramal abastece todas as casas do terreno e a supressão fica inviável. Esses <b>${fmt(CNT.cav)}</b> imóveis ficam fora da contagem e aparecem no cartão vermelho. Letra sozinha (156 - A, 156 - B) conta como ligação individual.</div>
     <details class="sp-ex"><summary><span>Saem da lista os que depois tiveram religação, restabelecimento, pagamento, novo corte ou supressão no mesmo PDE ou endereço: <b>${fmt(X.length)}</b></span><u>ver</u></summary>
      ${X.length?`<ul>${X.slice(0,40).map(o=>`<li><b>${esc(o.r.pde||'—')}</b> ${esc(o.r.end||'')} <em>corte ${dayBR(o.r.day)} → ${esc(cap1(norm(o.dep.res).toLowerCase()))} em ${dayBR(o.dep.day)}</em></li>`).join('')}</ul>`:'<p class="note">Nenhum.</p>'}</details>
     ${C.kw.join('|')!==SUP_KW0.join('|')?'<button type="button" class="sp-rst" id="spRst">Voltar às palavras padrão</button>':''}</div>
   </div>
   <div class="panel sp-ls"><h3>Lista por setor e bairro <small>${SUP.fx==='cav'?fmt(F.length)+' imóveis com complemento · fora da supressão':fmt(F.length)+' de '+fmt(LV.length)+' imóveis com supressão viável · ordenados pela data de liberação'}</small></h3>
    <div class="sp-tb">${sel('spFx','Faixa',[['','Todas'],...Object.entries(SUP_FX).map(([k,f])=>[k,f[0]])],SUP.fx)}${sel('spSf','Setor',[['','Todos'],...sfs.map(s=>[s,'Setor '+s])],SUP.sf)}${sel('spBai','Bairro',[['','Todos'],...bais.map(b=>[b,b])],SUP.bai)}
     ${SUP.wk?`<button type="button" class="flimpa on" id="spWkX">Semana de ${dayBR(SUP.wk)} ✕</button>`:''}${SUP.fx||SUP.sf||SUP.bai||SUP.wk?'<button type="button" class="flimpa on" id="spClr">Limpar filtros</button>':''}<span class="sp-gr"></span>
     <button type="button" class="btn" id="spCpAll" ${F.length?'':'disabled'}>${CP_ICON} Copiar lista</button><button type="button" class="btn ghost" id="spXls" ${F.length?'':'disabled'}>Baixar Excel</button></div>

/* ============ Áreas: setores e bairros mais produtivos + poder aquisitivo ============ */
/* Poder aquisitivo por distrito (Censo IBGE e Mapa da Desigualdade). ate3 = % das famílias com renda até 3 salários mínimos; renda = remuneração média do emprego formal */
const DIST={
 'São Mateus':{ate3:43.8,renda:2528},'São Rafael':{ate3:54.4,renda:2776},'Iguatemi':{ate3:58.4,renda:1900},
 'Sapopemba':{ate3:49.8,renda:2818},'Parque do Carmo':{ate3:51.0,renda:3387},'José Bonifácio':{ate3:42.0,renda:2757},
 'Cidade Tiradentes':{ate3:55.5,renda:2654},'Aricanduva':{ate3:40.7,renda:2399},'Vila Formosa':{ate3:33.2,renda:1992}};
const RENDA_SP=4002;
const SF_DIST={149:'São Mateus',150:'São Mateus',151:'São Mateus',152:'São Rafael',253:'São Rafael',153:'Sapopemba',154:'Sapopemba',155:'Sapopemba',
 194:'Iguatemi',195:'Iguatemi',248:'Iguatemi',250:'Iguatemi',251:'Iguatemi',252:'Iguatemi',242:'Parque do Carmo',247:'José Bonifácio',249:'Cidade Tiradentes',148:'Aricanduva',117:'Aricanduva'};
const distDe=sf=>SF_DIST[+sf]||'';
/* índice 0–100: quanto maior, mais famílias acima de 3 salários mínimos */
const paIdx=d=>DIST[d]?100-DIST[d].ate3:null;
function paNivel(d){const i=paIdx(d);if(i==null)return null;return i>=55?{t:'Alto',c:'pa-a'}:i>=47?{t:'Médio',c:'pa-m'}:{t:'Baixo',c:'pa-b'}}
const paTag=d=>{const n=paNivel(d);return n?`<span class="pa ${n.c}" title="Poder aquisitivo do distrito ${esc(d)}">${n.t}</span>`:'<span class="pa">—</span>'};
const isFech=r=>/^IMOVEL FECHADO/.test(norm(r.res));
const dowOf=r=>new Date(r.day+'T12:00').getDay();

/* estatística de cada área; nota geral (seg–qui, dia de corte) e nota de sexta (só negociação) */
function areaStats(rows,min){rows=rows.filter(r=>!r.man&&r.cat!=='FIMDIA');
  const mk=(k,rs)=>{const a=agg(rs),c=agg(rs.filter(r=>r.tipo==='CORTE')),p=agg(rs.filter(r=>r.tipo==='POS'));
    const sfC={};rs.forEach(r=>{if(r.sf)sfC[r.sf]=(sfC[r.sf]||0)+1});const sf=Object.keys(sfC).sort((x,y)=>sfC[y]-sfC[x])[0]||'';
    const d=distDe(sf);return {k,sf,d,a,n:a.den,pr:a.den?a.pr:null,cPr:c.den>=10?c.pr:null,cN:c.den,pPr:p.den>=10?p.pr:null,pN:p.den,fechP:a.den?rs.filter(isFech).length/a.den*100:0,pa:paIdx(d)}};
  const S=[...groupBy(rows.filter(r=>r.sf),r=>String(r.sf))].map(([k,rs])=>mk(k,rs)).filter(x=>x.n>=(min||20));
  const B=[...groupBy(rows.filter(r=>r.bai),r=>r.bai)].map(([k,rs])=>mk(k,rs)).filter(x=>x.n>=15);
  [S,B].forEach(L=>{
    const nz=f=>{const v=L.map(f).filter(x=>x!=null);const lo=Math.min(...v),hi=Math.max(...v);const md=v.length?v.slice().sort((a,b)=>a-b)[Math.floor(v.length/2)]:0;return x=>{const y=f(x);const z=y==null?md:y;return hi>lo?(z-lo)/(hi-lo)*100:50}};
    const nC=nz(x=>x.cPr==null?x.pr:x.cPr),nP=nz(x=>x.pPr),nF=nz(x=>100-x.fechP),nA=nz(x=>x.pa);
    L.forEach(x=>{x.nota=Math.round(.4*nC(x)+.3*nP(x)+.1*nF(x)+.2*nA(x));x.notaSx=Math.round(.55*nP(x)+.25*nA(x)+.2*nF(x))});
  });
  return {S,B}}
const tierOf=(i,n)=>i<Math.ceil(n/3)?['Melhor','bt-ok']:i<Math.ceil(2*n/3)?['Intermediário','bt-mid']:['Pior','bt-bad'];
const prCol=fxCor;
const pc0=v=>v==null?'—':Math.round(v)+'%';
/* lista ranqueada de áreas (setor ou bairro) */
function areaList(L,key,kind,lim){const s=L.slice().sort((x,y)=>y[key]-x[key]||y.n-x.n);const n=s.length;
  return `<div class="ar-l">${s.slice(0,lim||s.length).map((x,i)=>{const [tt,tc]=tierOf(i,n);
    const nome=kind==='sf'?`Setor ${esc(x.k)}`:esc(x.k);const sub=kind==='sf'?(x.d?esc(x.d):'distrito não mapeado'):`setor ${esc(x.sf)||'—'}${x.d?' · '+esc(x.d):''}`;

   <div class="panel"><h3>Onde negociar na sexta <small>nota de sexta: conversão das negociações 55% · poder aquisitivo 25% · imóvel fechado 20% · toque para ver as negociações</small></h3>

/* ============ Evolução do painel: itens 3 a 14 ============ */
const ymOf=d=>d.slice(0,7);
const mesNome=ym=>{const m=MESES[+ym.slice(5)-1];return m.charAt(0)+m.slice(1).toLowerCase()};
const isPagR=r=>r.cat==='PAG_POS'||r.cat==='PAG_FAT';
const geoR=rows=>rows.filter(r=>!r.man&&r.cat!=='FIMDIA');
function mesAnterior(ym){const[Y,M]=ym.split('-').map(Number);const d=new Date(Y,M-2,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function rowsDoMes(ym){const[Y,M]=ym.split('-').map(Number);return applyF(scope(),Object.assign({},F,{ini:ym+'-01',fim:ym+'-'+pad(new Date(Y,M,0).getDate())}))}
/* mês do período atual: só quando o filtro cobre um único mês */
function mesDoPeriodo(rows){const ms=[...new Set(geoR(rows).map(r=>ymOf(r.day)))];return ms.length===1?ms[0]:null}
const setaH=(dv,txt,inv)=>{const good=(dv>=0)!==!!inv;return `<em class="${Math.abs(dv)<1e-9?'eq':good?'up':'dn'}">${Math.abs(dv)<1e-9?'=':dv>0?'▲':'▼'} ${txt}</em>`};
const ppH=x=>(x>=0?'+':'−')+Math.abs(x).toFixed(1).replace('.',',')+' p.p.';
const pcH=(a,b)=>a?((b>=a?'+':'−')+Math.abs(Math.round((b-a)/a*100))+'%'):b?'novo':'sem registro';

/* ---------- 9. Comparativo mês a mês (Visão Geral) ---------- */
function comparativoHTML(rows){const ym=mesDoPeriodo(rows);if(!ym)return '';const pm=mesAnterior(ym);const cur=geoR(rows);const ld=lastDay(cur);if(!ld)return '';const[Y,M]=ym.split('-').map(Number);const parcial=+ld.slice(8)<new Date(Y,M,0).getDate();const lim=+ld.slice(8);
  const prev=geoR(rowsDoMes(pm).filter(r=>!parcial||+r.day.slice(8)<=lim));const dA=new Set(cur.map(r=>r.day)).size,dP=new Set(prev.map(r=>r.day)).size;if(prev.length<100||dP<3)return '';
  const A=agg(cur),P=agg(prev);const fe=x=>x.trab?x.FECH/x.trab*100:0;const pd=(n,d)=>d?n/d:0;const f1=v=>v.toFixed(1).replace('.',',');
  const dia=(lab,ka,kp,attr)=>{const va=pd(ka,dA),vp=pd(kp,dP);return [lab,f1(va),f1(vp),setaH(va-vp,pcH(vp,va)),attr]};
  const it=[['Produtividade',pct(A.prod,A.den)+'%',pct(P.prod,P.den)+'%',setaH(A.pr-P.pr,ppH(A.pr-P.pr)),'{"prod":1}'],
    dia('OS por dia',A.trab,P.trab,'{}'),dia('Produtivos por dia',A.prod,P.prod,'{"prod":1}'),dia('Pagamentos por dia',A.pag,P.pag,'{"cats":["PAG_POS","PAG_FAT"]}'),
    dia('Cortes por dia',A.CORTE,P.CORTE,'{"cats":["CORTE"]}'),dia('Restab. e relig. por dia',A.RESTAB+A.RELIG,P.RESTAB+P.RELIG,'{"cats":["RESTAB","RELIG"]}'),
    ['Imóvel fechado',f1(fe(A))+'%',f1(fe(P))+'%',setaH(fe(A)-fe(P),ppH(fe(A)-fe(P)),true),'{"cats":["FECH"]}']];
  return `<div class="panel cmp-p"><h3>${mesNome(ym)} × ${mesNome(pm)} <small>${parcial?`dias 1 a ${lim} de cada mês`:'mês inteiro'} · ${dA} × ${dP} dias com OS · só GeoCall, sem ações especiais · toque para ver as OS</small></h3><div class="cmp">${it.map(x=>`<button type="button" class="cm" data-cmp='${x[4]}'><span>${x[0]}</span><b>${x[1]}</b><small>${mesNome(pm).toLowerCase()}: ${x[2]}</small>${x[3]}</button>`).join('')}</div></div>`}

/* ---------- 13. Destaques do mês ---------- */
function destaques(rows){const ym=mesDoPeriodo(rows);const base=geoR(rows).concat(rows.filter(r=>r.man));if(!ym)return null;
  const pm=mesAnterior(ym);const prev=rowsDoMes(pm);const temPrev=geoR(prev).length>=100;
  const evo=[...groupBy(rows,r=>r.eq)].map(([k,rs])=>{let a,b;if(temPrev){a=agg(prev.filter(r=>r.eq===k));b=agg(rs)}else{a=agg(rs.filter(r=>+r.day.slice(8)<=15));b=agg(rs.filter(r=>+r.day.slice(8)>15))}
    return a.den>=20&&b.den>=20?{k,a:a.pr,b:b.pr,d:b.pr-a.pr}:null}).filter(Boolean).sort((x,y)=>y.d-x.d);
  let first=null;[...groupBy(rows,r=>r.eq)].forEach(([k,rs])=>{const ds=[...new Set(rs.map(r=>r.day))].sort();let acc=[];for(const d of ds){acc=acc.concat(rs.filter(r=>r.day===d));const a=agg(acc);if(acc.length>=40&&new Set(acc.map(r=>r.day)).size>=3&&a.pr>=META){if(!first||d<first.d)first={k,d};break}}});
  return {evo,first,temPrev,pm,ym}}
function selosHTML(D){if(!D)return '';const e=D.evo[0];if(!e&&!D.first)return '';
  return `<div class="selos">${e&&e.d>0?`<div class="selo" style="--c:#fbbf24" data-c="${esc(e.k)}"><span class="si">🏅</span><div><small>Maior evolução do mês</small><b class="pvn">${esc(nomeDe(e.k))}</b><em>▲ ${e.d.toFixed(1).replace('.',',')} p.p. ${D.temPrev?'sobre '+mesNome(D.pm).toLowerCase():'da 1ª para a 2ª quinzena'}</em></div></div>`:''}
   ${D.first?`<div class="selo" style="--c:#22c55e" data-c="${esc(D.first.k)}"><span class="si">🎯</span><div><small>Primeiro a bater a meta de ${META}%</small><b class="pvn">${esc(nomeDe(D.first.k))}</b><em>em ${dayBRf(D.first.d)}</em></div></div>`:`<div class="selo" style="--c:#64748b"><span class="si">🎯</span><div><small>Primeiro a bater a meta de ${META}%</small><b>Ninguém ainda</b><em>o selo aparece quando alguém passar de ${META}% no acumulado</em></div></div>`}</div>`}
/* ---------- 8. Evolução no ranking ---------- */
function evolucaoHTML(D){if(!D||!D.evo.length)return '';const mx=Math.max(1,...D.evo.map(x=>Math.abs(x.d)));
  return `<div class="glass rk-list rk-evo"><div class="rk-sec"><b>Quem mais evoluiu</b><span>${D.temPrev?`${mesNome(D.ym)} comparado a ${mesNome(D.pm).toLowerCase()}`:'1ª quinzena comparada à 2ª quinzena do mês'} · produtividade</span></div>

/* ---------- 3 e 4. Conversão por bairro e realocação (Plano Sexta-feira) ---------- */
function conversaoBairros(rows){const g=groupBy(geoR(rows).filter(r=>r.bai),r=>r.bai);
  return [...g].map(([k,rs])=>{const sq=rs.filter(r=>{const d=dowOf(r);return d>=1&&d<=4}),sx=rs.filter(r=>dowOf(r)===5);
    return {k,nsq:sq.length,nsx:sx.length,sq:sq.length?sq.filter(isPagR).length/sq.length*100:null,sx:sx.length?sx.filter(isPagR).length/sx.length*100:null}}).filter(x=>x.nsq>=15&&x.nsx>=8)}
function conversaoHTML(rows){const L=conversaoBairros(rows).sort((a,b)=>b.sx-a.sx);if(!L.length)return '';const mx=Math.max(50,...L.map(x=>Math.max(x.sq,x.sx)))*1.08;
  const sx=L.filter(x=>x.sx>=x.sq+5).slice(0,5),sq=L.filter(x=>x.sq>=x.sx+8).sort((a,b)=>(b.sq-b.sx)-(a.sq-a.sx)).slice(0,5);
  const li=(arr,a,b)=>arr.map(x=>`<li data-cb="${esc(x.k)}"><span>${esc(x.k)}</span><b>${x[a].toFixed(0)}%</b><small>contra ${x[b].toFixed(0)}%</small></li>`).join('')||'<li class="muted">Nenhum bairro com diferença clara no período.</li>';
  return `<div class="g2 cv-g"><div class="panel"><h3>Conversão da negociação por bairro <small>% das OS que terminaram em pagamento (POS ou faturas pagas) · toque para ver</small></h3>
   <div class="cvl">${L.slice(0,14).map(x=>`<button type="button" class="cvr" data-cb="${esc(x.k)}"><span>${esc(x.k)}</span><span class="dumb"><i style="left:calc(6px + (100% - 12px) * ${(Math.min(x.sq,x.sx))/mx});width:calc((100% - 12px) * ${Math.abs(x.sq-x.sx)/mx})"></i><b class="d1" style="left:calc(6px + (100% - 12px) * ${(x.sq)/mx})"></b><b class="d2" style="left:calc(6px + (100% - 12px) * ${(x.sx)/mx})"></b></span><span class="cvv"><b class="c1">${x.sq.toFixed(0)}%</b><b class="c2">${x.sx.toFixed(0)}%</b></span></button>`).join('')}</div>
   <div class="tm-leg"><span><i class="o1"></i>seg a qui · pagou com risco de corte</span><span><i class="o2"></i>sexta · pagou só na negociação</span></div></div>

   <div class="rea-c" style="--c:#c4b5fd"><h4>Sexta · negociar em</h4><p>Pagam mesmo sem risco de corte</p><ul>${li(sx,'sx','sq')}</ul></div>
   <div class="rea-c" style="--c:#7cc7ff"><h4>Seg a Qui · cortar em</h4><p>Só pagam com o risco de corte</p><ul>${li(sq,'sq','sx')}</ul></div></div></div></div>`}

function reincHTML(rows){const all=geoR(allSheetRows());const per=new Set(geoR(rows).map(r=>r.pde).filter(Boolean));
  const byP=groupBy(geoR(rows).filter(r=>r.pde),r=>r.pde);
  const volta=[...byP].map(([p,rs])=>{rs.sort((a,b)=>a.fim-b.fim);return {p,rs,n:rs.length}}).filter(x=>x.n>=3&&!x.rs.some(r=>isProd(r.cat))).sort((a,b)=>b.n-a.n);
  const neg=[];byP.forEach((rs,p)=>{rs=[...rs].sort((a,b)=>a.fim-b.fim);const i=rs.findIndex(r=>r.sub==='INFRUT');if(i<0)return;const dep=rs.slice(i+1);if(dep.length&&!dep.some(isPagR))neg.push({p,a:rs[i],b:dep[dep.length-1]})});
  const allP=groupBy(all.filter(r=>r.pde&&per.has(r.pde)),r=>r.pde);const meses=new Set(all.map(r=>ymOf(r.day))).size;
  const mensal=meses>=2?[...allP].map(([p,rs])=>({p,rs,m:new Set(rs.map(r=>ymOf(r.day))).size})).filter(x=>x.m>=2&&!x.rs.some(r=>isProd(r.cat))).sort((a,b)=>b.m-a.m||b.rs.length-a.rs.length):null;
  const li=(x,sub,tag)=>{const l=x.rs?x.rs[x.rs.length-1]:x.b;return `<li data-pde="${esc(x.p)}"><span><b>${esc(l.end)}</b><small>${esc(l.bai)} · ${sub}</small></span>${tag}</li>`};
  return `<div class="panel rein-p"><h3>Reincidência <small>por imóvel (PDE) · toque para ver todas as visitas</small></h3><div class="rein ${mensal?'r3':''}">
   <div class="rea-c" style="--c:#f87171"><h4>Voltam à lista sem solução</h4><p>${fmt(volta.length)} imóveis com 3 visitas ou mais no período, nenhuma produtiva</p><ul>${volta.slice(0,8).map(x=>li(x,'último: '+esc(CAT_LBL[x.rs[x.rs.length-1].sub]||x.rs[x.rs.length-1].res),`<em>${x.n}×</em>`)).join('')||'<li class="muted">Nenhum.</li>'}</ul></div>
   <div class="rea-c" style="--c:#fbbf24"><h4>Negociaram e não pagaram depois</h4><p>${fmt(neg.length)} imóveis com negociação infrutífera e nova visita sem pagamento</p><ul>${neg.slice(0,8).map(x=>li(x,`negociação ${dayBR(x.a.day)} · sem pagamento até ${dayBR(x.b.day)}`,'')).join('')||'<li class="muted">Nenhum.</li>'}</ul></div>
   ${mensal?`<div class="rea-c" style="--c:#c4b5fd"><h4>Voltam todo mês</h4><p>${fmt(mensal.length)} imóveis em ${meses} meses de planilha, sem solução</p><ul>${mensal.slice(0,8).map(x=>li(x,'em '+x.m+' meses',`<em>${x.rs.length}×</em>`)).join('')||'<li class="muted">Nenhum.</li>'}</ul></div>`:''}</div></div>`}

/* ---------- 11. Mapa de bolhas por bairro (Telemetria) ---------- */
let BOL_COR='prod';
function bolhasHTML(rows){const F_=typeof rzFormas==='function'?rzFormas():null;if(!F_||!F_.pole)return '';
  const g=groupBy(geoR(rows).filter(r=>r.bai),r=>r.bai);const L=[...g].map(([k,rs])=>{const sfC={};rs.forEach(r=>{if(r.sf)sfC[r.sf]=(sfC[r.sf]||0)+1});const sf=Object.keys(sfC).sort((a,b)=>sfC[b]-sfC[a])[0]||'';const a=agg(rs);return {k,sf,n:rs.length,pr:a.pr,fe:rs.filter(r=>r.sub==='FECH').length/rs.length*100}}).filter(x=>x.n>=5).sort((a,b)=>b.n-a.n);
  if(!L.length)return '';const mx=Math.max(...L.map(x=>x.n));const cnt={};const sem=[];const cs=[];
  const cor=x=>BOL_COR==='prod'?(x.pr>=45?'#22c55e':x.pr>=35?'#7cc7ff':x.pr>=25?'#f5b73b':'#f87171'):(x.fe>=55?'#ef4444':x.fe>=45?'#fb923c':x.fe>=35?'#fbbf24':'#86efac');
  L.forEach(x=>{const p=F_.pole[x.sf];if(!p){sem.push(x);return}const i=cnt[x.sf]=(cnt[x.sf]||0)+1;const ang=(i-1)*2.4,rr=i===1?0:22+11*Math.sqrt(i-1);cs.push(Object.assign({cx:p[0]+rr*Math.cos(ang),cy:p[1]+rr*Math.sin(ang),r:6+20*Math.sqrt(x.n/mx)},x))});
  const used=new Set(L.map(x=>x.sf));const pts=[];Object.keys(F_.paths).filter(c=>used.has(c)).forEach(c=>{const n=String(F_.paths[c]).match(/-?\d+(\.\d+)?/g).map(Number);for(let i=0;i+1<n.length;i+=2)pts.push([n[i],n[i+1]])});
  const x0=Math.min(...pts.map(p=>p[0]))-30,y0=Math.min(...pts.map(p=>p[1]))-30,x1=Math.max(...pts.map(p=>p[0]))+30,y1=Math.max(...pts.map(p=>p[1]))+30;
  const leg=BOL_COR==='prod'?[['#22c55e','45% ou mais'],['#7cc7ff','35 a 45%'],['#f5b73b','25 a 35%'],['#f87171','abaixo de 25%']]:[['#ef4444','55% ou mais'],['#fb923c','45 a 55%'],['#fbbf24','35 a 45%'],['#86efac','abaixo de 35%']];
  return `<div class="panel bol"><h3>Mapa de bolhas por bairro <small>tamanho = volume de OS · toque numa bolha para ver as OS</small><span class="bol-sw"><button type="button" class="cptab ${BOL_COR==='prod'?'on':''}" data-bc="prod">Produtividade</button><button type="button" class="cptab ${BOL_COR==='fech'?'on':''}" data-bc="fech">Imóvel fechado</button></span></h3>
   <div class="bol-g"><svg viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}" class="bol-svg" role="img" aria-label="Mapa de bolhas por bairro">${Object.keys(F_.paths).map(c=>`<path d="${F_.paths[c]}" class="bol-sf ${used.has(c)?'on':''}"/>`).join('')}
    ${cs.map(x=>`<circle cx="${x.cx.toFixed(0)}" cy="${x.cy.toFixed(0)}" r="${x.r.toFixed(0)}" fill="${cor(x)}" class="bol-c" data-bb="${esc(x.k)}" data-tip="<b>${esc(x.k)}</b> · setor ${esc(x.sf)}<br>${fmt(x.n)} OS · ${x.pr.toFixed(0)}% produtividade<br>${x.fe.toFixed(0)}% imóvel fechado"/>`).join('')}
    ${[...groupBy(cs,x=>x.sf)].map(([c,xs])=>`<text x="${F_.pole[c][0]}" y="${Math.min(...xs.map(x=>x.cy-x.r))-10}" class="bol-t">Setor ${c}</text>`).join('')}</svg>
    <div class="bol-side"><div class="svct">${BOL_COR==='prod'?'Produtividade':'Imóvel fechado'}</div><ul class="bol-leg">${leg.map(l=>`<li><i style="background:${l[0]}"></i>${l[1]}</li>`).join('')}</ul>
     <div class="svct" style="margin-top:14px">Bairros sem posição <span class="muted">${sem.length}</span></div>${sem.length?`<ul class="bol-sem">${sem.map(x=>`<li data-bb="${esc(x.k)}">${esc(x.k)} <span class="muted">${fmt(x.n)} OS${x.sf?' · setor '+esc(x.sf):''}</span></li>`).join('')}</ul>`:''}</div></div></div>`}

/* ---------- 12. Reunião do dia ---------- */
let REU_DAY='';
/* exceções que pedem ação: só aparece o que está fora do normal */
function atencaoHTML(rows,dia){try{const it=[];const g=geoR(rows);const dd=g.filter(r=>r.day===dia);const N=x=>`<b class="pvn">${esc(nomeDe(x))}</b>`;
  const dias=[...new Set(g.map(r=>r.day))].sort().filter(d=>d<=dia);const ult=new Set(dias.slice(-5));
  // queda recente: últimos 5 dias com OS bem abaixo do acumulado do período
  for(const [k,rs] of groupBy(g,r=>r.eq)){const a=agg(rs),u=agg(rs.filter(r=>ult.has(r.day)));if(a.den>=40&&u.den>=20&&a.pr-u.pr>=10)it.push({n:2,t:`${N(k)} caiu para <b class="${fxTxt(u.pr)}">${pct(u.prod,u.den,0)}%</b> nos últimos 5 dias (no período: ${pct(a.prod,a.den,0)}%).`,a:{ficha:k}})}
  // longe da meta no período
  const lon=[...groupBy(g,r=>r.eq)].map(([k,rs])=>({k,a:agg(rs)})).filter(x=>x.a.den>=40&&x.a.pr<META-FAIXA_AT).sort((x,y)=>x.a.pr-y.a.pr);
  if(lon.length)it.push({n:2,t:`${lon.length===1?'1 colaborador está':lon.length+' colaboradores estão'} abaixo de ${META-FAIXA_AT}% no período: ${lon.slice(0,3).map(x=>N(x.k)+' '+pct(x.a.prod,x.a.den,0)+'%').join(', ')}${lon.length>3?' e mais '+(lon.length-3):''}.`,a:{go:'colab'}});
  // ritmo abaixo do necessário para fechar o mês na meta
  {const T=termoData(rows);if(T&&T.rest){const L=T.L.filter(x=>x.st!=='peq'&&x.st!=='ok'&&x.need>0&&x.faz<x.need&&!lon.some(y=>y.k===x.k)).sort((x,y)=>(y.need-y.faz)-(x.need-x.faz));if(L.length)it.push({n:1,t:`Ritmo abaixo do necessário para fechar ${mesNome(T.ym).toLowerCase()} em ${META}%: ${L.slice(0,3).map(x=>N(x.k)+' (precisa '+Math.ceil(x.need)+'/dia, faz '+Math.round(x.faz)+')').join(', ')}${L.length>3?' e mais '+(L.length-3):''}.`,a:{go:'colab'}})}}
  // no dia: baixas fora do local
  const sus=[...groupBy(dd.filter(r=>r.sus),r=>r.eq)];if(sus.length)it.push({n:2,t:`Baixas fora do local no dia: ${sus.map(([k,rs])=>N(k)+' ('+rs.length+')').join(', ')}.`,a:{day:dia,sus:true,label:'Baixas fora do local · '+dayBRf(dia)}});
  // no dia: parado além do almoço e deslocamento além do esperado
  const ref=typeof dlRef==='function'?dlRef(rows):null;const par=[],des=[];
  for(const [k,rs] of groupBy(ivSeq(dd),r=>r.eq)){if(rows.some(r=>r.man&&r.eq===k&&r.day===dia))continue;const I=ivDia(rs);if(I.exc>=30*6e4)par.push([k,I.exc]);if(ref){const D=dlDia(rs,ref);if(D.exc>=30*6e4)des.push([k,D.exc])}}
  if(par.length)it.push({n:1,t:`Parado além do almoço no dia: ${par.sort((a,b)=>b[1]-a[1]).map(([k,e])=>N(k)+' '+fcMin(e)).join(', ')}.`,a:{ficha:par[0][0],dia}});
  if(des.length)it.push({n:1,t:`Deslocamento além do esperado no dia: ${des.sort((a,b)=>b[1]-a[1]).map(([k,e])=>N(k)+' '+fcMin(e)).join(', ')}.`,a:{ficha:des[0][0],dia}});
  // no dia: chegada tardia na 1ª OS
  const tar=[];for(const [k,rs] of groupBy(dd.filter(r=>isBaixa(r)&&!r.sus),r=>r.eq)){const c=Math.min(...rs.map(r=>r.ini||r.fim));const q=new Date(c);const m=q.getHours()*60+q.getMinutes();if(m>JA_INI+15)tar.push([k,m])}
  if(tar.length)it.push({n:1,t:`Chegada na 1ª OS depois das ${hm(JA_INI+15)}: ${tar.sort((a,b)=>b[1]-a[1]).map(([k,m])=>N(k)+' '+minToHM(m)).join(', ')}.`,a:{ficha:tar[0][0],dia}});
  // pendência do líder
  const lp=typeof lidLista==='function'?lidLista().filter(lidPend).length:0;if(lp)it.push({n:1,t:`<b>${lp} OS</b> do login do líder ainda sem colaborador.`,a:{go:'planilhas'}});
  it.sort((a,b)=>b.n-a.n);
  return `<div class="panel at-p"><h3>Pontos de atenção <small>${it.length?it.length+' ponto'+(it.length>1?'s':'')+' · toque para ver':'nada fora do normal neste dia'}</small></h3>${it.length?`<ul class="at-l">${it.map(x=>`<li><button type="button" data-at='${esc(JSON.stringify(x.a))}'><i class="${x.n>1?'r':'a'}"></i><span>${x.t}</span><em>ver →</em></button></li>`).join('')}</ul>`:'<p class="at-ok">✓ Nenhum alerta: jornada, deslocamento, baixas e metas dentro do esperado.</p>'}</div>`}catch(e){return ''}}
/* v1.25 · Reunião do Dia (briefing) */
function reuTopHTML(rows,dia,dias){try{const g=geoR(rows);const d=g.filter(r=>r.day===dia);const A=agg(d);const i=dias.indexOf(dia);const pd=dias[i+1];const P=pd?agg(g.filter(r=>r.day===pd)):null;
  const f1=x=>x.toFixed(1).replace('.',',');const ym=dia.slice(0,7);const M=agg(g.filter(r=>r.day.startsWith(ym)&&r.day<=dia));
  const dl=(a,b)=>{const x=a-b;return `<b class="${x>=0?'up':'dn'}">${x>=0?'▲':'▼'} ${f1(Math.abs(x))} p.p.</b>`};

  case 'rua':return String(r.end||'').replace(/\s+-\s+.*$/,'').replace(/\s+\d.*$/,'').trim();case 'dur':return r.ini&&r.fim>r.ini?fcMin(r.fim-r.ini):'';default:return String(r[k]==null?'':r[k])}}

     ${L.map(x=>`<tr data-gk="${esc(x.k)}"><td><b>${esc(x.k)}</b></td><td class="n">${fmt(x.n)}</td><td class="n">${fmt(x.p)}</td><td class="n">${fmt(x.n-x.p)}</td><td class="n ${x.p/x.n*100>=META?'up':'dn'}">${pct(x.p,x.n)}%</td><td><span class="rl-bar"><i style="width:${x.n/mx*100}%"></i></span> ${pct(x.n,rows.length)}%</td></tr>`).join('')}</tbody>

/* ---------- Relatórios: saída organizada (Excel de verdade, PDF e cópia formatada) ---------- */
function relModelo(rows){const cols=REL.cols.filter(c=>!(APRES&&c==='nota'));const prodN=rows.filter(r=>isProd(r.cat)).length;
  if(REL.grp){const g=new Map();rows.forEach(r=>{const k=relVal(r,REL.grp)||'(sem informação)';if(!g.has(k))g.set(k,[]);g.get(k).push(r)});
    const L=[...g].map(([k,rs])=>({k,n:rs.length,p:rs.filter(r=>isProd(r.cat)).length})).sort((a,b)=>REL.grp==='day'?(a.k.split('/').reverse().join()<b.k.split('/').reverse().join()?-1:1):b.n-a.n);
    return {grp:true,head:[[REL_GRP.find(x=>x[0]===REL.grp)[1],'t'],['OS','n'],['Produtivas','n'],['Não produtivas','n'],['Produtividade','p'],['% do total','p']],
      rows:L.map(x=>[x.k,x.n,x.p,x.n-x.p,x.n?x.p/x.n:0,rows.length?x.n/rows.length:0]),total:['Total',rows.length,prodN,rows.length-prodN,rows.length?prodN/rows.length:0,1]}}
