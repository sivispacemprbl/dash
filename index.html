<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Dancing+Script:wght@600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#061328;--bg2:#0a1c38;--panel:#0d2244;--panel2:#10294f;--line:#1c3a66;--line2:#27497a;
  --txt:#e8f0fb;--mut:#93a8c7;--dim:#6781a6;
  --blue:#3a8bd6;--blue2:#2a72bd;--green:#22c55e;--orange:#f47a2a;--red:#ef4444;--purple:#a47cf3;--amber:#f5b73b;--cyan:#38bdf8;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt)}
body{font-family:var(--font);font-size:14px;line-height:1.35;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr auto;min-height:100vh}
header.top{grid-column:1/-1;display:grid;grid-template-columns:minmax(300px,auto) 1fr auto;gap:28px;align-items:center;padding:14px 20px;background:linear-gradient(180deg,#0a1f40,#071730);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
.lockup{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none}
.slogo{height:62px;width:auto;flex:none;display:block}
.brand .lk-tag{display:block;font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#9fd0ff;border-top:1px solid #2f5a92;padding-top:3px;line-height:1;white-space:nowrap}
.bdiv{width:1px;align-self:stretch;background:linear-gradient(180deg,transparent,#2f5a92,transparent);margin:2px 4px}
.brand b{display:block;font-family:var(--cond);font-size:26px;letter-spacing:.5px;line-height:1;white-space:nowrap}
.brand span{display:block;color:var(--cyan);font-family:var(--cond);font-size:16px;letter-spacing:.4px}
.brand small{display:block;color:var(--mut);font-size:10px;max-width:220px;letter-spacing:.3px;text-transform:uppercase}
.title h1{margin:0;font-family:var(--cond);font-size:30px;letter-spacing:.6px;line-height:1.05;text-wrap:balance}
.title h2{margin:2px 0 0;font-family:var(--cond);font-weight:500;color:var(--cyan);font-size:24px;letter-spacing:.8px}
.clock{display:flex;gap:12px;align-items:center;color:var(--txt)}
.clock div{font-size:15px}
.clock div b{display:block;font-weight:500;font-size:17px}
.motto{font-family:"Dancing Script",cursive;color:#c9d6ea;font-size:19px;line-height:1.05;text-align:right}
nav.side{background:linear-gradient(180deg,#081a36 0%,#071630 55%,#0a2448 100%);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
nav.side button{display:flex;gap:12px;align-items:center;background:none;border:0;border-radius:6px;padding:11px 12px;color:#c9d6ea;cursor:pointer;text-align:left;font-size:15px}
nav.side button svg{width:20px;height:20px;flex:none;fill:currentColor}
nav.side button:hover{background:#0f2a52}
nav.side button.on{background:linear-gradient(90deg,#1b4a8c,#12346a);color:#fff;box-shadow:inset 3px 0 0 var(--blue)}
.plhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.plc{background:#0b1f3f;border:1px solid var(--line2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;opacity:.72}
.plc.on{opacity:1;border-color:#2f6fd0;box-shadow:inset 3px 0 0 var(--blue)}
.plt{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.plt input{margin-top:3px;width:20px;height:20px;flex:none}
.plt b{display:block;overflow-wrap:anywhere;font-size:14px}.plt small{color:var(--mut);font-size:12px}
.plm{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:#c9d6ea}
.pla{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn.danger{background:#b91c1c;border-color:#ef4444}
.sidein{display:flex;flex-direction:column;gap:4px;position:sticky;min-height:100%}
.ptop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.ptop button,.pbai button{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:5px;padding:4px;color:#dbe7f7;font-size:12.5px;text-align:left;cursor:pointer}
.ptop button:hover,.pbai button:hover{background:#12305a}
.ptop .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptop b,.pbai b{font-size:14px}
.md{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0b1f3f}
.md.m0{background:#f5b73b}.md.m1{background:#cbd5e1}.md.m2{background:#d08a4b}
.pbai{list-style:none;margin:0;padding:0}
.pbai button span{flex:1;min-width:0}
.pbai b{color:#fca5a5}
.pend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-width:100%}
.pend li{display:flex;align-items:flex-start;gap:4px}
.pend label{flex:1;display:flex;gap:7px;align-items:flex-start;font-size:12.5px;cursor:pointer;padding:3px 0;min-width:0}
.pend label span{overflow-wrap:anywhere}
.pend li.ok span{text-decoration:line-through;color:var(--mut)}
.pend input{width:15px;height:15px;margin-top:1px;flex:none}
.px{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.px:hover{color:#fca5a5}
#ntT{width:100%;resize:vertical;background:#0a1b37;border:1px solid var(--line2);border-radius:6px;padding:8px;font-size:13px;line-height:1.4;min-height:110px}
#ntT:focus{outline:none;border-color:var(--blue)}
.pref{display:grid;grid-template-columns:1fr;gap:0;margin:0;font-size:12.5px}
.pref dt{color:var(--mut);font-size:11.5px;margin-top:5px}.pref dt:first-child{margin-top:0}.pref dd{margin:0}
.presumo{background:var(--blue2)!important;border:1px solid #3b8cf7!important;color:#fff!important;justify-content:center;width:100%}
.pulse{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
#notes{margin-top:10px;padding-top:0;border-top:0}
.pulse .pb{background:rgba(13,34,68,.75);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.pulse .pt{font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#c9d6ea;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pulse .pt b{font-size:16px;letter-spacing:0}
.pulse .pt .muted{font-weight:400;text-transform:none;letter-spacing:0;font-size:11px}
.pulse .ps{font-size:12px;color:var(--mut);margin:0}
.pulse .ps b{color:#e8f0fb}
.pbar{position:relative;height:9px;background:#17345f;border-radius:5px}
.pbar i{display:block;height:100%;border-radius:5px}
.pbar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:#ef4444;text-decoration:none}
.pq label{font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#c9d6ea;display:block;margin-bottom:5px}
.pqr{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:#0a1b37}
.pqr input{flex:1;min-width:0;border:0;background:none;padding:8px 9px;font-size:13px}
.pqr input:focus{outline:none}.pqr:focus-within{border-color:var(--blue)}
.pqr button{border:0;background:var(--blue2);color:#fff;padding:0 10px;cursor:pointer}
.pg4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pg4 button{background:#0b1f3f;border:1px solid var(--line);border-radius:6px;padding:6px 7px;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.pg4 button:hover{border-color:var(--blue)}
.pg4 b{font-size:17px;font-weight:600;line-height:1.1}.pg4 span{font-size:11px;color:var(--mut)}
.pal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.pal button{width:100%;display:flex;gap:8px;align-items:flex-start;background:none;border:0;border-radius:5px;padding:5px 4px;color:#dbe7f7;font-size:12.5px;text-align:left;cursor:pointer;line-height:1.3}
.pal button:hover{background:#12305a}
.pal i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:4px;background:var(--cyan)}
.pal .bad i{background:var(--red)}.pal .warn i{background:var(--amber)}
.eyebrow{display:inline-block;margin-bottom:6px;padding:3px 10px;border:1px solid #3b8cf7;border-radius:4px;background:rgba(47,134,246,.15);color:#9fd0ff;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:2px;text-transform:uppercase}
.pg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}.pg2 .btn{justify-content:center}
#sideBase{margin-top:10px;padding-top:0;border-top:0;margin-bottom:10px}
.sidefoot{margin-top:16px;padding:14px 8px 4px;border-top:1px solid var(--line)}
.sidefoot b{font-family:var(--cond);font-size:20px;display:block}
.sidefoot p{margin:2px 0 0;color:var(--cyan);font-size:17px;line-height:1.2}
.skyline{height:120px;margin:16px -10px 0;background:
 linear-gradient(180deg,transparent,rgba(6,19,40,.2) 60%,rgba(6,19,40,.9)),
 repeating-linear-gradient(90deg,#10305c 0 9px,#0c2749 9px 12px,#153a6c 12px 22px,#0b2242 22px 26px);
 -webkit-mask:linear-gradient(0deg,#000 60%,transparent);mask:linear-gradient(0deg,#000 60%,transparent);
 clip-path:polygon(0 60%,6% 60%,6% 35%,11% 35%,11% 55%,16% 55%,16% 20%,22% 20%,22% 48%,28% 48%,28% 30%,33% 30%,33% 62%,40% 62%,40% 12%,45% 12%,45% 40%,52% 40%,52% 28%,58% 28%,58% 56%,64% 56%,64% 18%,70% 18%,70% 44%,77% 44%,77% 34%,83% 34%,83% 58%,89% 58%,89% 25%,95% 25%,95% 50%,100% 50%,100% 100%,0 100%)}
main{padding:16px 16px 8px;min-width:0;display:flex;flex-direction:column;gap:12px}
footer.bot{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 20px;border-top:1px solid var(--line);color:#c9d6ea;font-size:13px;background:#051024}
footer.bot b{font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.panel h3{margin:0 0 10px;font-size:15.5px;font-weight:600;display:flex;justify-content:space-between;align-items:flex-start;gap:4px 10px;flex-wrap:wrap;line-height:1.3}
.panel h3 small{color:var(--mut);font-weight:400;font-size:11.5px;margin-left:auto;text-align:right}
/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.fgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.fgroup label{font-size:13px;font-weight:500}
.fgroup select,.fgroup input{background:#0a1b37;border:1px solid var(--line2);border-radius:5px;padding:8px 10px;min-width:130px}
.import{display:flex;flex-direction:column;gap:6px;padding-right:16px;border-right:1px solid var(--line)}
.import .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--blue2);border:1px solid #3b8cf7;border-radius:5px;padding:8px 14px;color:#fff;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--blue)}
.btn.ghost{background:transparent;border-color:var(--line2);color:#c9d6ea;font-weight:500}
.btn.sm{padding:5px 10px;font-size:12.5px}
.muted{color:var(--mut)}
.small{font-size:12px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{border-radius:8px;padding:12px 14px;border:1px solid var(--line2);background:linear-gradient(160deg,#0f2a52,#0b2043);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.kpi:hover{border-color:var(--blue)}
.kpi .lab{font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding-right:30px;line-height:1.25;min-height:2.5em}
.kpi .ico{position:absolute;right:12px;top:10px;width:26px;height:26px}
.kpi .val{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:32px;font-weight:600;line-height:1.05}
.kpi .dl{font-size:14px;font-weight:600}
.kpi .sub{font-size:12.5px;color:#c9d6ea;line-height:1.35}
.kpi.g{background:linear-gradient(160deg,#0c3a2c,#0a2a26);border-color:#1f7a4a}
.kpi.pg{background:linear-gradient(160deg,#0d3a33,#0b2a2c);border-color:#1a6b55}
.kpi.ct{background:linear-gradient(160deg,#2a1b26,#1b1626);border-color:#4a2a36}
.kpi.rr{background:linear-gradient(160deg,#0c2f4a,#0a2340);border-color:#1f5f8a}
.kpi.sp{background:linear-gradient(160deg,#321a26,#231424);border-color:#5a2632}
.up{color:var(--green)}.dn{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:3px 8px;font-size:11.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;width:max-content}
.pill.ok{background:var(--green);color:#052e16}
.pill.bad{background:#7f1d1d;color:#fecaca;border:1px solid #b91c1c}
.pill.warn{background:#78350f;color:#fde68a}
/* grids */
.row3{display:grid;grid-template-columns:1.45fr 1.1fr 1.05fr .65fr;gap:12px}
.row2{display:grid;grid-template-columns:1.35fr 1fr .9fr;gap:12px}
@media (max-width:1700px){.row2{grid-template-columns:1fr 1fr}.row2>:first-child{grid-column:1/-1}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chartbox{position:relative;min-width:0}
.svgc{width:100%;min-width:0;position:relative}
.svgc.donut{max-width:200px;margin:0 auto}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 20px}
.empty h3{justify-content:center}.empty p{color:var(--mut);max-width:520px;margin:0}
.lockbtn{margin-left:10px}
.app.locked{filter:blur(14px);pointer-events:none;user-select:none}
.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(3,10,24,.55);overflow:auto}
.lock-bg{position:absolute;inset:0;overflow:hidden;z-index:-1}
.lock-bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:rkf 24s ease-in-out infinite alternate}
.lock-bg i:nth-child(1){width:50vw;height:50vw;left:-10vw;top:-10vw;background:radial-gradient(circle,#2f86f6,transparent 70%)}
.lock-bg i:nth-child(2){width:40vw;height:40vw;right:-8vw;bottom:-10vw;background:radial-gradient(circle,#0ea5a4,transparent 70%)}
.lock-bg i:nth-child(3){width:30vw;height:30vw;left:40vw;top:30vh;background:radial-gradient(circle,#6d4bd8,transparent 70%);opacity:.35}
.lock-card{width:min(420px,100%);display:flex;flex-direction:column;gap:8px;padding:28px 26px;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
 border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lock-logo{height:64px;width:auto;align-self:center;margin-bottom:4px}
.lock-eyb{align-self:center;font-family:var(--cond);letter-spacing:2px;text-transform:uppercase;color:#9fd0ff;font-size:12px;font-weight:600}
.lock-card h2{margin:0;text-align:center;font-family:var(--cond);font-size:28px}
.lock-card p{margin:0 0 6px;color:#c9d6ea;font-size:13px;text-align:center;line-height:1.45}
.lock-card label{font-size:12.5px;font-weight:500;margin-top:4px}
.lock-card input{background:rgba(5,13,29,.6);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:11px 12px;font-size:15px}
.lock-card input:focus{outline:none;border-color:#7cc7ff}
.lock-card .btn{justify-content:center;padding:11px;margin-top:8px}
.lk-meter{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.lk-meter i{display:block;height:100%;width:0;transition:width .2s}
.lock-card small{font-size:11.5px;color:var(--mut)}
.lk-err{color:#fca5a5!important;min-height:1.2em;margin:0!important}
.lk-forget{text-align:center;font-size:12.5px;color:#c9d6ea}.lk-forget>button{background:none;border:0;color:#9fd0ff;text-decoration:underline;cursor:pointer}
.lk-forget div{margin-top:6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.lk-foot{text-align:center;margin-top:6px;line-height:1.4}
.compbox{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cstrip{display:flex;gap:2px;height:18px;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.cstrip button{border:0;padding:0;min-width:3px;cursor:pointer}.cstrip button:hover{filter:brightness(1.15)}
.clegs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 14px}
.clegs button{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;background:none;border:0;color:#dbe7f7;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:12.5px;text-align:left}
.clegs button:hover{background:#12305a}.clegs i{width:10px;height:10px;border-radius:3px}.clegs b{font-weight:600}.clegs em{font-style:normal;color:var(--mut);font-size:11.5px;min-width:40px;text-align:right}
.cbleg{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:8px;font-size:12px;color:#c9d6ea}
.cbleg>div{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.cbleg b{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:600}
.cbleg span{display:inline-flex;align-items:center;gap:6px}
.cbleg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.cbleg i.ln{height:3px;width:16px;border-radius:2px}.cbleg i.dash{background:none!important;border-top:2px dashed;height:0}
.svleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#c9d6ea;margin:6px 0}
.svleg span{display:inline-flex;align-items:center;gap:6px}
.svleg i{width:12px;height:10px;border-radius:2px;display:inline-block}
.svtip{position:fixed;z-index:20;pointer-events:none;background:#0a1b37;border:1px solid var(--line2);border-radius:6px;padding:7px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.45);max-width:280px}
.svtip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
/* cartões de OS (celular) */
.oscards{display:none;flex-direction:column;gap:8px}
.osc{background:#0b1f3f;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px}
.osc .h{font-weight:600;font-size:14.5px}
.osc .r{grid-column:1/-1;color:#dbe7f7}
.osc dl{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:4px 0 0}
.osc dt{color:var(--mut)}.osc dd{margin:0;overflow-wrap:anywhere}
.osc .nt{grid-column:1/-1;color:var(--mut);font-size:12px;border-top:1px dashed var(--line);padding-top:5px;margin-top:2px;overflow-wrap:anywhere}
.swipe{display:none;font-size:12px;color:var(--mut);margin:0 0 6px}
.legend{display:flex;flex-direction:column;gap:9px;font-size:13px}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.donutwrap{display:grid;grid-template-columns:minmax(140px,175px) 1fr;gap:10px;align-items:center}
.row3>.panel{display:flex;flex-direction:column;}
#pCarga>.note{margin-top:auto!important}
.row3>.panel{container-type:inline-size;min-width:0}
@media (max-width:1500px){.row3{grid-template-columns:1fr 1fr}}
@container (max-width:380px){.donutwrap{grid-template-columns:1fr!important}.svcb em{display:none}.svcb button{grid-template-columns:104px 1fr 40px!important}}
@container (max-width:430px){.evs{grid-template-columns:1fr 1fr}}
.dleg{display:flex;flex-direction:column;gap:2px;min-width:0}
.dleg button,.svcb button,.impl button,.evs button{background:none;border:0;color:inherit;cursor:pointer;text-align:left;border-radius:5px}
.dleg button{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:4px 6px;font-size:13px}
.dleg button:hover,.svcb button:hover,.impl button:hover,.evs button:hover{background:#12305a}
.dleg i{width:11px;height:11px;border-radius:50%}
.dleg b{font-weight:600}.dleg em{font-style:normal;color:var(--mut);font-size:12px;min-width:44px;text-align:right}
.svct{font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#c9d6ea;margin:4px 0 4px;display:flex;justify-content:space-between}
.svct .muted{text-transform:none;letter-spacing:0;font-weight:400}
.svcb{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.svcb button{display:grid;grid-template-columns:112px 1fr 44px 70px;gap:8px;align-items:center;padding:4px 6px;font-size:12.5px}
.svcb .bar{position:relative;overflow:visible}.svcb .bar i{border-radius:4px}
.svcb .bar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:#ef4444}
.svcb b{text-align:right}.svcb em{font-style:normal;color:var(--mut);font-size:11.5px;text-align:right}
.impl{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.impl button{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;font-size:12.5px}
.impl b{color:#fca5a5}
.evs{margin-top:auto;padding-top:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.evs>*{background:#0b1f3f;border:1px solid var(--line)!important;border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.evs span{font-size:11px;color:var(--mut)}.evs b{font-size:17px;font-weight:600;line-height:1.2}.evs em{font-style:normal;font-size:11px;color:var(--mut)}
.carga{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbox{border-radius:6px;padding:8px 12px;border:1px solid var(--line2);background:#123464}
.cbox.s{background:#0f3d33;border-color:#1a6b55}
.cbox small{display:block;font-size:13px}
.cbox b{font-weight:500;font-size:17px;color:#cfe0f7}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.gauges svg{width:100%;max-width:130px;height:auto}
.gauges .gl{font-size:13px}
.fim{display:flex;flex-direction:column;gap:0}
.fim .blk{display:flex;gap:14px;align-items:center;padding:8px 0;cursor:pointer}
.fim .blk+.blk{border-top:1px solid var(--line)}
.fim .blk b{font-size:30px;font-weight:600;display:block;line-height:1.05}
/* tables */
.tw{overflow:visible;max-width:100%}
table:not(.stack) thead th{position:sticky;top:0;z-index:3;box-shadow:0 1px 0 var(--line2)}
table.bt:not(.stack) thead th{background:#18386a}
.osn{font-weight:600}
.cp{display:inline-flex;align-items:center;justify-content:center;width:24px;height:22px;margin-left:5px;vertical-align:middle;background:#16345f;border:1px solid var(--line2);border-radius:4px;color:#9fc3f0;cursor:pointer;padding:0}
.cp:hover{background:#1f4a86;color:#fff}
.btn.more{margin-top:8px}
.cptab{display:inline-flex;align-items:center;gap:5px;margin-left:8px;background:#16345f;border:1px solid var(--line2);border-radius:4px;color:#9fc3f0;cursor:pointer;padding:2px 8px;font-size:11.5px;vertical-align:middle}
.cptab:hover{background:#1f4a86;color:#fff}
.panel h3 small{display:inline-flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:4px}
.oscp{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.oscp .cp{margin-left:0}
.nt .cp{margin-left:6px}
table:not(.stack) .cpw{white-space:nowrap}
.addr{font-size:11.5px;letter-spacing:-.1px}
.addr .cp{width:18px;height:17px}
.cp{width:20px;height:19px;margin-left:4px}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px;padding:8px 10px;background:#0b1f3f;border:1px solid var(--line2);border-radius:6px}
.selbar .selall{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
td.ck,th.ck{width:30px;text-align:center}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue);vertical-align:middle}
/* tabela que não cabe vira cartões (sem rolagem lateral) */
table.stack,table.stack tbody,table.stack tfoot{display:block}
table.stack thead{display:none}
table.stack tr{display:block;background:#0b1f3f;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;margin:0 0 8px}
table.stack tr[hidden]{display:none}
table.stack td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0;padding:3px 0;white-space:normal;text-align:right;position:static!important;background:none!important;max-width:none!important;min-width:0!important}
table.stack td::before{content:attr(data-label);color:var(--mut);text-align:left;font-weight:500;flex:0 0 auto;max-width:48%}
table.stack td:first-child{font-weight:600;font-size:14.5px;justify-content:flex-start;text-align:left;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:3px}
table.stack td:first-child::before{content:none}
table.stack td.z{display:none}
table.stack td.ck{justify-content:flex-start}
table.stack tr.sub{background:#143057}
table.stack tfoot tr{background:#11294b}
table.bt th:first-child,table.bt td:first-child{display:none}
table.bt.stack td:nth-child(2){font-weight:600;font-size:14.5px;justify-content:flex-start;text-align:left;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:3px}
table.bt.stack td:nth-child(2)::before{content:none}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#143057;color:#c9d6ea;font-weight:500;text-align:left;padding:6px 6px;font-size:11.5px;white-space:normal;vertical-align:bottom}
td{padding:5px 6px;border-bottom:1px solid #16325b;white-space:normal}
td.n{white-space:nowrap}
td.n,th.n{text-align:right}
.row2 th,.row2 td{padding:6px 6px}
tbody tr:hover{background:#12305a;cursor:pointer}
tfoot td{font-weight:700;background:#11294b}
table.det td{white-space:normal;vertical-align:top;line-height:1.3}
table.det td:nth-child(4),table.det td:nth-child(5),table.det td:nth-child(7) .muted{white-space:nowrap}
table.det td:first-child{white-space:nowrap}
table.det td.nt{min-width:180px;max-width:320px;font-size:12.5px;color:#c9d6ea}
table.det .muted{font-size:12px}
table.bt th{white-space:normal;min-width:44px;vertical-align:bottom;font-size:12px}
table.bt th:nth-child(2){min-width:120px}
table.bt tr.sub td{background:#122d55;border-top:2px solid var(--line2)}
table.bt td.c{color:#fca5a5;text-decoration:underline dotted;text-underline-offset:3px}
table.bt td.c:hover{background:#1d3f70}
table.bt td.z{color:#3b5680}
table.bt td.fd{color:var(--mut)}

.st{display:inline-block;border-radius:4px;padding:1px 6px;font-size:10.5px;font-weight:600;white-space:nowrap}
table.stack .st{white-space:normal}
.st.p{background:#15803d;color:#fff}.st.f{background:#44403c;color:#e7e5e4}.st.i{background:#7c2d12;color:#fed7aa}.st.o{background:#1e3a8a;color:#bfdbfe}.st.n{background:#581c87;color:#e9d5ff}
.bar{height:8px;border-radius:4px;background:#17345f;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--blue)}
.note{font-size:12px;color:var(--mut);line-height:1.45}
.note b{color:#c9d6ea}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f2a52;border:1px solid var(--blue);padding:10px 16px;border-radius:6px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.view{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#12305a;border:1px solid var(--line2);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip.x::after{content:" ×";color:var(--mut)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px}
input.cad{background:#0a1b37;border:1px solid var(--line2);border-radius:4px;padding:4px 6px;width:130px}
.rules li{margin:3px 0}

/* ===== Ranking ===== */
.rk{position:relative;isolation:isolate;border-radius:14px;overflow:hidden;padding:18px;min-height:600px;background:#050d1d}
.rk:fullscreen{overflow:auto;border-radius:0;padding:28px}
.rk.rk-max{position:fixed;inset:0;z-index:50;border-radius:0;overflow:auto;padding:28px}
.rk-bg{position:absolute;inset:0;z-index:-1;overflow:hidden}
.rk-bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:rkf 22s ease-in-out infinite alternate}
.rk-bg i:nth-child(1){width:46%;height:60%;left:-8%;top:-12%;background:radial-gradient(circle,#2f86f6,transparent 70%)}
.rk-bg i:nth-child(2){width:40%;height:55%;right:-6%;top:10%;background:radial-gradient(circle,#0ea5a4,transparent 70%);animation-duration:26s}
.rk-bg i:nth-child(3){width:50%;height:50%;left:25%;bottom:-20%;background:radial-gradient(circle,#6d4bd8,transparent 70%);animation-duration:30s;opacity:.4}
.rk-bg i:nth-child(4){width:30%;height:35%;left:55%;top:40%;background:radial-gradient(circle,#38bdf8,transparent 70%);animation-duration:18s;opacity:.3}
@keyframes rkf{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,6%) scale(1.12)}100%{transform:translate(-5%,-3%) scale(.95)}}
.rk-in{position:relative;display:flex;flex-direction:column;gap:14px;max-width:1500px;margin:0 auto}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.14);border-radius:14px;
 backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.rk-hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;padding:18px 22px}
.rk-eyb{font-family:var(--cond);letter-spacing:2.5px;text-transform:uppercase;color:#9fd0ff;font-size:13px;font-weight:600}
.rk-hero h2{margin:2px 0 4px;font-family:var(--cond);font-size:clamp(26px,3.2vw,40px);letter-spacing:.5px;line-height:1.05}
.rk-hero p{margin:0;color:#c9d6ea;font-size:14px}
.rk-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rk-ctl label{font-size:12px;color:#c9d6ea}
.rk-ctl select{background:rgba(5,13,29,.55);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 10px;color:#fff}
.rk-btn{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.rk-btn:hover{background:rgba(255,255,255,.2)}
.rk-pod{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:14px;align-items:stretch}
.rk-prata,.rk-bronze{margin-top:26px}
.rk-p{padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;position:relative;overflow:hidden;transition:transform .25s}
.rk-p:hover{transform:translateY(-3px)}
.rk-p::after{content:"";position:absolute;inset:-40% -20% auto auto;width:70%;height:90%;border-radius:50%;filter:blur(40px);opacity:.35;background:var(--glow);z-index:-1}
.rk-ouro{--glow:#f5b73b;border-color:rgba(245,183,59,.45)}
.rk-prata{--glow:#cbd5e1}.rk-bronze{--glow:#d08a4b}
.rk-med{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:20px;color:#0b1f3f;background:var(--glow);box-shadow:0 0 24px var(--glow)}
.rk-p h3{margin:0;font-size:18px;line-height:1.2}
.rk-big{font-family:var(--cond);font-size:44px;font-weight:700;line-height:1;display:flex;flex-direction:column}
.rk-big small{font-family:var(--font);font-size:12px;font-weight:400;color:#c9d6ea;margin-top:4px}
.rk-kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rk-kv span{display:flex;flex-direction:column;font-size:11px;color:#c9d6ea}.rk-kv b{font-size:16px;color:#fff}
.rk-ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.rk-tr{font-size:12px;font-weight:600;white-space:nowrap}
.rk-hl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rk-hl>div{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.rk-hl span{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#9fd0ff}
.rk-hl b{font-size:15px}.rk-hl em{font-style:normal;font-size:13px;color:#c9d6ea}
.rk-list{padding:8px 12px}
.rk-lh,.rk-row{display:grid;grid-template-columns:40px minmax(180px,1.4fr) minmax(140px,1.3fr) 140px 90px 170px 90px;gap:12px;align-items:center}
.rk-lh{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#9fbbe0;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.1)}
.rk-row{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;border-radius:8px;animation:rkin .5s both;animation-delay:var(--d)}
.rk-row:hover{background:rgba(255,255,255,.07)}
.rk-row.top .rk-pos{background:linear-gradient(135deg,#f5b73b,#d08a4b);color:#0b1f3f}
@keyframes rkin{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.rk-pos{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:rgba(255,255,255,.1)}
.rk-nm{display:flex;flex-direction:column;min-width:0}.rk-nm b{font-size:14px}
.rk-nm small,.rk-n small{font-size:11px;color:#9fbbe0}
.rk-tag{font-style:normal;font-size:10px;color:#fde68a;background:rgba(245,183,59,.18);border:1px solid rgba(245,183,59,.4);border-radius:4px;padding:0 5px;width:max-content;margin:2px 0}
.rk-bar{position:relative;height:10px;border-radius:6px;background:rgba(255,255,255,.1);display:block}
.rk-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.rk-bar s{position:absolute;top:-4px;bottom:-4px;width:2px;background:#ef4444}
.rk-bar b{position:absolute;right:0;top:-18px;font-size:12px}
.rk-n{display:flex;flex-direction:column;font-weight:600;font-size:15px}
.rk-n small{white-space:nowrap}
@media (max-width:820px){.rk-prata,.rk-bronze{margin-top:0}.rk-n{flex-direction:row;align-items:baseline;gap:8px}}
.rk-q{display:flex;align-items:center;gap:6px;font-weight:600}
.rk-q i{width:26px;height:26px;border-radius:50%;background:conic-gradient(#4ade80 calc(var(--q)*1%),rgba(255,255,255,.12) 0);-webkit-mask:radial-gradient(circle,transparent 7px,#000 8px);mask:radial-gradient(circle,transparent 7px,#000 8px)}
.rk-spk{display:flex;align-items:center;gap:6px}
.rk-sp{display:block;max-width:100%}
.rk-score{font-family:var(--cond);font-size:26px;font-weight:700;text-align:right}
.rk-note{margin:0;padding:10px 14px;font-size:12px;color:#c9d6ea;line-height:1.5}
@media (max-width:1280px){.rk-lh,.rk-row{grid-template-columns:36px minmax(150px,1.3fr) minmax(120px,1.2fr) 100px 70px 80px}.rk-spk{display:none}.rk-lh span:nth-child(6){display:none}}
@media (max-width:820px){.rk{padding:12px}.rk-pod{grid-template-columns:1fr}.rk-pod .rk-ouro{order:-1}.rk-hl{grid-template-columns:1fr 1fr}
 .rk-lh{display:none}.rk-row{grid-template-columns:34px 1fr auto;grid-template-areas:"p n s" "b b b" "c c q";row-gap:8px}
 .rk-pos{grid-area:p}.rk-nm{grid-area:n}.rk-score{grid-area:s}.rk-bar{grid-area:b;margin-top:14px}.rk-n{grid-area:c}.rk-q{grid-area:q;justify-content:flex-end}}
@media (prefers-reduced-motion:reduce){.rk-bg i,.rk-row{animation:none}}
/* modo privado: números embaçados, só o colaborador escolhido aparece */
.rk .pv,.rk .pvn{transition:filter .35s,opacity .35s}
.rk.priv .pv,.rk.privn .pvn{filter:blur(9px) saturate(.6);opacity:.75;user-select:none;pointer-events:none}
.rk.priv .show .pv,.rk.privn .show .pvn{filter:none;opacity:1;pointer-events:auto}
.rk.priv .rk-row,.rk.priv .rk-p{cursor:pointer}
.rk.priv .rk-row.show,.rk.priv .rk-p.show{background:rgba(124,199,255,.12);box-shadow:inset 0 0 0 1px rgba(124,199,255,.55)}
.rk.priv .rk-hl.pv{filter:blur(9px) saturate(.6)}
.rk-btn.on{background:rgba(124,199,255,.25);border-color:#7cc7ff}
.rk-pbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;font-size:13px}
.rk-pbar select{background:rgba(5,13,29,.55);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:7px 10px;color:#fff;min-width:0;max-width:100%}
.rk-chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.rk-hint{color:#9fbbe0;font-size:12px;margin-left:auto}
.rk-lock{font-size:16px}
@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.row3{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr 1fr}.row2>:first-child{grid-column:1/-1}.motto{display:none}header.top{grid-template-columns:minmax(300px,auto) 1fr auto}}
@media (max-width:820px){
 .oscards{display:flex}
 .ostable{display:none}
 .tw{-webkit-overflow-scrolling:touch}
 .donutwrap{grid-template-columns:1fr}
 .legend{flex-direction:row;flex-wrap:wrap;justify-content:center}
 .filters .btn#btnUpd{margin-left:0!important;width:100%;justify-content:center}
 .carga,.gauges{grid-template-columns:1fr 1fr}
 .app{grid-template-columns:1fr}
 header.top{grid-template-columns:1fr;gap:10px;padding:12px 16px}
 .clock{font-size:13px}
 nav.side{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:8px 16px;border-right:0;border-bottom:1px solid var(--line)}
 nav.side button{flex-direction:column;gap:4px;padding:8px 2px;font-size:11.5px;text-align:center;justify-content:flex-start;line-height:1.15}
 nav.side button.on{box-shadow:inset 0 -3px 0 var(--blue)}
 .sidefoot,.skyline,.pulse{display:none}
 .sidein{display:contents}
 main{padding:12px 16px}
 .kpis{grid-template-columns:1fr 1fr}
 .row3,.row2,.g2,.g3{grid-template-columns:1fr}
 .import{border-right:0;padding-right:0}
 .fgroup{flex:1 1 140px}.fgroup select,.fgroup input{min-width:0;width:100%}
 .title h1{font-size:21px}.title h2{font-size:16px}
 .brand small{display:none}
 .slogo{height:48px}
 .brand .lk-tag{font-size:9.5px;letter-spacing:1.2px}
 .clock svg{display:none}
 .clock div,.clock div b{font-size:13px}
 .eyebrow{font-size:12px;margin-bottom:4px}

<script>
/* Gráficos SVG próprios: sem biblioteca externa, funcionam offline e no celular */
const SVGC=(function(){
  const NS='http://www.w3.org/2000/svg';
  const T={txt:'#b8c8e0',grid:'#17365f',axis:'#27497a',font:'Barlow, system-ui, sans-serif'};
  const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let tip;
  function ensureTip(){if(tip)return tip;tip=document.createElement('div');tip.className='svtip';tip.hidden=true;document.body.appendChild(tip);
    document.addEventListener('pointermove',ev=>{const t=ev.target.closest&&ev.target.closest('[data-tip]');if(!t){tip.hidden=true;return}
      tip.innerHTML=t.getAttribute('data-tip');tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;
      let x=ev.clientX+12,y=ev.clientY-h-10;if(x+w>innerWidth-8)x=ev.clientX-w-12;if(y<8)y=ev.clientY+14;tip.style.left=Math.max(8,x)+'px';tip.style.top=y+'px'},{passive:true});
    document.addEventListener('scroll',()=>tip.hidden=true,{passive:true,capture:true});return tip}
  function nice(max){if(max<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(max)));const n=max/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
  function ticks(min,max,n){const step=nice((max-min)/n);const out=[];for(let v=Math.ceil(min/step)*step;v<=max+1e-9;v+=step)out.push(+v.toFixed(6));return out}
  function measure(s,px){return String(s).length*px*0.6}
  function mount(el,w,h,inner){el.innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="${T.font}" role="img" style="display:block;max-width:100%">${inner}</svg>`;ensureTip();
    return el.querySelector('svg')}
  function legendHTML(series){return `<div class="svleg">${series.filter(s=>s.name).map(s=>`<span><i style="background:${s.color}${s.dash?';height:2px;border-radius:0':''}"></i>${e(s.name)}</span>`).join('')}</div>`}
  function bind(svg,onClick){if(!onClick)return;svg.querySelectorAll('[data-i]').forEach(n=>{n.style.cursor='pointer';n.addEventListener('click',()=>onClick(+n.getAttribute('data-i')))})}
  function trunc(s,max){s=String(s);return s.length>max?s.slice(0,max-1)+'…':s}

  /* Barras verticais (empilhadas ou não), com linha de referência opcional */
  function bars(el,o){
    const W=Math.max(260,el.clientWidth),H=o.height||el.clientHeight||260;const fs=12;
    const n=o.labels.length;const S=o.series;
    const tot=o.labels.map((_,i)=>S.reduce((s,x)=>s+(+x.data[i]||0),0));
    const st0=nice(Math.max(1,...tot)*1.05/4);const yMax=o.yMax!=null?o.yMax:Math.ceil(Math.max(1,...tot)*1.05/st0)*st0;
    const tk=ticks(0,yMax,4);const fmt=o.fmt||(v=>v);
    const ml=Math.max(...tk.map(t=>measure(fmt(t),fs)))+14,mr=10,mt=o.valueLabels?18:8;
    const rotate=n>0&&(W-ml-mr)/n<Math.max(...o.labels.map(l=>measure(l,11)))+6;
    const lblMax=rotate?Math.min(18,Math.max(...o.labels.map(l=>String(l).length))):99;
    const mb=rotate?Math.min(110,Math.max(...o.labels.map(l=>measure(trunc(l,lblMax),11)))*0.72+18):24;
    const pw=W-ml-mr,ph=H-mt-mb,bw=pw/Math.max(1,n);const y=v=>mt+ph-(v/yMax)*ph;
    let g='';
    tk.forEach(t=>{g+=`<line x1="${ml}" x2="${W-mr}" y1="${y(t)}" y2="${y(t)}" stroke="${T.grid}"/><text x="${ml-6}" y="${y(t)+4}" fill="${T.txt}" font-size="${fs}" text-anchor="end">${e(fmt(t))}</text>`});
    o.labels.forEach((l,i)=>{let acc=0;const x=ml+i*bw+bw*0.16,w=bw*0.68;const tipRows=[];
      S.forEach(s=>{const v=+s.data[i]||0;if(!v)return;const col=s.colors?s.colors[i]:s.color;const y0=y(acc),y1=y(acc+v);acc+=v;tipRows.push(`<i style="background:${col}"></i>${e(s.name||l)}: <b>${e(fmt(v))}</b>`);
        g+=`<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,y0-y1).toFixed(1)}" fill="${col}" rx="${S.length>1?0:3}"/>`});
      const tipTxt=`<b>${e(l)}</b>`+(S.length>1?`<br>Total: <b>${e(fmt(tot[i]))}</b>`:'')+'<br>'+tipRows.join('<br>');
      g+=`<rect data-i="${i}" data-tip="${e(tipTxt)}" x="${ml+i*bw}" y="${mt}" width="${bw}" height="${ph}" fill="transparent"/>`;
      if(o.valueLabels&&tot[i])g+=`<text x="${x+w/2}" y="${y(tot[i])-4}" fill="#e8f0fb" font-size="11" text-anchor="middle" pointer-events="none">${e(fmt(tot[i]))}</text>`;
      const lx=ml+i*bw+bw/2,ly=mt+ph+14;
      g+=rotate?`<text transform="translate(${lx+3},${ly-4}) rotate(-40)" fill="${T.txt}" font-size="11" text-anchor="end" pointer-events="none">${e(trunc(l,lblMax))}</text>`:`<text x="${lx}" y="${ly}" fill="${T.txt}" font-size="11" text-anchor="middle" pointer-events="none">${e(l)}</text>`});
    if(o.ref!=null){const ry=y(o.ref);g+=`<line x1="${ml}" x2="${W-mr}" y1="${ry}" y2="${ry}" stroke="${o.refColor||'#ef4444'}" stroke-width="2" stroke-dasharray="6 4" pointer-events="none"/>`}
    g+=`<line x1="${ml}" x2="${W-mr}" y1="${mt+ph}" y2="${mt+ph}" stroke="${T.axis}"/>`;
    const wrap=document.createElement('div');el.innerHTML='';
    const svg=mount(el,W,H,g);if(o.legend!==false&&S.length>1||o.refName)el.insertAdjacentHTML('beforeend',legendHTML(S.concat(o.refName?[{name:o.refName,color:o.refColor||'#ef4444',dash:1}]:[])));
    bind(svg,o.onClick);
  }

  /* Barras horizontais: rótulos à esquerda e valor no fim da barra */
  function hbars(el,o){
    const W=Math.max(260,el.clientWidth);const n=o.labels.length;const rowH=o.rowH||26;const H=Math.max(60,n*rowH+12);
    const fmt=o.fmt||(v=>v);const maxChars=W<420?16:30;
    const labs=o.labels.map(l=>trunc(l,maxChars));
    const est=s=>[...String(s)].reduce((w,ch)=>w+(/[A-ZÀ-Ý0-9%]/.test(ch)?8.2:/[ .,:;·il1|]/.test(ch)?3.8:6.6),0);
    const mlMax=Math.floor(W*0.46);const ml=Math.min(mlMax,Math.max(...labs.map(est))+14);
    for(let k=0;k<labs.length;k++){let s=String(labs[k]);if(est(s)>ml-12){while(s.length>4&&est(s+'…')>ml-12)s=s.slice(0,-1);labs[k]=s+'…'}}const mr=o.range?12:42;
    const vals=o.data;const xMin=o.xMin||0;

})();

const XLSXLite=(function(){

    const sheets=[];

        for(const c of byTag(row,'c')){
          const t=c.getAttribute('t');const vEl=byTag(c,'v')[0];let v;
          if(t==='s')v=ss[+(vEl&&vEl.textContent)]??'';
          else if(t==='inlineStr'){v='';for(const x of byTag(c,'t'))v+=x.textContent}
          else if(t==='b')v=vEl&&vEl.textContent==='1'?'VERDADEIRO':'FALSO';
          else if(t==='str'||t==='e')v=vEl?vEl.textContent:'';
          else v=vEl?(isNaN(+vEl.textContent)?vEl.textContent:+vEl.textContent):'';
          const ref=c.getAttribute('r');arr[ref?colIdx(ref):arr.length]=v;

  bindOsRows($('#pPrim'));

/* ---------- Ranking (apresentação) ---------- */
let RK_BY='indice',RK_PRIV=false,RK_SHOW='',RK_NOMES=false;
function rankData(rows){
  const days=[...new Set(rows.map(r=>r.day))].sort();const half=days.slice(-7),prev=days.slice(-14,-7);
  const list=[...groupBy(rows,r=>r.eq)].map(([k,rs])=>{const a=agg(rs);
    const val=rs.filter(isValida);const byD=groupBy(val,r=>r.day);
    const starts=[...byD.values()].map(x=>{const d=new Date(Math.min(...x.map(r=>r.ini||r.fim)));return d.getHours()*60+d.getMinutes()});
    const pr7=agg(rs.filter(r=>half.includes(r.day))).pr,prP=agg(rs.filter(r=>prev.includes(r.day))).pr;
    const sus=rs.filter(r=>r.sus).length;
    const spark=days.map(d=>{const x=rs.filter(r=>r.day===d);return x.length?agg(x).pr:null});
    return {k,a,dias:byD.size,ini:starts.length?starts.reduce((s,v)=>s+v,0)/starts.length:null,trend:prP?pr7-prP:null,sus,spark,
      fimP:a.rec?a.FIMDIA/a.rec*100:0,susP:a.trab?sus/a.trab*100:0}}).filter(x=>x.a.rec>=10);
  const maxProd=Math.max(1,...list.map(x=>x.a.prod));
  list.forEach(x=>{x.sP=Math.min(100,x.a.pr/META*100);x.sV=x.a.prod/maxProd*100;x.sQ=Math.max(0,100-x.fimP-x.susP);x.idx=0.5*x.sP+0.3*x.sV+0.2*x.sQ;x.peq=x.a.den<100});
  return list;
}

     <div class="rk-ctl"><label for="rkBy">Classificar por</label><select id="rkBy">${Object.entries(crit).map(([k,c])=>`<option value="${k}" ${k===RK_BY?'selected':''}>${c[0]}</option>`).join('')}</select>
      <button type="button" class="rk-btn ${RK_PRIV?'on':''}" id="rkPriv" aria-pressed="${RK_PRIV}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">${RK_PRIV?'<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a18 18 0 0 1-3.2 4M6.6 6.6C3.9 8.3 2 12 2 12s4 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/>':'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'}</svg>${RK_PRIV?'Modo privado ligado':'Modo privado'}</button>

   </tbody><tfoot><tr><td>Total</td><td class="n">${fmt(A.rec)}</td><td class="n">${fmt(A.trab)}</td><td class="n">${fmt(A.prod)}</td><td class="n">${pct(A.prod,A.den)}%</td><td class="n">${fmt(A.FIMDIA)}</td><td class="n">${fmt(A.IMPED)}</td></tr></tfoot></table></div></div>

   <li><b>Cada linha da planilha é uma execução.</b> Uma OS reprogramada aparece mais de uma vez; cada visita conta como OS recebida no dia em que foi baixada.</li>
   <li><b>Produtividade:</b> <label><input type="radio" name="base" value="trab" ${BASE==='trab'?'checked':''}> produtivos ÷ OS trabalhadas (recebidas menos “Fim do Dia”)</label> &nbsp; <label><input type="radio" name="base" value="rec" ${BASE==='rec'?'checked':''}> produtivos ÷ OS recebidas</label>. Meta mensal: ${META}%.</li>
   <li><b>Carga diária:</b> ${CARGA.CORTE} OS/dia por equipe de corte e ${CARGA.SUPRESSAO} OS/dia por equipe de supressão (referência, não meta). O tipo da equipe no dia é o serviço que ela mais executou.</li>
  </ul></div>`;
  $('#rrProd').onchange=e=>{setRRProd(e.target.checked);render()};
  v.querySelectorAll('input[name=base]').forEach(i=>i.onchange=()=>{BASE=i.value;LS.set('sa_dash_base',BASE);render()});
  v.querySelectorAll('tr[data-t]').forEach(tr=>tr.onclick=()=>drill({tipo:tr.dataset.t,label:TIPO_LBL[tr.dataset.t]}));
  v.querySelectorAll('tr[data-r]').forEach(tr=>tr.onclick=()=>drill({res:tr.dataset.r,label:tr.dataset.r}));
  const dA=byDay.map(([d,rs])=>agg(rs));
  chart('cDia','daily',{labels:byDay.map(d=>dayBR(d[0])),tip:byDay.map(d=>dayBRf(d[0])),total:dA.map(x=>x.den),prod:dA.map(x=>x.prod),pct:dA.map(x=>x.den>=20?+x.pr.toFixed(1):null),meta:META,
    color:'#3987e5',color2:'#6fb0f5',lineColor:'#7cc7ff',titleA:'OS TRABALHADAS × PRODUTIVAS',titleB:'PRODUTIVIDADE DO DIA',
    onClick:i=>drill({day:byDay[i][0],label:'Dia '+dayBRf(byDay[i][0])})});
  // composição do período
  const comp=[['Pagamentos',['PAG_POS','PAG_FAT'],'#3987e5'],['Corte e supressão',['CORTE','SUP'],'#199e70'],['Restab./Religação',['RR','VIST'],'#9085e9'],['Impedimento',['IMPED'],'#d95926'],['Fim do dia',['FIMDIA'],'#5d6b80'],['Neg. infrutífera',['INFRUT'],'#c98500'],['Outros',['OUTROS'],'#3b475c']]
    .map(([n,cs,col])=>({n,cs,col,v:rows.filter(r=>cs.includes(r.cat)).length})).filter(x=>x.v);
  const ct=comp.reduce((s,x)=>s+x.v,0)||1;
  $('#cComp').innerHTML=`<div class="cstrip">${comp.map(x=>`<button type="button" data-cs='${JSON.stringify(x.cs)}' style="flex:${x.v};background:${x.col}" data-tip="<b>${x.n}</b><br>${fmt(x.v)} OS · ${pct(x.v,ct)}%"></button>`).join('')}</div>
    <div class="clegs">${comp.map(x=>`<button type="button" data-cs='${JSON.stringify(x.cs)}'><i style="background:${x.col}"></i><span>${x.n}</span><b>${pct(x.v,ct,0)}%</b><em>${fmt(x.v)}</em></button>`).join('')}</div>`;
  $('#cComp').querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{const cs=JSON.parse(b.dataset.cs);drill({cats:cs,label:cs.map(c=>CAT_LBL[c]).join(' + ')})});
}

/* ---------- Comercial / POS ---------- */

  const byR=[...groupBy(pos,r=>r.res)].map(([k,rs])=>({k,n:rs.length,cat:rs[0].cat})).sort((a,b)=>b.n-a.n);
  const byC=[...groupBy(rows,r=>r.eq)].map(([k,rs])=>{const p=rs.filter(r=>r.tipo==='POS');const ap=agg(p);return {k,posRec:p.length,posTrab:ap.trab,posPag:ap.PAG_POS,posFat:ap.PAG_FAT,inf:ap.INFRUT,cPag:rs.filter(r=>r.tipo!=='POS'&&r.cat==='PAG_POS').length,cFat:rs.filter(r=>r.tipo!=='POS'&&r.cat==='PAG_FAT').length}}).sort((a,b)=>(b.posPag+b.cPag)-(a.posPag+a.cPag));
  const conv=P.trab?(P.PAG_POS+P.PAG_FAT)/P.trab*100:0;
  const byDay=[...groupBy(rows,r=>r.day)].sort((a,b)=>a[0]<b[0]?-1:1);
  const K=(lab,val,sub,cls,dr)=>`<button type="button" class="kpi ${cls||''}" data-dr='${dr}'><span class="lab">${lab}</span><span class="val">${val}</span><span class="sub">${sub}</span></button>`;
  v.innerHTML=`<div class="kpis">
   ${K('OS Negociação POS',fmt(P.rec),`${fmt(P.trab)} trabalhadas`,'','{"tipo":"POS"}')}
   ${K('Pagamento efetivado',fmt(P.PAG_POS),'em OS de negociação POS','pg','{"tipo":"POS","cats":["PAG_POS"]}')}
   ${K('Faturas apresentadas',fmt(P.PAG_FAT),'em OS de negociação POS','pg','{"tipo":"POS","cats":["PAG_FAT"]}')}
   ${K('Negociação infrutífera',fmt(P.INFRUT),`${pct(P.INFRUT,P.trab)}% das trabalhadas`,'sp','{"tipo":"POS","cats":["INFRUT"]}')}
   ${K('Conversão POS',conv.toFixed(1).replace('.',',')+'%','(pagamentos + faturas) ÷ trabalhadas','g','{"tipo":"POS","cats":["PAG_POS","PAG_FAT"]}')}
   ${K('Pagamentos no corte',fmt(pagCorte.length),`${fmt(pagCorte.filter(r=>r.cat==='PAG_POS').length)} via POS · ${fmt(pagCorte.filter(r=>r.cat==='PAG_FAT').length)} faturas`,'','{"corte":1}')}
  </div>
  <div class="g2">
   <div class="panel"><h3>Pagamentos por dia <small>todos os serviços</small></h3><div class="chartbox tall"><div id="cPag" class="svgc"></div></div></div>
   <div class="panel"><h3>Resultados das OS de negociação POS</h3><div class="chartbox tall"><div id="cPosR" class="svgc"></div></div></div>
  </div>
  <div class="panel"><h3>Comercial por colaborador</h3><div class="tw"><table><thead><tr><th>Colaborador</th><th class="n">OS POS recebidas</th><th class="n">POS trabalhadas</th><th class="n">Pag. efetivado (POS)</th><th class="n">Faturas (POS)</th><th class="n">Infrutíferas</th><th class="n">Conversão POS</th><th class="n">Pgto via POS no corte</th><th class="n">Faturas no corte</th><th class="n">Total pagamentos</th></tr></thead><tbody>
   ${byC.map(c=>`<tr data-c="${esc(c.k)}"><td>${esc(nomeDe(c.k))}</td><td class="n">${c.posRec}</td><td class="n">${c.posTrab}</td><td class="n">${c.posPag}</td><td class="n">${c.posFat}</td><td class="n">${c.inf}</td><td class="n">${c.posTrab?pct(c.posPag+c.posFat,c.posTrab)+'%':'—'}</td><td class="n">${c.cPag}</td><td class="n">${c.cFat}</td><td class="n"><b>${c.posPag+c.posFat+c.cPag+c.cFat}</b></td></tr>`).join('')}
  </tbody></table></div><p class="note">Valor recebido (R$) e forma de pagamento não constam nesta base, por isso não são exibidos.</p></div>`;
  v.querySelectorAll('.kpi').forEach(b=>b.onclick=()=>{const d=JSON.parse(b.dataset.dr);if(d.corte)drill({cats:['PAG_POS','PAG_FAT'],notPos:1,label:'Pagamentos em OS de corte/supressão'});else drill({tipo:d.tipo,cats:d.cats||null,label:'Negociação POS'+(d.cats?' · '+d.cats.map(c=>CAT_LBL[c]).join(' + '):'')})});
  v.querySelectorAll('tr[data-c]').forEach(tr=>tr.onclick=()=>drill({eqs:[tr.dataset.c],cats:['PAG_POS','PAG_FAT'],label:'Pagamentos de '+nomeDe(tr.dataset.c)}));

    onClick:i=>drill({day:byDay[i][0],cats:['PAG_POS','PAG_FAT'],label:'Pagamentos · '+dayBRf(byDay[i][0])})});
  chart('cPosR','hbars',{labels:byR.map(x=>x.k),data:byR.map(x=>x.n),colors:byR.map(x=>isProd(x.cat)?COL.corte:x.cat==='INFRUT'?COL.inf:x.cat==='FIMDIA'?COL.fim:COL.imp),fmt:fmt,
    tip:i=>`<b>${esc(byR[i].k)}</b><br>${fmt(byR[i].n)} (${pct(byR[i].n,P.rec)}%)`,onClick:i=>drill({tipo:'POS',res:byR[i].k,label:'POS · '+byR[i].k})});
}

/* ---------- Jornada ---------- */
function vJornada(v,rows){
  const base=rows.filter(isBaixa);
  const durOS=r=>r.ini&&r.fim>=r.ini?(r.fim-r.ini)/6e4:0;
  const cd=[...groupBy(base,r=>r.eq+'|'+r.day)].map(([k,all])=>{const [eq,day]=k.split('|');
    const rs=all.filter(r=>!r.sus);const use=rs.length?rs:all;
    const first=use.reduce((m,r)=>(r.ini||r.fim)<(m.ini||m.fim)?r:m),last=use.reduce((m,r)=>r.fim>m.fim?r:m);
    const lastAll=all.reduce((m,r)=>r.fim>m.fim?r:m);
    const a=first.ini||first.fim,b=last.fim;const exec=use.reduce((s,r)=>s+durOS(r),0);
    const d0=new Date(a),d1=new Date(b);
    return {eq,day,a,b,first,last,lastAll,m0:d0.getHours()*60+d0.getMinutes(),m1:d1.getHours()*60+d1.getMinutes(),span:(b-a)/6e4,exec,n:use.length,sus:all.length-rs.length}});
  const byC=[...groupBy(cd,x=>x.eq)].map(([k,xs])=>{const avg=f=>xs.reduce((s,x)=>s+f(x),0)/xs.length;const nOS=xs.reduce((s,x)=>s+x.n,0);
    return {k,dias:xs.length,ini:avg(x=>x.m0),fim:avg(x=>x.m1),span:avg(x=>x.span),exec:avg(x=>x.exec),n:avg(x=>x.n),porOS:xs.reduce((s,x)=>s+x.exec,0)/Math.max(1,nOS),tarde:xs.filter(x=>x.m0>9*60).length,sus:xs.reduce((s,x)=>s+x.sus,0)}}).sort((a,b)=>a.ini-b.ini);
  const ld=lastDay(base);const today=cd.filter(x=>x.day===ld).sort((a,b)=>a.m0-b.m0);
  const susList=rows.filter(r=>r.sus).sort((a,b)=>b.fim-a.fim);
  v.innerHTML=`<div class="panel"><h3>Janela de trabalho por colaborador <small>${ld?dayBRf(ld):''} · chegada na 1ª OS até a última baixa válida</small></h3><div id="cJan" class="svgc"></div></div>
  <div class="panel rules-box"><h3>Como a jornada é calculada</h3><ul class="note rules">
   <li><b>1ª OS</b> = horário de <b>início</b> do primeiro serviço do dia (chegada no local).</li>
   <li><b>Última baixa</b> = horário de <b>fim</b> do último serviço válido do dia.</li>
   <li><b>Tempo em serviço</b> = soma de (fim − início) de cada OS. Aparece à parte e não altera a 1ª OS nem a última baixa.</li>
   <li>Não valem como 1ª OS ou última baixa: <b>“Fim do Dia”</b> e <b>baixas fora do local</b>.</li>
   <li><b>Baixa fora do local</b>: baixa em <b>outro bairro</b> feita até <b>${SUS_GAP} min</b> depois da baixa anterior, sem tempo para o deslocamento, e as baixas seguintes da mesma sequência. Também entram aqui as baixas lançadas às 23:59. A planilha do GeoCall não traz GPS; por isso a checagem usa o bairro e o horário de cada OS.</li>
  </ul></div>
  <div class="panel"><h3>Resumo da jornada no período <small>médias por dia trabalhado</small></h3><div class="tw"><table><thead><tr><th>Colaborador</th><th class="n">Dias</th><th class="n">1ª OS (média)</th><th class="n">Última baixa (média)</th><th class="n">Janela média</th><th class="n">Tempo em serviço/dia</th><th class="n">Min. por OS</th><th class="n">OS válidas/dia</th><th class="n">Dias com 1ª OS após 09:00</th><th class="n">Baixas fora do local</th></tr></thead><tbody>
  ${byC.map(c=>`<tr data-c="${esc(c.k)}"><td>${esc(nomeDe(c.k))}</td><td class="n">${c.dias}</td><td class="n">${minToHM(c.ini)}</td><td class="n">${minToHM(c.fim)}</td><td class="n">${minToHM(c.span)}</td><td class="n">${minToHM(c.exec)}</td><td class="n">${c.porOS.toFixed(1).replace('.',',')}</td><td class="n">${c.n.toFixed(1).replace('.',',')}</td><td class="n" style="color:${c.tarde?'var(--amber)':'inherit'}">${c.tarde}</td><td class="n" style="color:${c.sus?'var(--amber)':'inherit'}">${c.sus}</td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="panel"><h3>Jornada diária detalhada <small>clique para abrir as OS do dia</small></h3><div class="tw"><table><thead><tr><th>Dia</th><th>Colaborador</th><th class="n">1ª OS (início)</th><th>Local da 1ª OS</th><th class="n">Última baixa</th><th>Local da última baixa</th><th class="n">Janela</th><th class="n">Tempo em serviço</th><th class="n">OS</th><th class="n">Última baixa registrada</th></tr></thead><tbody>
  ${cd.sort((a,b)=>a.day<b.day?1:a.day>b.day?-1:a.m0-b.m0).map(x=>`<tr data-d="${x.day}" data-c="${esc(x.eq)}"><td>${dayBRf(x.day)}</td><td>${esc(nomeDe(x.eq))}</td><td class="n">${hhmm(x.a)}</td><td>${cptA(x.first.end)} <span class="muted">· ${esc(x.first.bai)}</span></td><td class="n">${hhmm(x.b)}</td><td>${cptA(x.last.end)} <span class="muted">· ${esc(x.last.bai)}</span></td><td class="n">${minToHM(x.span)}</td><td class="n">${minToHM(x.exec)}</td><td class="n">${x.n}</td><td class="n">${x.sus?`<span style="color:var(--amber)" title="${x.sus} baixa(s) fora do local desconsiderada(s)">${hhmm(x.lastAll.fim)} ⚠</span>`:'<span class="muted">igual</span>'}</td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="panel"><h3>Baixas fora do local <small>${fmt(susList.length)} no período · não contam como 1ª OS ou última baixa</small></h3><div class="tw"><table><thead><tr><th>Data / hora</th><th>Colaborador</th><th>OS</th><th>Endereço · bairro</th><th>Baixa anterior</th><th class="n">Intervalo</th><th>Resultado</th></tr></thead><tbody>
  ${susList.map(r=>`<tr data-os="${esc(r.os)}"><td>${dayBRf(r.day)} ${hhmm(r.ini)}–${hhmm(r.fim)}</td><td>${esc(nomeDe(r.eq))}</td><td>${osn(r.os)}</td><td>${cptA(r.end)} <span class="muted">· ${esc(r.bai)}</span></td><td>${r.susPrev?`${hhmm(r.susPrev.fim)} <span class="muted">· ${esc(r.susPrev.bai)}</span>`:'<span class="muted">lançada às 23:59</span>'}</td><td class="n">${r.susPrev?r.susGap+' min':'—'}</td><td>${esc(r.res)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Nenhuma baixa fora do local no período.</td></tr>'}
  </tbody></table></div></div>`;
  v.querySelectorAll('tr[data-d]').forEach(tr=>tr.onclick=()=>drill({eqs:[tr.dataset.c],day:tr.dataset.d,label:nomeDe(tr.dataset.c)+' · '+dayBRf(tr.dataset.d)}));
  v.querySelectorAll('tbody tr[data-c]:not([data-d])').forEach(tr=>tr.onclick=()=>drill({eqs:[tr.dataset.c],label:'Colaborador: '+nomeDe(tr.dataset.c)}));
  bindOsRows(v);
  const lo=Math.min(6,...today.map(x=>Math.floor(x.m0/60))),hi=Math.max(19,...today.map(x=>Math.ceil(x.m1/60)));const tk=[];for(let h=lo;h<=hi;h+=2)tk.push(h);
  chart('cJan','hbars',{labels:today.map(x=>nomeDe(x.eq)),data:today.map(x=>[x.m0/60,Math.max(x.m1,x.m0+5)/60]),color:'rgba(47,134,246,.8)',range:true,rowH:30,xMin:lo,xMax:hi,ticks:tk,tickFmt:h=>pad(h)+'h',
    tip:i=>{const x=today[i];return `<b>${esc(nomeDe(x.eq))}</b><br>1ª OS ${hhmm(x.a)} · ${esc(x.first.bai)}<br>Última baixa ${hhmm(x.b)} · ${esc(x.last.bai)}<br>${x.n} OS · ${minToHM(x.exec)} em serviço${x.sus?`<br>${x.sus} baixa(s) fora do local desconsiderada(s)`:''}`},
    onClick:i=>drill({eqs:[today[i].eq],day:today[i].day,label:nomeDe(today[i].eq)+' · '+dayBRf(today[i].day)})});
}

/* ---------- Colaboradores ---------- */

  ${list.map((a,i)=>`<tr data-c="${esc(a.k)}"><td>${i+1}</td><td>${esc(nomeDe(a.k))}${REG[a.k].ativo===false?' <span class="st f">inativo</span>':''}</td><td>${esc(equipeDe(a.k))}</td><td class="n">${a.dias}</td><td class="n">${fmt(a.rec)}</td><td class="n">${fmt(a.trab)}</td><td class="n">${fmt(a.prod)}</td><td class="n" style="color:${a.rec?(a.pr>=META?'var(--green)':'#fca5a5'):'inherit'}">${a.rec?pct(a.prod,a.den)+'%':'—'}</td><td class="n">${a.pag}</td><td class="n">${a.CORTE}</td><td class="n">${a.SUP}</td><td class="n">${a.FIMDIA}</td><td class="n">${a.IMPED}</td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="panel"><h3>Cadastro de colaboradores <small>salvo neste navegador · permanece entre importações</small></h3>
  <div class="tw"><table><thead><tr><th>Nome na base (GeoCall)</th><th>Equipe</th><th>Ativo</th><th>Primeira aparição</th></tr></thead><tbody>
  ${names.map((n,i)=>`<tr><td>${esc(n)}</td><td><input class="cad" id="cad-eq-${i}" data-n="${esc(n)}" value="${esc(REG[n].equipe||'')}" aria-label="Equipe de ${esc(n)}"></td><td><input type="checkbox" id="cad-at-${i}" data-n="${esc(n)}" ${REG[n].ativo!==false?'checked':''} aria-label="Ativo"></td><td>${dayBRf(REG[n].desde||'')}</td></tr>`).join('')}
  </tbody></table></div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="cadSave">Salvar cadastro</button><span class="note">Colaboradores novos entram automaticamente ao importar planilhas e nunca são removidos.</span></div></div>`;
  v.querySelectorAll('tr[data-c]').forEach(tr=>tr.onclick=()=>drill({eqs:[tr.dataset.c],label:'Colaborador: '+nomeDe(tr.dataset.c)}));
  $('#cadSave').onclick=()=>{v.querySelectorAll('input.cad').forEach(i=>{REG[i.dataset.n].equipe=i.value.trim()||title(i.dataset.n)});v.querySelectorAll('input[type=checkbox][data-n]').forEach(i=>REG[i.dataset.n].ativo=i.checked);
    saveReg();toast('Cadastro salvo.');fillSelects();render()};
}

/* ---------- Gargalos ---------- */
function vGargalos(v,rows){
  const A=agg(rows);
  const nprod=rows.filter(r=>!isProd(r.cat));
  const mot=[...groupBy(nprod,r=>r.res)].map(([k,rs])=>({k,n:rs.length,cat:rs[0].cat})).sort((a,b)=>b.n-a.n);
  const fimC=[...groupBy(rows,r=>r.eq)].map(([k,rs])=>({k,f:rs.filter(r=>r.cat==='FIMDIA').length,t:rs.length})).sort((a,b)=>b.f-a.f);

   ${fechB.map(b=>`<tr data-b="${esc(b.k)}"><td>${esc(b.k)}</td><td>${esc(b.sf)}</td><td class="n">${b.n}</td><td style="width:35%"><div class="bar"><i style="width:${b.n/fechB[0].n*100}%;background:var(--red)"></i></div></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Nenhum</td></tr>'}

/* ---------- Não executadas por bairro ---------- */
const MOTIVOS=[
 ['IMOVEL FECHADO, REPROGRAMAR ORDEM','Imóvel fechado · reprogramar'],
 ['IMOVEL FECHADO, ORDEM ENCERRADA','Imóvel fechado · encerrada'],
 ['CLIENTE NAO PERMITIU EXECUCAO DO SERVICO','Cliente não permitiu'],
 ['NUMERO/IMOVEL NAO LOCALIZADO','Nº/imóvel não localizado'],
 ['DIFICULDADE TECNICA DE EXECUCAO','Dificuldade técnica'],
 ['NADA CONSTA NO LOCAL','Nada consta no local'],
 ['NEGOCIACAO INFRUTIFERA','Negociação infrutífera'],
 ['CLIENTE INFORMOU PAGAMENTO DAS FATURAS','Cliente informou pagamento']];
let BAI={sf:'',q:'',sort:'ne'};
function bairroPanel(rows){
  const p=$('#pBai');if(!p)return;
  const setores=[...new Set(rows.map(r=>r.sf||'—'))].sort((a,b)=>(+a||0)-(+b||0));
  const motKey=r=>{const n=norm(r.res);const i=MOTIVOS.findIndex(m=>m[0]===n);return i>=0?i:MOTIVOS.length};
  const mk=(sf,bai,rs)=>{const o={sf,bai,rec:rs.length,ex:0,ne:0,fim:0,m:new Array(MOTIVOS.length+1).fill(0)};
    for(const r of rs){if(isProd(r.cat))o.ex++;else if(r.cat==='FIMDIA')o.fim++;else{o.ne++;o.m[motKey(r)]++}}o.fech=o.m[0]+o.m[1];return o};
  const q=norm(BAI.q);
  const base=rows.filter(r=>(!BAI.sf||(r.sf||'—')===BAI.sf)&&(!q||norm(r.bai).includes(q)));
  const bySf=[...groupBy(base,r=>r.sf||'—')].sort((a,b)=>(+a[0]||0)-(+b[0]||0));
  const sortF={ne:(a,b)=>b.ne-a.ne,fech:(a,b)=>b.fech-a.fech,bai:(a,b)=>a.bai<b.bai?-1:1,pct:(a,b)=>b.ne/b.rec-a.ne/a.rec}[BAI.sort];
  const cell=(n,sf,bai,res)=>n?`<td class="n c" data-sf="${esc(sf)}" data-bai="${esc(bai)}" data-res="${esc(res)}">${fmt(n)}</td>`:'<td class="n z">·</td>';
  const line=(o,cls,lab)=>`<tr class="${cls||''}"><td>${esc(o.sf)}</td><td>${lab||esc(o.bai)}</td><td class="n">${fmt(o.rec)}</td><td class="n" style="color:var(--green)">${fmt(o.ex)}</td>`+
    `${cell(o.ne,o.sf,o.bai,'__NE')}<td class="n">${pct(o.ne,o.rec,0)}%</td>`+
    MOTIVOS.map((m,i)=>cell(o.m[i],o.sf,o.bai,m[0])).join('')+cell(o.m[MOTIVOS.length],o.sf,o.bai,'__OUT')+
    `<td class="n fd">${o.fim?fmt(o.fim):'·'}</td></tr>`;
  let body='';const tot=mk('Todos','',[]);
  for(const [sf,rs] of bySf){
    const bs=[...groupBy(rs,r=>r.bai||'(SEM BAIRRO)')].map(([b,x])=>mk(sf,b,x)).sort(sortF);
    const st=mk(sf,'',rs);
    ['rec','ex','ne','fim','fech'].forEach(k=>tot[k]+=st[k]);st.m.forEach((v,i)=>tot.m[i]+=v);
    body+=line(st,'sub',`<b>Setor ${esc(sf)}</b> <span class="muted small">${bs.length} bairro${bs.length>1?'s':''}</span>`).replace(/data-bai=""/g,'data-bai=""')+bs.map(o=>line(o)).join('');
  }
  const nB=new Set(base.map(r=>(r.sf||'—')+'|'+r.bai)).size;
  p.innerHTML=`<h3>Não executadas por bairro e motivo <small>${fmt(nB)} bairros em ${bySf.length} setores · clique num número para abrir as OS</small></h3>
   <div class="filters" style="margin-bottom:10px">
    <div class="fgroup"><label for="baiSf">Setor (SF)</label><select id="baiSf"><option value="">Todos os setores</option>${setores.map(s=>`<option ${s===BAI.sf?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
    <div class="fgroup" style="flex:1 1 200px"><label for="baiQ">Buscar bairro</label><input id="baiQ" value="${esc(BAI.q)}" placeholder="ex.: Jd Tiete"></div>
    <div class="fgroup"><label for="baiSort">Ordenar bairros por</label><select id="baiSort"><option value="ne">Mais não executadas</option><option value="fech">Mais imóvel fechado</option><option value="pct">Maior % não executada</option><option value="bai">Nome do bairro</option></select></div>
   </div>
   <div class="tw"><table class="bt" data-limit="60"><thead><tr><th>Setor</th><th>Bairro</th><th class="n">Recebidas</th><th class="n">Executadas</th><th class="n">Não exec.</th><th class="n">% não exec.</th>${MOTIVOS.map(m=>`<th class="n">${m[1]}</th>`).join('')}<th class="n">Outros</th><th class="n">Fim do dia</th></tr></thead>
   <tbody>${body||'<tr><td colspan="16" class="muted">Nenhum bairro encontrado.</td></tr>'}</tbody><tfoot>${line(tot,'','<b>Total</b>').replace(/<td class="n c"[^>]*>/g,'<td class="n">')}</tfoot></table></div>
   <p class="note">Executadas = resultados produtivos. Não executadas = todos os outros resultados, separados por motivo. “Fim do Dia” não é execução nem não execução: aparece à parte e não entra no total de não executadas.</p>`;
  enhance(p);
  $('#baiSort').value=BAI.sort;
  $('#baiSf').onchange=e=>{BAI.sf=e.target.value;bairroPanel(rows)};
  $('#baiSort').onchange=e=>{BAI.sort=e.target.value;bairroPanel(rows)};
  let t;$('#baiQ').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{BAI.q=e.target.value;bairroPanel(rows);const i=$('#baiQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)};
  p.querySelectorAll('td.c').forEach(td=>td.onclick=()=>{const sf=td.dataset.sf,bai=td.dataset.bai,res=td.dataset.res;
    const o={sf:sf==='—'?'':sf,bai,label:(bai||'Setor '+sf)};
    if(res==='__NE'){o.naoExec=1;o.label+=' · não executadas'}
    else if(res==='__OUT'){o.cats=['OUTROS'];o.label+=' · outros'}
    else{const r=rows.find(x=>norm(x.res)===res);o.res=r?r.res:res;o.label+=' · '+o.res}
    drill(o)});
}

     <label class="plt"><input type="checkbox" data-pl="${esc(s.id)}" ${s.ativa?'checked':''}><span><b>${esc(s.nome)}</b><small>${s.builtin?'planilha inicial':'importada em '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}</small></span></label>

     <div class="pla"><button class="btn ghost sm" type="button" data-only="${esc(s.id)}">Ver só esta</button>${s.builtin?'':(PL_DEL===s.id?`<span class="small">Remover de vez?</span><button class="btn sm danger" type="button" data-del="${esc(s.id)}">Sim, remover</button><button class="btn ghost sm" type="button" data-nodel="1">Cancelar</button>`:`<button class="btn ghost sm" type="button" data-ask="${esc(s.id)}">Remover</button>`)}</div></div>`}).join('')}</div>
   <p class="note">Marque ou desmarque para escolher quais planilhas entram nos indicadores. Nada é apagado ao desmarcar. As planilhas marcadas são somadas; se a mesma execução (mesma OS, horário, colaborador e resultado) estiver em mais de uma, ela conta uma vez só. Ao todo são ${fmt(tot)} linhas guardadas.</p></div>`;
  $('#plImp').onclick=()=>$('#file').click();

  v.querySelectorAll('[data-only]').forEach(b=>b.onclick=()=>{SHEETS.forEach(s=>{const on=s.id===b.dataset.only;if(s.ativa!==on){s.ativa=on;dbSetAtiva(s)}});lsSave();$('#fPer').value='ALL';refreshAll();toast('Mostrando só esta planilha.')});
  v.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{PL_DEL=b.dataset.ask;render()});

  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const s=SHEETS.find(x=>x.id===b.dataset.del);PL_DEL=null;SHEETS=SHEETS.filter(x=>x!==s);
    try{await dbDeleteSheet(s,s.partes||Math.ceil(s.recs.length/300)+2)}catch(e){console.error(e)}lsSave();refreshAll();toast('Planilha removida.')});

function vOS(v,rows){
  const D=DRILL;
  let list=rows.filter(r=>(!D.rr||isRR(r))&&(!D.cats||D.cats.includes(r.cat))&&(!D.res||r.res===D.res)&&(!D.tipo||r.tipo===D.tipo)&&(!D.os||r.os===D.os)&&(!D.eqs||D.eqs.includes(r.eq))&&(!D.day||r.day===D.day)&&(!D.notPos||r.tipo!=='POS')&&(!D.bai||r.bai===D.bai)&&(!D.sf||r.sf===D.sf)&&(!D.fech||/^IMOVEL FECHADO/.test(norm(r.res)))&&(!D.naoExec||(!isProd(r.cat)&&r.cat!=='FIMDIA')));
  const q=norm(D.q||'');
  if(q)list=list.filter(r=>norm([r.os,r.pde,r.bai,r.sf,r.end,r.eq,r.res,r.nota,equipeDe(r.eq)].join(' ')).includes(q));
  list.sort((a,b)=>b.fim-a.fim);

   <div class="filters" style="margin-bottom:10px">

    <div class="fgroup"><label for="osCat">Classificação</label><select id="osCat"><option value="">Todas</option><option value="PROD">Produtivos</option>${Object.keys(CAT_LBL).map(c=>`<option value="${c}">${CAT_LBL[c]}</option>`).join('')}</select></div>
    <div class="fgroup" style="flex:1 1 220px"><label for="osRes">Resultado original</label><select id="osRes"><option value="">Todos</option>${results.map(r=>`<option ${r===D.res?'selected':''}>${esc(r)}</option>`).join('')}</select></div>
    <button class="btn ghost" type="button" id="osNums">Copiar nº das OS</button><button class="btn ghost" type="button" id="osCsv">Copiar para Excel</button>
   </div>
   ${D.label||D.eqs||D.day||D.bai?`<div class="chips" style="margin-bottom:8px"><span class="chip x" id="osClr" title="Limpar filtro">${esc(D.label||'Filtro ativo')}</span></div>`:''}
   ${osCards(slice,true)}<div class="tw ostable"><table class="det"><thead><tr><th>Data / hora</th><th>OS · PDE</th><th>Endereço · bairro</th><th>Colaborador</th><th>Serviço</th><th>Resultado</th><th>Status · tempo</th><th>Nota de execução</th></tr></thead><tbody>
   ${slice.map(r=>`<tr><td>${dayBRf(r.day)}<br><span class="cpw"><span class="muted">${hhmm(r.fim)}</span>${cpBtn(osLine(r),'OS '+r.os+' completa')}</span></td><td><b>${osn(r.os)}</b><br><span class="muted cpw">PDE ${cpt(r.pde,'PDE')}</span></td><td>${cptA(r.end)}<br><span class="muted">${esc(r.bai)}${r.sf?' · setor '+esc(r.sf):''}</span></td><td>${esc(nomeDe(r.eq))}${equipeDe(r.eq)!==nomeDe(r.eq)?`<br><span class="muted">${esc(equipeDe(r.eq))}</span>`:''}</td><td>${TIPO_LBL[r.tipo]}</td><td>${esc(r.res)}<br><span class="st ${isProd(r.cat)?'p':CAT_ST[r.cat]}" style="margin-top:3px">${isProd(r.cat)?'Produtivo':CAT_LBL[r.cat]}</span></td><td>${esc(r.st)}<br><span class="muted">em serviço ${minToHM(r.ini&&r.fim>=r.ini?(r.fim-r.ini)/6e4:0)}</span>${r.sus?`<br><span class="st i" title="${esc(r.susWhy)}">⚠ fora do local</span>`:''}</td><td class="nt">${r.nota?esc(r.nota)+cpBtn(r.nota,'nota da OS '+r.os):'<span class="muted">—</span>'}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">Nenhuma OS encontrada com esses filtros.</td></tr>'}

    copyText(csv,fmt(list.length)+' linhas (cole no Excel)');
  };
}

/* ============ filtros UI ============ */
function fillSelects(){

  const e=$('#fEq'),c=$('#fCol');const ev=e.value,cv=c.value;
  e.innerHTML='<option value="">Todas</option>'+eqs.map(x=>`<option>${esc(x)}</option>`).join('');e.value=eqs.includes(ev)?ev:'';
  const cols=Object.keys(REG).filter(n=>!e.value||equipeDe(n)===e.value).sort();
  c.innerHTML='<option value="">Todos</option>'+cols.map(n=>`<option value="${esc(n)}">${esc(nomeDe(n))}</option>`).join('');c.value=cols.includes(cv)?cv:'';
}
function setPeriod(){
  const p=$('#fPer').value;const sc=scope();
  if(p==='CUSTOM')return;
  if(p==='ALL'){const ds=sc.map(r=>r.day).sort();$('#fIni').value=ds[0]||'';$('#fFim').value=ds[ds.length-1]||'';return}
  const y=+p.slice(0,4),m=+p.slice(5);$('#fIni').value=p+'-01';$('#fFim').value=p+'-'+pad(new Date(y,m,0).getDate());
}
function readF(){F.ini=$('#fIni').value;F.fim=$('#fFim').value;F.eq=$('#fEq').value;F.col=$('#fCol').value;F.tipo=$('#fTipo').value}
function info(){
  const at=SHEETS.filter(s=>s.ativa).length;
  $('#fileInfo').textContent=`${at} de ${SHEETS.length} planilha${SHEETS.length>1?'s':''} ativa${at>1?'s':''} · ${fmt(ROWS.length)} execuções`+(DBSTATE==='carregando'?' · abrindo planilhas guardadas…':'');
  $('#fileInfo').title=SOURCES.join('\n');
  $('#srcInfo').textContent='Fonte: GeoCall WFM · '+(SOURCES.length?SOURCES.join(', '):'nenhuma planilha ativa');
}
function bindFilters(){
  $('#fPer').onchange=()=>{setPeriod();readF();render()};
  ['#fIni','#fFim'].forEach(s=>$(s).onchange=()=>{$('#fPer').value='CUSTOM';readF();render()});
  $('#fEq').onchange=()=>{fillSelects();readF();render()};
  $('#fCol').onchange=$('#fTipo').onchange=()=>{readF();render()};
  $('#btnUpd').onclick=()=>{readF();render();toast('Indicadores atualizados.')};
  $('#btnFile').onclick=()=>$('#file').click();
  $('#file').onchange=async e=>{const files=[...e.target.files];e.target.value='';if(files.length)await importFiles(files)};
}
function applyCfgText(){try{if(CFG.titulo)document.querySelector('.title h1').textContent=CFG.titulo;if(CFG.subtitulo)document.querySelector('.title h2').textContent=CFG.subtitulo;if(CFG.unidade)document.querySelector('.brand b').textContent=CFG.unidade}catch(e){}}
applyCfgText();
function tick(){const d=new Date();$('#clock').innerHTML=`<b>${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()].charAt(0)+MESES[d.getMonth()].slice(1).toLowerCase()} de ${d.getFullYear()}</b>${pad(d.getHours())}:${pad(d.getMinutes())}`}

/* ============ início ============ */
function startApp(){REG=LS.get(REG_KEY,{});loadSeed();rebuild();buildNav();fillSelects();setPeriod();readF();bindFilters();info();tick();setInterval(tick,20000);render();initStore();
  if(SECURE){const b=document.createElement('button');b.type='button';b.className='btn ghost sm lockbtn';b.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Bloquear';b.onclick=()=>location.reload();const c=$('.clock');if(c)c.appendChild(b);
    let idle=0;const reset=()=>{clearTimeout(idle);idle=setTimeout(()=>location.reload(),(+CFG.bloquearAposMinutos||15)*60000)};['pointerdown','keydown','scroll','touchstart'].forEach(ev=>addEventListener(ev,reset,{passive:true}));reset()}}
function lockScreen(){
  const has=!!localStorage.getItem(VAULT);const ov=document.createElement('div');ov.className='lock';
  const logo=document.querySelector('.slogo');
  ov.innerHTML=`<div class="lock-bg"><i></i><i></i><i></i></div><form class="lock-card" id="lkF" autocomplete="off">
    ${logo?`<img src="${logo.src}" alt="Sabesp" class="lock-logo">`:''}<span class="lock-eyb">Primarização · Gestão Operacional</span>
    <h2>${has?'Painel protegido':'Proteja o painel'}</h2>
    <p>${has?'Digite a senha para abrir os dados guardados neste navegador.':'Crie uma senha para cifrar as planilhas, anotações e cadastro guardados neste navegador. Use uma frase com 4 ou mais palavras.'}</p>
    <label for="lkP">Senha</label><input type="password" id="lkP" autocomplete="${has?'current-password':'new-password'}" required minlength="${has?1:12}" autofocus>
    ${has?'':`<div class="lk-meter"><i id="lkM"></i></div><small id="lkMs">Mínimo de 12 caracteres</small><label for="lkP2">Repita a senha</label><input type="password" id="lkP2" autocomplete="new-password" required>`}
    <button class="btn" type="submit" id="lkB">${has?'Desbloquear':'Criar senha e entrar'}</button><p class="lk-err" id="lkE" role="alert"></p>
    ${has?`<div class="lk-forget"><button type="button" id="lkF1">Esqueci a senha</button><div id="lkF2" hidden>Sem a senha não há como recuperar os dados. Apagar tudo deste navegador e começar de novo? <button type="button" class="btn sm danger" id="lkF3">Apagar e recomeçar</button></div></div>`:''}
    <small class="lk-foot">Cifragem AES-256-GCM · chave derivada da senha com PBKDF2-SHA256 (${(PBKDF2_IT/1000).toFixed(0)} mil iterações) · nada sai deste navegador</small></form>`;
  document.body.appendChild(ov);document.querySelector('.app').setAttribute('aria-hidden','true');document.querySelector('.app').classList.add('locked');
  const P=$('#lkP'),E=$('#lkE');setTimeout(()=>P.focus(),50);
  if(!has){P.oninput=()=>{const s=P.value;let sc=Math.min(4,Math.floor(s.length/5))+(/[A-Z]/.test(s)&&/[a-z]/.test(s)?1:0)+(/\d/.test(s)?1:0)+(/[^\w\s]/.test(s)||/\s/.test(s)?1:0);sc=Math.min(6,sc);
    $('#lkM').style.width=(sc/6*100)+'%';$('#lkM').style.background=sc<3?'#ef4444':sc<5?'#f5b73b':'#22c55e';$('#lkMs').textContent=s.length<12?'Mínimo de 12 caracteres':sc<3?'Fraca':sc<5?'Razoável':'Forte'}}
  if(has){$('#lkF1').onclick=()=>{$('#lkF2').hidden=false};$('#lkF3').onclick=()=>{[VAULT,...SEC_KEYS].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()}}
  let tries=0;
  $('#lkF').onsubmit=async e=>{e.preventDefault();E.textContent='';const pw=P.value;
    if(!has){if(pw.length<12){E.textContent='Use pelo menos 12 caracteres.';return}if(pw!==$('#lkP2').value){E.textContent='As senhas não conferem.';return}}
    $('#lkB').disabled=true;$('#lkB').textContent='Abrindo…';
    try{if(has)await vaultOpen(pw);else await vaultCreate(pw);ov.remove();document.querySelector('.app').removeAttribute('aria-hidden');document.querySelector('.app').classList.remove('locked');startApp()}
    catch(err){tries++;$('#lkB').disabled=false;$('#lkB').textContent=has?'Desbloquear':'Criar senha e entrar';E.textContent='Senha incorreta.';P.value='';P.focus();
      if(tries>=3){$('#lkB').disabled=true;let s=tries*10;const iv=setInterval(()=>{E.textContent=`Senha incorreta. Tente de novo em ${s}s.`;if(--s<0){clearInterval(iv);$('#lkB').disabled=false;E.textContent=''}},1000)}}};
}
if(SECURE){if(!window.crypto||!crypto.subtle){document.body.insertAdjacentHTML('beforeend','<p style="padding:20px">Este navegador não suporta cifragem. Abra no Chrome ou Edge atualizados.</p>')}else lockScreen()}else startApp();
})();

</script>

</body></html>
